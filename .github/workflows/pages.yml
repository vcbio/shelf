name: Publish linked shelf files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Keep indexed documents and their data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stage_pages.py --root . --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
