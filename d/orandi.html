<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORANDI 조합 도우미 · ORDR 시즌2 2.314[R]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
/* ORANDI 조합 도우미 — 2026-08-20 전면 개편
   원칙: 게임 옆에 띄워두고 곁눈질한다. 큰 글씨·강한 대비·한 화면. */

:root {
  --zoom: 1;
  --bg: #f7f4ee;
  --card: #fff;
  --ink: #16222e;
  --ink-2: #58697a;
  --ink-3: #8d9aa7;
  --line: #e4ded2;
  --line-2: #cfc7b8;
  --navy: #14283c;
  --go: #1f8a5f;
  --go-soft: #e4f3ec;
  --need: #c0453f;
  --need-soft: #fbeae9;
  --amber: #e39328;
  --amber-soft: #fdf1dc;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
.empty { color: var(--ink-3); font-size: 15px; padding: 12px 2px; }

/* ── 상단 ── */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; background: rgba(247,244,238,.94); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.home-btn {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 9px;
  padding: 8px 14px; font-size: 15px; font-weight: 700; color: var(--ink); margin-right: 8px;
}
.home-btn:hover { border-color: var(--navy); }
.top { }
.modes { display: flex; gap: 4px; background: #ece7dd; border-radius: 10px; padding: 3px; }
.mode {
  border: none; background: none; border-radius: 8px;
  padding: 8px 18px; font-size: 15px; font-weight: 700; color: var(--ink-2);
}
.mode.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20,40,60,.12); }
.top-right { display: flex; gap: 6px; }
.ghost-btn {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 7px 13px; font-size: 14px; font-weight: 600; color: var(--ink-2);
}
.ghost-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.ghost-btn.danger:hover { border-color: var(--need); color: var(--need); }

/* ── 진행 화면 ── */
.run, .find { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; font-size: calc(16px * var(--zoom)); }

.pick-hero { text-align: center; padding: 48px 16px; }
.pick-hero h1 { font-size: calc(34px * var(--zoom)); font-weight: 800; margin-bottom: 12px; }
.pick-hero p { color: var(--ink-2); font-size: calc(16px * var(--zoom)); margin: 0 0 24px; line-height: 1.7; }
.big-btn {
  background: var(--navy); color: #fff; border: none; border-radius: 12px;
  padding: calc(16px * var(--zoom)) calc(34px * var(--zoom));
  font-size: calc(19px * var(--zoom)); font-weight: 700;
}
.big-btn:hover { background: #203c56; }
.big-btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--navy); }
.big-btn.ghost:hover { background: #eef2f6; }
.or-line { margin: 14px 0 !important; color: var(--ink-3) !important; font-size: 14px !important; }
.seed-card {
  display: flex; align-items: center; gap: calc(14px * var(--zoom));
  background: var(--card); border: 2px solid var(--navy); border-radius: 14px;
  padding: calc(14px * var(--zoom)) calc(18px * var(--zoom));
  margin-bottom: calc(20px * var(--zoom)); flex-wrap: wrap;
}
.seed-card > img { width: calc(54px * var(--zoom)); height: calc(54px * var(--zoom)); border-radius: 11px; }
.seed-card > div { flex: 1; min-width: 140px; }
.seed-card b { display: block; font-size: calc(24px * var(--zoom)); font-weight: 800; }
.big-btn.sm { padding: 9px 18px; font-size: 15px; border-radius: 9px; margin-top: 10px; }
.link-btn { display: block; margin: 14px auto 0; background: none; border: none; color: var(--ink-2); font-size: 15px; text-decoration: underline; }

/* 목표 카드 */
.goal-card {
  position: relative; display: flex; align-items: center; gap: calc(14px * var(--zoom));
  background: var(--card); border: 2px solid var(--navy); border-radius: 14px;
  padding: calc(14px * var(--zoom)) calc(18px * var(--zoom)) calc(18px * var(--zoom));
  margin-bottom: calc(20px * var(--zoom)); overflow: hidden; flex-wrap: wrap;
}
.goal-card.ready { border-color: var(--go); }
.goal-card > img { width: calc(58px * var(--zoom)); height: calc(58px * var(--zoom)); border-radius: 11px; }
.gc-text { flex: 1; min-width: 140px; }
.gc-label { font-size: calc(12px * var(--zoom)); font-weight: 700; color: var(--ink-3); letter-spacing: .08em; }
.gc-text b { display: block; font-size: calc(26px * var(--zoom)); font-weight: 800; line-height: 1.2; }
.gc-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.gc-pct { text-align: right; }
.gc-pct b { font-size: calc(32px * var(--zoom)); font-weight: 800; font-family: var(--mono); }
.gc-pct i { font-style: normal; font-size: calc(16px * var(--zoom)); }
.gc-pct span { display: block; font-size: calc(12px * var(--zoom)); color: var(--ink-3); }
.gc-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #ece7dd; }
.gc-bar i { display: block; height: 100%; background: var(--amber); }
.goal-card.ready .gc-bar i { background: var(--go); }

/* 레인 */
.lane { margin-bottom: calc(26px * var(--zoom)); }
.lane-h {
  display: flex; align-items: center; gap: 8px;
  font-size: calc(18px * var(--zoom)); margin-bottom: calc(10px * var(--zoom));
}
.lane-h b { font-family: var(--mono); color: var(--ink-3); font-size: calc(15px * var(--zoom)); }
.lane-h::before { content: ''; width: 5px; height: calc(20px * var(--zoom)); border-radius: 3px; background: var(--ink-3); }
.lane-h.now::before { background: var(--go); }
.lane-h.wait::before { background: var(--ink-3); }
.lane-h.mats::before { background: var(--need); }
.lane-h.next::before { background: var(--navy); }
.next-task { border: 2px solid var(--line-2) !important; opacity: 1 !important; }
.next-task:hover { border-color: var(--navy) !important; }
.fills { font-size: calc(13px * var(--zoom)); font-weight: 700; color: var(--go); background: var(--go-soft); border-radius: 5px; padding: 2px 8px; }
.t-mats .m.warn { background: var(--need-soft); color: var(--need); }
.miss { color: var(--need); }
.ok-text { color: var(--go); }
.lane-h.ok { color: var(--go); }
.lane-h.ok::before { background: var(--go); }
.lane-h.idle { color: var(--ink-3); }
.lane-note { color: var(--ink-3); font-size: calc(14px * var(--zoom)); margin: 6px 0 0; }

/* 할 일 카드 */
.task {
  display: flex; align-items: center; gap: calc(12px * var(--zoom));
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: calc(11px * var(--zoom)) calc(14px * var(--zoom)); margin-bottom: calc(7px * var(--zoom));
  flex-wrap: wrap;
}
.task.go { border: 2px solid var(--go); background: var(--go-soft); }
.task:not(.go) { opacity: .62; }
.task > img { width: calc(46px * var(--zoom)); height: calc(46px * var(--zoom)); border-radius: 9px; flex: none; }
.t-text { flex: 1; min-width: 150px; }
.t-text b { font-size: calc(19px * var(--zoom)); font-weight: 700; }
.t-mats { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.t-mats .m {
  font-size: calc(13px * var(--zoom)); background: #f0ece3; color: var(--ink-2);
  border-radius: 5px; padding: 2px 8px;
}
.t-mats .m.ok { background: var(--go-soft); color: var(--go); font-weight: 600; }
.t-mats.big .m { font-size: calc(15px * var(--zoom)); padding: 4px 11px; }
.make-btn {
  background: var(--go); color: #fff; border: none; border-radius: 10px;
  padding: calc(11px * var(--zoom)) calc(20px * var(--zoom));
  font-size: calc(16px * var(--zoom)); font-weight: 700; flex: none;
}
.make-btn:hover { background: #17734e; }
.cmd-btn {
  font-family: var(--mono); font-size: calc(13px * var(--zoom)); font-weight: 700;
  background: var(--amber-soft); color: #8a5a0c; border: 1px solid #e9d4ac;
  border-radius: 8px; padding: calc(8px * var(--zoom)) calc(12px * var(--zoom)); flex: none;
}

/* 재료 */
.mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: calc(7px * var(--zoom)); }
.mat {
  display: flex; align-items: center; gap: calc(10px * var(--zoom));
  background: var(--card); border: 1px solid var(--line); border-radius: 11px;
  padding: calc(8px * var(--zoom)) calc(12px * var(--zoom));
}
.mat > img { width: calc(40px * var(--zoom)); height: calc(40px * var(--zoom)); border-radius: 8px; flex: none; }
.mat-n { flex: 1; min-width: 0; }
.mat-n b { display: block; font-size: calc(15px * var(--zoom)); font-weight: 700; }
.mat-n small { color: var(--ink-3); font-size: calc(12px * var(--zoom)); font-family: var(--mono); }
.mat-need {
  font-family: var(--mono); font-size: calc(24px * var(--zoom)); font-weight: 700;
  color: var(--need); flex: none;
}
.mat-need i { font-style: normal; font-size: calc(12px * var(--zoom)); margin-left: 2px; }
.mat-btns { display: flex; gap: 4px; flex: none; }
.mat-btns button {
  width: calc(34px * var(--zoom)); height: calc(34px * var(--zoom));
  border-radius: 8px; border: 1px solid var(--line-2); background: var(--card);
  font-size: calc(18px * var(--zoom)); line-height: 1; display: grid; place-items: center;
}
.mat-btns button:hover { border-color: var(--go); color: var(--go); }
.mat.res { opacity: .8; }
.mat.res .mat-need { color: var(--ink-2); }

/* 만든 것 */
.drawer { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
.drawer summary { cursor: pointer; font-size: 15px; color: var(--ink-2); }
.done-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.done-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
  background: var(--go-soft); border: 1px solid #bfdfd5; border-radius: 999px; padding: 3px 12px 3px 3px;
}
.done-chip img { width: 26px; height: 26px; border-radius: 999px; }

/* ── 태그 ── */
.gr, .dt, .rt { font-size: calc(12px * var(--zoom)); font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.gr-low { background: #eee9dd; color: #6b6355; }
.gr-mid { background: #dfeaf5; color: #2f5f8a; }
.gr-high { background: #e6e1f5; color: #52439a; }
.gr-top { background: #fbe9c8; color: #8a5a0c; }
.gr-sp { background: #f2e2e2; color: #8a3d3d; }
.dt.p { background: #fde8e2; color: #a8452a; }
.dt.m { background: #e2ecfd; color: #2a5aa8; }
.dt.s { background: #efe4fb; color: #6a3aa8; }
.rt { background: #f0ece3; color: var(--ink-2); font-weight: 600; }

/* ── 영웅 찾기 ── */
.q {
  width: 100%; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px;
  padding: 13px 16px; font-size: 17px; outline: none; margin-bottom: 12px;
}
.q:focus { border-color: var(--navy); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.chip {
  background: var(--card); border: 1px solid var(--line-2); border-radius: 999px;
  padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--ink-2);
}
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

.find-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 7px; }
.hero {
  display: flex; align-items: center; gap: 11px; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 10px 13px;
}
.hero:hover { border-color: var(--navy); }
.hero.on { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.hero > img { width: 50px; height: 50px; border-radius: 9px; flex: none; }
.h-text { min-width: 0; }
.h-text b { display: block; font-size: 17px; font-weight: 700; }
.h-tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
.h-text small { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }

.detail { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 18px; }
.d-head { display: flex; gap: 16px; align-items: flex-start; }
.d-head > img { width: 76px; height: 76px; border-radius: 12px; flex: none; }
.d-head b { font-size: 24px; font-weight: 800; }
.d-facts { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.d-facts span { font-size: 14.5px; color: var(--ink-2); }
.d-facts i { font-style: normal; font-weight: 700; color: var(--ink-3); margin-right: 8px; }
.d-facts .warn { color: var(--need); }
.d-desc {
  white-space: pre-wrap; font-family: inherit; font-size: 14px; color: var(--ink-2);
  background: var(--bg); border-radius: 9px; padding: 12px 14px; margin: 16px 0 0; line-height: 1.6;
}
.d-sec { margin-top: 18px; }
.d-sec h3 { font-size: 16px; margin-bottom: 9px; }
.d-sec h3 b { font-family: var(--mono); color: var(--ink-3); font-size: 14px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.uchip {
  display: inline-flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 600;
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px 4px 4px;
}
.uchip:hover { border-color: var(--navy); }
.uchip img { width: 28px; height: 28px; border-radius: 999px; }
.uchip i { font-style: normal; font-size: 12px; color: var(--ink-3); font-weight: 500; }

/* ── 목표 고르기 시트 ── */
/* ⚠️ [hidden]은 display 선언에 덮인다. 시트·화면 전환이 안 닫히던 원인(2026-08-20 실측). */
[hidden] { display: none !important; }

.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(20,40,60,.45); display: grid; place-items: start center; padding: 40px 16px; overflow-y: auto; }
.sheet-box { background: var(--bg); border-radius: 16px; padding: 22px; width: 100%; max-width: 720px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sheet-head h2 { font-size: 22px; font-weight: 800; }
.picker-list { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
.pick-sec { padding: 14px 4px 6px; }
.pick-sec:first-child { padding-top: 0; }
.pick-sec h3 { font-size: 16px; font-weight: 800; }
.pick-sec p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-3); }
.hint-line { margin-top: 16px !important; font-size: 14.5px !important; color: var(--ink-3) !important; }
.hint-line b { color: var(--ink-2); }

.pick-row {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px;
}
.pick-row.reco { border-color: var(--amber); background: #fffaf0; }
.star { font-size: 13px; }
.tier { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.tier.light { background: var(--go-soft); color: var(--go); }
.tier.mid { background: var(--amber-soft); color: #8a5a0c; }
.tier.heavy { background: #eceff2; color: #5b6b7a; }
.sec-n { font-family: var(--mono); font-size: 13px; color: var(--ink-3); font-weight: 500; }
.pick-row:hover { border-color: var(--navy); }
.pick-row > img { width: 46px; height: 46px; border-radius: 9px; flex: none; }
.pr-text { flex: 1; min-width: 0; }
.pr-text b { display: block; font-size: 17px; font-weight: 700; }
.pr-tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 3px 0; }
.pr-text small { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
.pr-pct { font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--ink-3); flex: none; }
.pr-pct.full { color: var(--go); }

/* ── 토스트 ── */
.finished {
  display: flex; flex-direction: column; align-items: flex-start; gap: calc(10px * var(--zoom));
  background: var(--go-soft); border: 2px solid var(--go); border-radius: 14px;
  padding: calc(22px * var(--zoom)) calc(24px * var(--zoom));
}
.finished b { font-size: calc(28px * var(--zoom)); font-weight: 800; color: var(--go); }
.finished span { font-size: calc(15px * var(--zoom)); color: var(--ink-2); }
.cmd-btn.big { font-size: calc(16px * var(--zoom)); padding: calc(11px * var(--zoom)) calc(18px * var(--zoom)); }

/* 조합식 트리 */
.recipe-drawer { margin: calc(-8px * var(--zoom)) 0 calc(20px * var(--zoom)); }
.recipe-drawer summary {
  cursor: pointer; font-size: calc(15px * var(--zoom)); font-weight: 700; color: var(--navy);
  background: var(--card); border: 1px solid var(--line-2); border-radius: 10px;
  padding: calc(10px * var(--zoom)) calc(14px * var(--zoom)); list-style: none;
}
.recipe-drawer summary::before { content: '▸ '; }
.recipe-drawer[open] summary::before { content: '▾ '; }
.recipe-drawer summary::-webkit-details-marker { display: none; }
.recipe-drawer > .tree { margin-top: 12px; }

.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 16px; padding-left: 14px; border-left: 3px solid var(--amber); }
.tree li { padding: 3px 0; }
.tnode { cursor: pointer; }
.tnode:hover { border-color: var(--navy); }
.tnode .tok { color: var(--go); font-weight: 800; }
.tnode {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 11px 5px 5px;
}
.tnode.ok { background: var(--go-soft); border-color: #bfdfd5; }
.tnode img { width: 30px; height: 30px; border-radius: 6px; }
.tnode b { font-size: 15px; font-weight: 700; }
.tnode .tq { font-style: normal; font-family: var(--mono); font-weight: 700; color: var(--amber); }
.tnode .tg { font-size: 12px; color: var(--ink-3); }
.tnode .ts { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }
.tnode.ok .ts { color: var(--go); font-weight: 700; }
.tfold { font-size: 12px; color: var(--ink-3); margin-left: 8px; }
.d-sec h3 small { font-weight: 400; font-size: 13px; color: var(--ink-3); margin-left: 6px; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  background: var(--navy); color: #fff; border-radius: 999px;
  padding: 12px 24px; font-size: 15px; font-weight: 600; z-index: 60;
  box-shadow: 0 8px 28px rgba(20,40,60,.28);
}

@media (max-width: 640px) {
  .run, .find { padding: 14px 12px 50px; }
  .gc-pct { text-align: left; }
}

@media print {
  .top, .toast, .sheet, .drawer { display: none !important; }
  body { background: #fff; }
  .task:not(.go) { opacity: 1; }
}

</style>
  </head>
  <body>
    <header class="top">
      <button class="home-btn" id="homeBtn" title="첫 화면으로">🏠 홈</button>
      <div class="modes">
        <button class="mode on" data-mode="run">진행</button>
        <button class="mode" data-mode="find">영웅 찾기</button>
      </div>
      <div class="top-right">
        <button class="ghost-btn" id="zoomBtn" title="글씨 크기">가 100%</button>
        <button class="ghost-btn danger" id="resetBtn">새 판</button>
      </div>
    </header>

    <!-- 진행 — 목표 하나를 정하고 만들어 나가는 화면 -->
    <main class="run" id="viewRun">
      <section id="goalBar"></section>
      <section class="lane" id="laneNow"></section>
      <section class="lane" id="laneWait"></section>
      <section class="lane" id="laneMats"></section>
