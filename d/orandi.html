<script>
/**
 * ORANDI 조합 엔진 (ORDR 시즌2 2.314[R])
 *
 * 순수 계산 모듈 — DOM에 의존하지 않는다. 브라우저와 Node 양쪽에서 그대로 쓴다.
 * 데이터 출처: https://static.tmo.gg/ord-helper/assets.json (공개 데이터)
 */

/* ────────────────────────────── 상수 ────────────────────────────── */

// 유닛이 아니라 자원 카운터로 다루는 id
const RESOURCE_IDS = new Set(['GOLD', 'LUMBER', 'POINT']);
// 어떤 유닛으로도 대체되는 자리(랜덤 유닛)
const WILDCARD_IDS = new Set(['RANDOM']);

const GRADE_ORDER = [
  '흔함', '안흔함', '특별함', '희귀함',
  '전설', '해적선', '히든', '변화된', '초월', '불멸', '영원',
  '신비함', '제한됨', '랜덤유닛', '기타', '아이템', '자원',
];

/**
 * 역할 정의. 각 역할은 assets.json의 abilities 키로만 판정한다.
 * 데이터에 없는 것을 추측해 넣지 않는다(주딜만 예외 — kind: 'inferred').
 */
const ROLES = [
  { key: 'mainDps', label: '주딜', kind: 'inferred', grades: ['초월', '불멸', '영원', '히든'], note: '데이터에 주딜 표기가 없어 등급으로 추정합니다' },
  { key: 'armorDown', label: '방깎', abilities: ['방어력 감소', '발동방어력 감소', '단일방어력 감소', '중첩방어력 감소', '마법 방어력 감소'] },
  { key: 'armorBreak', label: '암브', abilities: ['아머브레이크', '단일아머브레이크'] },
  { key: 'slow', label: '이감', abilities: ['이동속도 감소', '발동이동속도 감소'] },
  { key: 'stun', label: '스턴', abilities: ['스턴'] },
  { key: 'boss', label: '보잡', abilities: ['보스 잡기'] },
  { key: 'berserk', label: '광잡', abilities: ['광폭화 잡기'] },
  { key: 'baljes', label: '바제스', abilities: ['바제스'] },
  { key: 'finisher', label: '끝딜', abilities: ['끝딜'] },
  { key: 'single', label: '단일', abilities: ['단일', '단일마법 대미지 증가', '단일아머브레이크'] },
  { key: 'buff', label: '버프', abilities: ['공격력 증가', '공격속도 증가', '마법 대미지 증가', '모든피해증가', '발동공격력 증가'] },
  { key: 'percent', label: '퍼뎀', abilities: ['범위 전체 체력 퍼센트 대미지', '범위 현재 체력 퍼센트 대미지', '범위 퍼센트 대미지', '폭발형 대미지 증폭'] },
  { key: 'utility', label: '유틸', abilities: ['마나 재생', '체력 재생', '유닛삭제', '방어력 무시 대미지'] },
];

/**
 * 실제 세기 순서. GRADE_ORDER는 화면 나열용이라 특수 등급(제한됨·랜덤유닛·신비함)이
 * 뒤에 붙어 있어 그대로 쓰면 그것들이 최상위로 잡힌다. 추천에는 이 순서를 쓴다.
 */
const POWER_ORDER = [
  '흔함', '안흔함', '특별함', '희귀함', '전설', '해적선',
  '히든', '변화된', '초월', '불멸', '영원',
];
function powerRank(index, unit) {
  const i = POWER_ORDER.indexOf(unit?.gradeBase);
  return i >= 0 ? i : -1;          // 본선 밖(제한됨·랜덤유닛 등)은 -1
}

// 덱을 짤 때 비면 안 되는 역할(요구사항 6)
const CORE_ROLE_KEYS = ['mainDps', 'armorDown', 'slow', 'stun', 'boss', 'baljes'];

/**
 * 표기 차이 별칭. 같은 줄에 있는 이름은 서로를 불러온다.
 * 데이터에 실제로 존재하는 이름만 남기도록 buildIndex에서 걸러낸다.
 */
const ALIAS_GROUPS = [
  ['검은수염', '마샬 · D · 티치', '티치', '마샬'],
  ['흰수염', '에드워드 뉴게이트', '뉴게이트'],
  ['빨간머리', '샹크스'],
  ['밀짚모자', '루피', '몽키 · D · 루피'],
  ['해적왕', '골 D 로저', '로저'],
  ['매의눈', '미호크'],
  ['트라팔가', '로우', '트라팔가 · D · 워터 · 로'],
  ['불꽃', '에이스', '포트거스 · D · 에이스'],
  ['적견', '아카이누', '사카즈키'],
  ['청치', '아오키지', '쿠잔'],
  ['황원', '키자루', '보르살리노'],
  ['녹우', '료쿠규'],
  ['등나무', '후지토라', '잇쇼'],
  ['해협', '진베', '징베'],
];

/**
 * 별명이 아니라 '묶음'인 말들. 이 낱말로 검색할 때만 멤버를 불러온다.
 * 역방향은 없다 — "검은수염"을 쳤다고 샹크스가 나오면 안 된다.
 */
const CATEGORY_GROUPS = {
  '사황': ['카이도', '빅 맘', '샹크스', '마샬 · D · 티치', '에드워드 뉴게이트'],
  '대장': ['아카이누', '아오키지', '키자루', '후지토라', '료쿠규'],
  '해군': ['해군 총병', '해군 칼병'],
  '밀짚모자해적단': ['몽키 · D · 루피', '롤로노아 조로', '나미', '우솝', '상디', '토니토니 쵸파', '니코 로빈', '프랑키', '브룩', '징베'],
};

/* ──────────────────────────── 문자열 처리 ──────────────────────────── */

/** 검색 비교용 정규화 — 공백·점·중점·따옴표 제거 후 소문자화 */
function normalize(value) {
  return String(value ?? '')
    .toLowerCase()
    .replace(/[\s.·・'’"`\-_/]/g, '');
}

/** "전설 [물딜]" → { base: '전설', damageType: '물딜' } */
function parseGrade(grade) {
  const match = /^(.+?)\s*\[(.+?)\]\s*$/.exec(grade);
  if (match) return { base: match[1].trim(), damageType: match[2].trim() };
  return { base: String(grade).trim(), damageType: null };
}

/* ────────────────────────────── 인덱스 ────────────────────────────── */

/**
 * assets.json 페이로드를 조회 가능한 인덱스로 만든다.
 * @param {{statistics?: string[], datas: Record<string, any[]>}} payload
 */
function buildIndex(payload) {
  const datas = payload?.datas ?? payload ?? {};
  const units = new Map();
  const grades = [];

  for (const [grade, list] of Object.entries(datas)) {
    const { base, damageType } = parseGrade(grade);
    grades.push({ grade, base, damageType, count: list.length });
    for (const raw of list) {
      const unit = {
        id: raw.id,
        name: raw.name,
        image: raw.image ?? '',
        grade,
        gradeBase: base,
        damageType,
        abilities: raw.abilities ?? {},
        desc: raw.desc ?? '',
        commands: Array.isArray(raw.commands) ? raw.commands : [],
        stuffs: Array.isArray(raw.stuffs) ? raw.stuffs : [],
        isResource: RESOURCE_IDS.has(raw.id),
        isWildcard: WILDCARD_IDS.has(raw.id),
        norm: normalize(raw.name),
        cho: chosungOf(raw.name),
      };
      unit.craftable = unit.stuffs.length > 0;
      unit.roles = rolesOf(unit);
      units.set(unit.id, unit);
    }
  }

  // 역참조: 이 유닛이 재료로 쓰이는 상위 조합
  const usedIn = new Map();
  for (const unit of units.values()) {
    for (const stuff of unit.stuffs) {
      if (!usedIn.has(stuff.id)) usedIn.set(stuff.id, []);
      usedIn.get(stuff.id).push({ id: unit.id, count: stuff.count });
    }
  }

  // 별칭 → 실제 이름 조각. 데이터에 없는 이름도 검색어로는 유효하므로 그대로 둔다.
  const aliasMap = new Map();
  for (const group of ALIAS_GROUPS) {
    for (const term of group) {
      const key = normalize(term);
      const others = group.filter((other) => normalize(other) !== key).map(normalize);
      aliasMap.set(key, [...new Set([...(aliasMap.get(key) ?? []), ...others])]);
    }
  }

  // 카테고리 → 멤버(정규화). 정확히 그 낱말로 검색할 때만 쓴다.
  const categoryMap = new Map(
    Object.entries(CATEGORY_GROUPS).map(([key, members]) => [normalize(key), members.map(normalize)]));

  const gradeRank = new Map(GRADE_ORDER.map((name, i) => [name, i]));

  return {
    units,
    usedIn,
    aliasMap,
    categoryMap,
    grades,
    statistics: payload?.statistics ?? [],
    gradeRank,
    unitCount: units.size,
    get(id) { return units.get(id); },
    name(id) { return units.get(id)?.name ?? `알 수 없음(${id})`; },
    rank(unit) { return gradeRank.has(unit?.gradeBase) ? gradeRank.get(unit.gradeBase) : 99; },
  };
}

/** 유닛이 가진 역할 키 목록 */
function rolesOf(unit) {
  const keys = [];
  const abilities = unit.abilities ?? {};
  for (const role of ROLES) {
    if (role.abilities) {
      if (role.abilities.some((key) => abilities[key])) keys.push(role.key);
    } else if (role.grades) {
      if (role.grades.includes(unit.gradeBase)) keys.push(role.key);
    }
  }
  return keys;
}

/* ────────────────────────────── 검색 ────────────────────────────── */

/**
 * 이름·별칭·계보로 유닛을 찾는다.
 * 예) "검은수염" → 검은수염(초월) + 마샬.D.티치(희귀·전설) + 계보로 이어진 유닛
 * @returns {{unit: object, reason: 'name'|'alias'|'lineage', via?: string}[]}
 */
function searchUnits(index, query, { limit = 40, lineage = true } = {}) {
  const q = normalize(query);
  if (!q) return [];

  const aliasTerms = index.aliasMap.get(q) ?? [];
  const categoryTerms = index.categoryMap?.get(q) ?? [];
  const results = new Map();
  const WEIGHT = { name: 0, alias: 1, category: 1, lineage: 2 };

  const add = (unit, reason, via) => {
    if (!unit) return;
    const prior = results.get(unit.id);
    if (prior && WEIGHT[prior.reason] <= WEIGHT[reason]) return;
    results.set(unit.id, { unit, reason, via });
  };

  if (isChosungQuery(query)) {
    const cq = chosungOf(query);
    for (const unit of index.units.values()) {
      if (unit.cho.includes(cq)) add(unit, 'name');
    }
  } else {
    for (const unit of index.units.values()) {
      if (unit.norm.includes(q) || q.includes(unit.norm)) add(unit, 'name');
    }
  }
  for (const term of aliasTerms) {
    for (const unit of index.units.values()) {
      if (unit.norm.includes(term) || term.includes(unit.norm)) add(unit, 'alias', term);
    }
  }
  for (const term of categoryTerms) {
    for (const unit of index.units.values()) {
      if (unit.norm === term) add(unit, 'category', query.trim());
    }
  }

  if (lineage) {
    const seeds = [...results.values()].map((entry) => entry.unit);
    for (const seed of seeds) {
      // 이 유닛을 재료로 쓰는 상위 조합
      for (const parent of index.usedIn.get(seed.id) ?? []) {
        add(index.get(parent.id), 'lineage', seed.name);
      }
      // 이 유닛의 재료 중 조합식을 가진 것
      for (const stuff of seed.stuffs) {
        const child = index.get(stuff.id);
        if (child && child.craftable) add(child, 'lineage', seed.name);
      }
    }
  }

  return [...results.values()]
    .sort((a, b) =>
      WEIGHT[a.reason] - WEIGHT[b.reason] ||
      index.rank(a.unit) - index.rank(b.unit) ||
      a.unit.name.localeCompare(b.unit.name, 'ko'))
    .slice(0, limit);
}

/* ──────────────────────────── 인벤토리 ──────────────────────────── */

/** 인벤토리는 Map(unitId → count). 항상 새 Map을 돌려준다. */
function cloneInv(inventory) {
  return new Map(inventory);
}

function invGet(inventory, id) {
  return inventory.get(id) ?? 0;
}

function invAdd(inventory, id, delta = 1) {
  const next = cloneInv(inventory);
  const value = invGet(next, id) + delta;
  if (value > 0) next.set(id, value);
  else next.delete(id);
  return next;
}

/* ──────────────────────────── 조합 판정 ──────────────────────────── */

/** 지금 이 유닛을 몇 번 만들 수 있는가 (한 단계만 본다) */
function craftTimes(index, inventory, unit) {
  if (!unit?.craftable) return 0;
  let times = Infinity;
  for (const stuff of unit.stuffs) {
    times = Math.min(times, Math.floor(invGet(inventory, stuff.id) / stuff.count));
    if (times === 0) return 0;
  }
  return Number.isFinite(times) ? times : 0;
}

/** 부족 재료 목록 (한 단계) */
function missingStuffs(index, inventory, unit) {
  return (unit?.stuffs ?? [])
    .map((stuff) => {
      const have = invGet(inventory, stuff.id);
      return { id: stuff.id, need: stuff.count, have, short: Math.max(0, stuff.count - have) };
    })
    .filter((row) => row.short > 0);
}

/** 조합 실행 — 재료를 소모하고 결과를 넣은 새 인벤토리 */
function applyCraft(index, inventory, unitId, times = 1) {
  const unit = index.get(unitId);
  if (!unit?.craftable) throw new Error(`조합식이 없는 유닛: ${unitId}`);
  if (craftTimes(index, inventory, unit) < times) throw new Error(`재료 부족: ${unit.name}`);
  let next = cloneInv(inventory);
  for (const stuff of unit.stuffs) next = invAdd(next, stuff.id, -stuff.count * times);
  return invAdd(next, unitId, times);
}

/* ─────────────────────── 목표 조합 경로 계산 ─────────────────────── */

/**
 * 목표 유닛까지 필요한 전체 계획을 낸다.
 *
 * @returns {{
 *   ok: boolean,                                  // 부족분 없이 지금 완성 가능한가
 *   steps: {unitId: string, times: number}[],     // 실행 순서 (하위 조합 먼저)
 *   reserved: Map<string, number>,                // 보유분 중 목표에 묶여 있는 것 = 남겨야 할 유닛
 *   shortage: Map<string, number>,                // 더 구해야 하는 최하위 재료
 *   resources: Map<string, number>,               // 금화·목재·특성포인트 소요
 *   wildcards: number,                            // 랜덤유닛 소요
 *   leafTotal: number, leafHave: number,          // 진행률 계산용
 *   nextStep: {unitId: string, times: number}|null
 * }}
 */
function planTarget(index, targetId, inventory, { qty = 1 } = {}) {
  const work = cloneInv(inventory);
  const reserved = new Map();
  const shortage = new Map();
  const resources = new Map();
  const makeCounts = new Map();   // 조합해야 하는 유닛 → 총 횟수
  let wildcards = 0;

  const bump = (map, id, n) => map.set(id, (map.get(id) ?? 0) + n);

  const walk = (id, need, path) => {
    if (need <= 0) return;
    const unit = index.get(id);

    // 보유분을 먼저 쓴다 → 그만큼이 "남겨야 할 유닛"
    const take = Math.min(need, invGet(work, id));
    if (take > 0) {
      work.set(id, invGet(work, id) - take);
      bump(reserved, id, take);
    }
    const remain = need - take;
    if (remain <= 0) return;

    if (unit?.isResource) { bump(resources, id, remain); return; }
    if (unit?.isWildcard) { wildcards += remain; return; }

    // 조합식이 없거나 순환이면 더 못 내려간다 → 직접 구해야 하는 재료
    if (!unit?.craftable || path.has(id)) {
      bump(shortage, id, remain);
      return;
    }

    const nextPath = new Set(path).add(id);
    for (const stuff of unit.stuffs) walk(stuff.id, stuff.count * remain, nextPath);
    bump(makeCounts, id, remain);
  };

  // 진행률용 총 소요량은 보유를 무시한 전체 전개로 따로 센다
  const totalLeaves = expandLeaves(index, targetId, qty);

  walk(targetId, qty, new Set());

  // 같은 조합이 여러 분기에서 나오면 횟수를 합치고, 재료가 먼저 오도록 위상 정렬한다.
  const steps = [];
  const emitted = new Set();
  const emit = (id) => {
    if (emitted.has(id) || !makeCounts.has(id)) return;
    emitted.add(id);
    for (const stuff of index.get(id).stuffs) emit(stuff.id);
    steps.push({ unitId: id, times: makeCounts.get(id) });
  };
  emit(targetId);
  for (const id of makeCounts.keys()) emit(id);   // 순환 등으로 목표에서 못 닿은 것 보강

  // 진행률에 넣을 것과 뺄 것을 가른다.
  //  · 목재·특성포인트: '개수'라 다른 재료와 같이 세도 된다
  //  · 금화: 10,000 단위 금액이라 개수와 합치면 분모가 통째로 망가진다
  //    (실측 — 산적왕 히그마 분모가 10,064가 돼 진행률이 늘 0%로 눌렸다. 2026-08-20)
  const countable = (id) => id !== 'GOLD';
  const leafSumTotal = [...totalLeaves].reduce((sum, [id, n]) => sum + (countable(id) ? n : 0), 0);
  const leafSumShort = [...shortage.entries()].reduce((sum, [id, n]) => sum + (countable(id) ? n : 0), 0)
    + [...resources.entries()].reduce((sum, [id, n]) => sum + (countable(id) ? n : 0), 0)
    + wildcards;   // 랜덤유닛도 '아직 없는 것'이다

  const nextStep = steps.find((step) => craftTimes(index, inventory, index.get(step.unitId)) >= step.times) ?? null;

  return {
    ok: shortage.size === 0 && resources.size === 0 && wildcards === 0,
    steps,
    reserved,
    shortage,
    resources,
    wildcards,
    leafTotal: leafSumTotal,
    leafHave: Math.max(0, leafSumTotal - leafSumShort),
    nextStep,
  };
}

/** 목표를 최하위 재료까지 완전히 펼친 총 소요량 (보유 무시) */
function expandLeaves(index, targetId, qty = 1, path = new Set()) {
  const out = new Map();
  const bump = (id, n) => out.set(id, (out.get(id) ?? 0) + n);
  const unit = index.get(targetId);
  if (!unit || !unit.craftable || path.has(targetId)) {
    bump(targetId, qty);
    return out;
  }
  const nextPath = new Set(path).add(targetId);
  for (const stuff of unit.stuffs) {
    for (const [id, n] of expandLeaves(index, stuff.id, stuff.count * qty, nextPath)) bump(id, n);
  }
  return out;
}

/* ─────────────────── 지금 가능한 조합 · 우선순위 ─────────────────── */

/**
 * 현재 보유로 즉시 만들 수 있는 조합 + 1개만 모자란 조합.
 * 목표(targetId)가 있으면 목표 경로에 포함된 조합을 최상위로 올린다.
 */
function craftableNow(index, inventory, { targetIds = [], limit = 60 } = {}) {
  const onPath = new Set();
  for (const targetId of targetIds) {
    for (const step of planTarget(index, targetId, inventory).steps) onPath.add(step.unitId);
    onPath.add(targetId);
  }

  const ready = [];
  const almost = [];

  for (const unit of index.units.values()) {
    if (!unit.craftable) continue;
    const times = craftTimes(index, inventory, unit);
    if (times > 0) {
      ready.push({ unit, times, priority: priorityOf(index, unit, onPath), onPath: onPath.has(unit.id) });
      continue;
    }
    const missing = missingStuffs(index, inventory, unit);
    const shortSum = missing.reduce((sum, row) => sum + row.short, 0);
    // 보유 재료를 하나라도 쓰는 조합만 "곧 가능"으로 본다 (전체 269개 나열 방지)
    const usesOwned = unit.stuffs.some((stuff) => invGet(inventory, stuff.id) > 0);
    if (usesOwned && shortSum <= 2) {
      almost.push({ unit, missing, shortSum, priority: priorityOf(index, unit, onPath), onPath: onPath.has(unit.id) });
    }
  }

  const bySort = (a, b) => b.priority - a.priority || index.rank(b.unit) - index.rank(a.unit);
  ready.sort(bySort);
  almost.sort((a, b) => a.shortSum - b.shortSum || bySort(a, b));

  return { ready: ready.slice(0, limit), almost: almost.slice(0, limit) };
}

/** 우선순위 점수 — 목표 경로 > 등급 > 역할 수 */
function priorityOf(index, unit, onPath = new Set()) {
  let score = index.rank(unit) * 4;
  if (onPath.has(unit.id)) score += 200;
  score += unit.roles.length * 3;
  if (unit.roles.includes('baljes')) score += 6;
  if (unit.roles.includes('boss')) score += 4;
  return score;
}

/* ────────────────────────── 덱 역할 분석 ────────────────────────── */

/**
 * 덱(유닛 id 배열)의 역할 커버리지와 빈 역할, 그 역할을 메울 후보를 낸다.
 */
function analyzeDeck(index, deckIds, inventory = new Map(), { slots = 6, candidateLimit = 5 } = {}) {
  const deck = deckIds.map((id) => index.get(id)).filter(Boolean);
  const coverage = ROLES.map((role) => ({
    ...role,
    members: deck.filter((unit) => unit.roles.includes(role.key)).map((unit) => unit.id),
  }));

  const gaps = coverage.filter((row) => CORE_ROLE_KEYS.includes(row.key) && row.members.length === 0);

  const inDeck = new Set(deckIds);
  const suggestions = gaps.map((gap) => {
    const pool = [...index.units.values()]
      .filter((unit) => !inDeck.has(unit.id) && unit.roles.includes(gap.key) && unit.craftable)
      .map((unit) => {
        const plan = planTarget(index, unit.id, inventory);
        const progress = plan.leafTotal ? plan.leafHave / plan.leafTotal : 1;
        return { unit, plan, progress };
      })
      .sort((a, b) => b.progress - a.progress || index.rank(b.unit) - index.rank(a.unit))
      .slice(0, candidateLimit);
    return { role: gap, candidates: pool };
  });

  return { deck, coverage, gaps, suggestions, slots, filled: deck.length };
}

/* ───────────────────────── 인게임 조합 안내 ───────────────────────── */

/**
 * "지금 조합하기" 안내. 맵이 공식 제공하는 채팅 명령어가 있으면 그것을 돌려준다.
 * 자동 입력·매크로는 하지 않는다 — 복사해서 대표가 직접 친다.
 */
function craftGuide(index, unitId, inventory) {
  const unit = index.get(unitId);
  if (!unit) return null;
  return {
    unit,
    ready: craftTimes(index, inventory, unit) > 0,
    ingredients: unit.stuffs.map((stuff) => ({
      id: stuff.id,
      name: index.name(stuff.id),
      need: stuff.count,
      have: invGet(inventory, stuff.id),
    })),
    commands: unit.commands,
    manual: unit.commands.length === 0,
  };
}

/* ─────────────────────── 초성 검색 · 일괄 입력 ─────────────────────── */

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

/** "해군 총병" → "ㅎㄱㅊㅂ" (한글이 아닌 글자는 그대로 둔다) */
function chosungOf(value) {
  return [...String(value ?? '')]
    .map((ch) => {
      const code = ch.charCodeAt(0);
      if (code >= 0xac00 && code <= 0xd7a3) return CHO[Math.floor((code - 0xac00) / 588)];
      return ch;
    })
    .join('')
    .replace(/[\s.·・'’"`\-_/]/g, '')
    .toLowerCase();
}

/** 입력이 초성만으로 이뤄졌는가 (ㄱㅇㅅㅇ 처럼) */
function isChosungQuery(value) {
  const trimmed = String(value ?? '').replace(/\s/g, '');
  return trimmed.length > 0 && /^[ㄱ-ㅎ]+$/.test(trimmed);
}

/**
 * "해군총병 12, 루피 4\n목재 x6" 같은 텍스트를 보유 목록으로 바꾼다.
 * @returns {{resolved: {unit: object, count: number, note?: string}[], unknown: string[]}}
 */
function parseInventoryText(index, text) {
  const resolved = [];
  const unknown = [];
  const chunks = String(text ?? '').split(/[,\n;·]+/);

  for (const chunk of chunks) {
    const raw = chunk.trim();
    if (!raw) continue;
    // 뒤에 붙은 수량을 떼어낸다: "루피 3" / "루피x3" / "루피 ×3" / "루피 3개"
    const match = /^(.*?)[\s×xX*]*(\d+)\s*(?:개|장|기)?$/.exec(raw);
    const term = (match ? match[1] : raw).trim();
    const count = match ? Number(match[2]) : 1;
    if (!term || count <= 0) { unknown.push(raw); continue; }

    const key = normalize(term);
    let hits = [...index.units.values()].filter((unit) => unit.norm === key);
    let note;
    if (!hits.length) {
      hits = [...index.units.values()].filter((unit) => unit.norm.includes(key));
      if (hits.length) note = '부분 일치로 찾음';
    }
    if (!hits.length) { unknown.push(raw); continue; }
    if (hits.length > 1) {
      // 이름이 겹치면 가장 낮은 등급(=재료로 쓰는 쪽)을 택하고 그 사실을 알린다
      hits = [...hits].sort((a, b) => index.rank(a) - index.rank(b));
      note = `이름이 ${hits.length}개라 '${hits[0].grade}' 등급으로 넣었습니다`;
    }
    resolved.push({ unit: hits[0], count, note });
  }
  return { resolved, unknown };
}

/* ──────────────────── 도달 가능한 상위 조합표 ──────────────────── */

/**
 * 보유 재료로 (여러 단계를 거쳐) 완성할 수 있는 유닛을 전부 계산한다.
 * 각 유닛은 "그것 하나만 만들 때" 기준으로 판정한다 — 동시에 다 만들 수 있다는 뜻이 아니다.
 *
 * @returns {{unit, plan, progress, stepCount, shortSum, status: 'ready'|'near'|'far'}[]}
 */
function reachableTable(index, inventory, { nearLimit = 3 } = {}) {
  const rows = [];
  for (const unit of index.units.values()) {
    if (!unit.craftable) continue;
    const plan = planTarget(index, unit.id, inventory);
    const shortSum = [...plan.shortage.values()].reduce((sum, n) => sum + n, 0);
    // 보유를 하나도 안 쓰는 유닛은 표에 올리지 않는다 (전체 나열 방지)
    if (!plan.ok && plan.reserved.size === 0) continue;
    const progress = plan.leafTotal ? plan.leafHave / plan.leafTotal : 1;
    rows.push({
      unit,
      plan,
      progress,
      shortSum,
      stepCount: plan.steps.length,
      status: plan.ok ? 'ready' : (shortSum <= nearLimit ? 'near' : 'far'),
    });
  }
  const statusRank = { ready: 0, near: 1, far: 2 };
  rows.sort((a, b) =>
    statusRank[a.status] - statusRank[b.status] ||
    index.rank(b.unit) - index.rank(a.unit) ||
    b.progress - a.progress);
  return rows;
}

/* ─────────────────────── 보유 기준 덱 추천 ─────────────────────── */

/** 덱 후보로 삼는 등급 (최상위권) */
const DECK_POOL_GRADES = ['초월', '불멸', '영원', '히든', '해적선', '전설', '변화된', '신비함'];

/**
 * 지금 보유로 6칸 덱을 짠다.
 * 핵심 역할(주딜·방깎·이감·스턴·보잡·바제스)이 비지 않도록 채우는 것이 1순위,
 * 그다음이 재료 확보 진행률이다.
 *
 * @returns {{unit, plan, progress, covers: string[]}[]}
 */
function recommendDeck(index, inventory, { slots = 6, damageType = null } = {}) {
  const cand = [...index.units.values()]
    .filter((u) => u.craftable && DECK_POOL_GRADES.includes(u.gradeBase))
    .filter((u) => !damageType || u.damageType === damageType)
    .map((unit) => {
      const plan = planTarget(index, unit.id, inventory);
      return { unit, plan, progress: plan.leafTotal ? plan.leafHave / plan.leafTotal : 0 };
    });

  const picked = [];
  const covered = new Set();
  while (picked.length < slots) {
    let best = null;
    for (const c of cand) {
      if (picked.some((p) => p.unit.id === c.unit.id)) continue;
      // 이미 뽑은 칸과 효과가 겹쳐 죽는 유닛은 건너뛴다
      if (picked.some((p) => conflictsOf(index, p.unit.id).some((x) => x.withId === c.unit.id))) continue;
      const covers = c.unit.roles.filter((r) => CORE_ROLE_KEYS.includes(r) && !covered.has(r));
      // 빈 역할을 메우는 것이 최우선, 그다음 진행률, 그다음 역할 수
      const score = covers.length * 1000
        + c.progress * 100
        + c.unit.roles.length * 2
        - (plan_leaf(c) * 0.05);
      if (!best || score > best.score) best = { c, covers, score };
    }
    if (!best) break;
    picked.push({ ...best.c, covers: best.covers });
    for (const r of best.c.unit.roles) if (CORE_ROLE_KEYS.includes(r)) covered.add(r);
  }
  return picked;
}

function plan_leaf(c) {
  return c.plan.leafTotal || 0;
}

/** 덱이 요구하는 최하위 재료 총량 (많은 순) */
function deckMaterials(index, deckIds, inventory = new Map()) {
  const total = new Map();
  for (const id of deckIds) {
    for (const [leafId, n] of expandLeaves(index, id, 1)) {
      total.set(leafId, (total.get(leafId) ?? 0) + n);
    }
  }
  return [...total.entries()]
    .map(([id, need]) => ({
      unit: index.get(id), need, have: invGet(inventory, id),
      resource: Boolean(index.get(id)?.isResource),
    }))
    .filter((r) => r.unit)
    .sort((a, b) => b.need - a.need);
}

/* ─────────────────── 역할별 영웅 · 궁합 추천 ─────────────────── */

/**
 * 어떤 역할을 맡는 영웅들을 등급 높은 순으로.
 * @param {string} roleKey  ROLES의 key (mainDps/armorDown/stun …)
 * @param {string|null} damageType  '물딜' | '마딜' | '스턴' | null
 */
function heroesByRole(index, roleKey, { damageType = null, includeSpecial = false, limit = 60 } = {}) {
  return [...index.units.values()]
    .filter((u) => u.roles.includes(roleKey))
    .filter((u) => !damageType || u.damageType === damageType)
    .filter((u) => includeSpecial || powerRank(index, u) >= 0)
    .sort((a, b) => powerRank(index, b) - powerRank(index, a) || a.name.localeCompare(b.name, 'ko'))
    .slice(0, limit);
}

/** 이 유닛이 재료로 쓰이는 상위 조합 (바로 위 → 그 위까지) */
function upgradePaths(index, unitId, { depth = 2 } = {}) {
  const seen = new Set([unitId]);
  const out = [];
  let frontier = [unitId];
  for (let d = 1; d <= depth; d += 1) {
    const next = [];
    for (const id of frontier) {
      for (const parent of index.usedIn.get(id) ?? []) {
        if (seen.has(parent.id)) continue;
        seen.add(parent.id);
        const unit = index.get(parent.id);
        if (!unit) continue;
        out.push({ unit, step: d, uses: parent.count });
        next.push(parent.id);
      }
    }
    frontier = next;
  }
  return out.sort((a, b) => a.step - b.step || index.rank(b.unit) - index.rank(a.unit));
}

/**
 * 조합 트리에 들어가는 '중간 재료'를 얼마나 나눠 쓰는지 (0~1).
 *
 * ⚠️ 최하위 재료로 재면 안 된다 — 최상위 유닛은 결국 다 흔함 재료로 내려가서
 *    무엇을 비교해도 80%대가 나오고 변별력이 사라진다(2026-08-20 실측).
 *    실제로 다투는 것은 전설·초월 같은 **중간 완성품**이다.
 */
function midParts(index, unitId, depth = 3, path = new Set()) {
  const out = new Set();
  const unit = index.get(unitId);
  if (!unit || !unit.craftable || depth <= 0 || path.has(unitId)) return out;
  const next = new Set(path).add(unitId);
  for (const stuff of unit.stuffs) {
    const child = index.get(stuff.id);
    if (!child || child.isResource) continue;
    if (child.craftable) out.add(child.id);          // 조합해야 나오는 것 = 다툼의 대상
    for (const id of midParts(index, stuff.id, depth - 1, next)) out.add(id);
  }
  return out;
}

function materialOverlap(index, aId, bId) {
  const a = midParts(index, aId);
  const b = midParts(index, bId);
  if (!a.size || !b.size) return 0;
  let shared = 0;
  for (const id of a) if (b.has(id)) shared += 1;
  return shared / Math.min(a.size, b.size);
}

/**
 * 이 영웅과 같이 쓰면 좋은 영웅.
 *
 * 좋다는 기준 두 가지 —
 *   ① 이 영웅이 못 맡는 핵심 역할을 대신 맡아준다 (역할 보완)
 *   ② 재료가 덜 겹친다 (같은 재료를 두고 싸우면 둘 다 못 만든다)
 */
function partnersFor(index, unitId, { limit = 8, damageType = null } = {}) {
  const unit = index.get(unitId);
  if (!unit) return [];
  const mine = new Set(unit.roles.filter((r) => CORE_ROLE_KEYS.includes(r)));

  return [...index.units.values()]
    .filter((u) => u.id !== unitId && u.craftable && DECK_POOL_GRADES.includes(u.gradeBase))
    .filter((u) => !damageType || u.damageType === damageType)
    .map((u) => {
      const covers = u.roles.filter((r) => CORE_ROLE_KEYS.includes(r) && !mine.has(r));
      const overlap = materialOverlap(index, unitId, u.id);
      const score = covers.length * 10 + powerRank(index, u) * 0.5 - overlap * 14;
      return { unit: u, covers, overlap, score };
    })
    .filter((row) => row.covers.length > 0 && powerRank(index, row.unit) >= 0)
    // 효과가 서로 겹쳐 죽는 조합은 아예 빼준다 (같이 넣으면 하나가 낭비된다)
    .filter((row) => !conflictsOf(index, unitId).some((c) => c.withId === row.unit.id))
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);
}

/* ─────────────────── 코스트 · 획득 방법 ─────────────────── */

/**
 * 이 유닛 하나를 만드는 데 드는 총량.
 * 최하위까지 펼쳐서 유닛 개수와 자원을 따로 센다.
 */
function unitCost(index, unitId) {
  const unit = index.get(unitId);
  if (!unit?.craftable) return null;
  const leaves = expandLeaves(index, unitId, 1);
  const cost = { units: 0, gold: 0, lumber: 0, point: 0, wildcards: 0, kinds: 0 };
  for (const [id, n] of leaves) {
    const leaf = index.get(id);
    if (id === 'GOLD') cost.gold += n;
    else if (id === 'LUMBER') cost.lumber += n;
    else if (id === 'POINT') cost.point += n;
    else if (leaf?.isWildcard) cost.wildcards += n;
    else { cost.units += n; cost.kinds += 1; }
  }
  cost.steps = planTarget(index, unitId, new Map()).steps.length;
  cost.direct = unit.stuffs.length;
  return cost;
}

/**
 * 어떻게 얻는가.
 * ⚠️ 공개 데이터에는 '조합식'만 있고 특수 획득 경로는 없다.
 *    조합으로 얻는 것만 확정해 말하고, 나머지는 등급으로 안내하되 지어내지 않는다.
 */
function howToGet(index, unit) {
  if (!unit) return null;
  const noted = index.howNotes?.get(unit.id);
  if (noted) return { kind: '획득법 확인됨', sure: true, text: noted, commands: unit.commands };
  if (unit.craftable) {
    return { kind: '조합', sure: true,
      text: `재료 ${unit.stuffs.length}종을 합쳐 만듭니다`,
      commands: unit.commands };
  }
  const base = unit.gradeBase;
  if (['흔함', '안흔함', '특별함', '희귀함'].includes(base)) {
    return { kind: '직접 획득', sure: true,
      text: '조합으로는 못 만듭니다 — 게임 중에 직접 얻는 유닛입니다' };
  }
  if (base === '랜덤유닛') {
    return { kind: '랜덤', sure: false,
      text: '랜덤 위습 계열에서 나옵니다 (공개 데이터에 조합식 없음)' };
  }
  if (base === '자원') {
    return { kind: '자원', sure: true, text: '게임 재화입니다 (조합 재료로 쓰입니다)' };
  }
  if (base === '아이템') {
    return { kind: '아이템', sure: false, text: '아이템입니다 (획득 경로는 공개 데이터에 없음)' };
  }
  return { kind: '특수', sure: false,
    text: `${base} 등급 — 획득 경로가 공개 데이터에 없습니다. 맵에서 확인이 필요합니다` };
}

/** 코스트를 사람이 읽는 한 줄로 */
function costLabel(cost) {
  if (!cost) return '';
  const parts = [`재료 ${cost.units}개`];
  if (cost.steps > 1) parts.push(`${cost.steps}단계`);
  if (cost.gold) parts.push(`금화 ${cost.gold.toLocaleString()}`);
  if (cost.lumber) parts.push(`목재 ${cost.lumber}`);
  if (cost.point) parts.push(`특성 ${cost.point}`);
  if (cost.wildcards) parts.push(`랜덤 ${cost.wildcards}`);
  return parts.join(' · ');
}

/* ─────────────── 공개 데이터에 없는 사실 (overrides) ─────────────── */

/**
 * data/overrides.json 을 인덱스에 얹는다.
 * 공개 데이터에 없는 것 — 효과 중복 불가, 한 판에 한 번만 얻는 유닛 — 을 사람이 채운 파일이다.
 * 없으면 그냥 넘어간다(앱은 그대로 돈다).
 */
function applyOverrides(index, overrides) {
  index.conflicts = new Map();     // unitId → [{ withId, withName, reason, unsure }]
  index.oncePerGame = new Set();
  if (!overrides) return index;

  const byName = new Map();
  for (const unit of index.units.values()) {
    if (!byName.has(unit.name)) byName.set(unit.name, []);
    byName.get(unit.name).push(unit);
  }
  const pick = (name, grade) => {
    const list = byName.get(name) ?? [];
    if (!list.length) return null;
    if (grade) return list.find((u) => u.gradeBase === grade) ?? list[0];
    // 등급을 안 적었으면 가장 센 것으로 본다
    return list.slice().sort((a, b) => powerRank(index, b) - powerRank(index, a))[0];
  };

  for (const row of overrides['중복불가'] ?? []) {
    const a = pick(row.a, row['a등급']);
    const b = row.b ? pick(row.b, row['b등급']) : null;
    if (!a) continue;
    const note = { withId: b?.id ?? null, withName: b?.name ?? row.b ?? '상대 불명',
                   reason: row['사유'] ?? '', unsure: Boolean(row['확인필요']) };
    if (!index.conflicts.has(a.id)) index.conflicts.set(a.id, []);
    index.conflicts.get(a.id).push(note);
    if (b) {
      if (!index.conflicts.has(b.id)) index.conflicts.set(b.id, []);
      index.conflicts.get(b.id).push({ withId: a.id, withName: a.name, reason: note.reason, unsure: note.unsure });
    }
  }

  for (const row of overrides['한판에한번만'] ?? []) {
    const u = typeof row === 'string' ? pick(row) : pick(row.name, row.grade);
    if (u) index.oncePerGame.add(u.id);
  }
  // 공개 데이터에 없는 유닛을 먼저 만들어 둔다 (조합식수정이 참조할 수 있게)
  for (const row of overrides['유닛추가'] ?? []) {
    if ([...index.units.values()].some((u) => u.name === row['이름'])) continue;
    const id = `ADD_${normalize(row['이름'])}`;
    const unit = {
      id, name: row['이름'], image: '', grade: row['등급'] ?? '기타',
      gradeBase: (row['등급'] ?? '기타').split(' [')[0], damageType: null,
      abilities: {}, desc: row['설명'] ?? '', commands: [], stuffs: [],
      isResource: false, isWildcard: false,
      norm: normalize(row['이름']), cho: chosungOf(row['이름']),
      craftable: false, roles: [], added: true,
    };
    index.units.set(id, unit);
  }

  // 게임에서 확인한 실제 조합식으로 덮어쓴다
  for (const row of overrides['조합식수정'] ?? []) {
    const target = [...index.units.values()].find((u) =>
      u.name === row['유닛'] && (!row['등급'] || u.gradeBase === row['등급']));
    if (!target) continue;
    const stuffs = [];
    for (const raw of row['재료'] ?? []) {
      const m = /^(.*?)\s*[x×](\d+)$/.exec(String(raw));
      const nm = (m ? m[1] : String(raw)).trim();
      const cnt = m ? Number(m[2]) : 1;
      const hit = [...index.units.values()].find((u) => u.name === nm)
        ?? [...index.units.values()].find((u) => u.norm === normalize(nm));
      if (hit) stuffs.push({ id: hit.id, count: cnt });
    }
    if (stuffs.length) {
      target.stuffs = stuffs;
      target.craftable = true;
      target.fixed = true;
    }
  }

  // 조합식을 고쳤으니 '무엇의 재료인가'를 다시 계산한다
  index.usedIn.clear();
  for (const unit of index.units.values()) {
    for (const stuff of unit.stuffs) {
      if (!index.usedIn.has(stuff.id)) index.usedIn.set(stuff.id, []);
      index.usedIn.get(stuff.id).push({ id: unit.id, count: stuff.count });
    }
  }

  index.gradeNotes = overrides['등급메모'] ?? {};
  // 이름으로 적어둔 획득법을 유닛에 붙인다
  index.howNotes = new Map();
  for (const [name, text] of Object.entries(overrides['획득법'] ?? {})) {
    const bare = name.replace(/\(.*\)/, '').trim();
    for (const unit of index.units.values()) {
      if (unit.name === bare || unit.name === name) index.howNotes.set(unit.id, text);
    }
  }
  return index;
}

/** 이 유닛과 같이 넣으면 안 되는 유닛 목록 */
function conflictsOf(index, unitId) {
  return index.conflicts?.get(unitId) ?? [];
}

/* ─────────────────── 작전 카드 (게임 전에 뽑는 한 장) ─────────────────── */

/**
 * 각 유닛이 '위로' 몇 개의 조합에 재료로 쓰이는가 (직접 + 간접).
 * 숫자가 크면 어디든 쓰이는 범용 재료, 0이면 아무 데도 안 들어가는 최종 유닛이다.
 * 덱과 무관하게 미리 한 번만 계산하면 된다 — 확장가 제안(2026-08-20 회의).
 */
function materialReach(index) {
  const reach = new Map();
  for (const unit of index.units.values()) {
    const seen = new Set();
    let frontier = [unit.id];
    while (frontier.length) {
      const next = [];
      for (const id of frontier) {
        for (const parent of index.usedIn.get(id) ?? []) {
          if (seen.has(parent.id)) continue;
          seen.add(parent.id);
          next.push(parent.id);
        }
      }
      frontier = next;
    }
    reach.set(unit.id, seen.size);
  }
  return reach;
}

/**
 * 목표 덱 하나로 '이번 판 작전'을 뽑는다.
 * 게임 중에 보라고 만드는 게 아니라, **게임 시작 전에 한 번 보고 끄라고** 만드는 것이다.
 *
 * @returns {{
 *   targets: object[],
 *   keep:    {unit, need, have, short}[],   // 지켜야 할 재료 (많이 드는 순)
 *   drop:    {unit, count, reach}[],        // 보유 중인데 이 목표에는 안 들어가는 것
 *   steps:   {unit, times, doable}[],       // 여러 목표를 합친 조합 순서
 *   commands:{unit, list}[],                // 목표별 인게임 조합 명령어
 *   totals:  {units, gold, lumber, point}
 * }}
 */
function battlePlan(index, deckIds, inventory = new Map()) {
  const targets = deckIds.map((id) => index.get(id)).filter(Boolean);
  const reach = materialReach(index);

  // 1) 목표 전체가 요구하는 최하위 재료 합계
  const need = new Map();
  const totals = { units: 0, gold: 0, lumber: 0, point: 0 };
  for (const target of targets) {
    for (const [id, n] of expandLeaves(index, target.id, 1)) {
      need.set(id, (need.get(id) ?? 0) + n);
    }
  }
  for (const [id, n] of need) {
    if (id === 'GOLD') totals.gold += n;
    else if (id === 'LUMBER') totals.lumber += n;
    else if (id === 'POINT') totals.point += n;
    else totals.units += n;
  }

  // 2) 지킬 것 — 많이 드는 순 (부족분이 큰 것이 곧 병목이다)
  const keep = [...need.entries()]
    .map(([id, n]) => ({ unit: index.get(id), need: n, have: invGet(inventory, id) }))
    .filter((r) => r.unit && !r.unit.isResource)
    .map((r) => ({ ...r, short: Math.max(0, r.need - r.have) }))
    .sort((a, b) => b.short - a.short || b.need - a.need);

  // 3) 버려도 되는 것 — 보유 중인데 이 목표 어디에도 안 들어감
  //    ⚠️ '쓸모없다'가 아니라 '이번 목표에는 안 쓰인다'는 뜻이다. 범용성(reach)을 함께 보여준다.
  const drop = [...inventory.entries()]
    .filter(([id]) => !need.has(id))
    .map(([id, count]) => ({ unit: index.get(id), count, reach: reach.get(id) ?? 0 }))
    .filter((r) => r.unit && !r.unit.isResource)
    .sort((a, b) => a.reach - b.reach || b.count - a.count);

  // 4) 조합 순서 — 목표별 순서를 합치고 중복은 앞선 것만 남긴다
  const steps = [];
  const seen = new Set();
  for (const target of targets) {
    for (const step of planTarget(index, target.id, inventory).steps) {
      if (seen.has(step.unitId)) continue;
      seen.add(step.unitId);
      const unit = index.get(step.unitId);
      steps.push({ unit, times: step.times, doable: craftTimes(index, inventory, unit) >= step.times });
    }
  }

  const commands = targets
    .filter((t) => t.commands.length)
    .map((t) => ({ unit: t, list: t.commands }));

  return { targets, keep, drop, steps, commands, totals };
}

/* ─────────────────── 초보자용 목표 추천 ─────────────────── */

/**
 * 최종 목표급인가 — **다른 조합의 재료로 쓰이지 않는** 유닛.
 * 낮은 등급은 어차피 위로 가는 길에 저절로 거쳐 가므로 '목표'로 고를 이유가 없다
 * (2026-08-20 대표 지적). 데이터상 74종.
 */
function isFinalGoal(index, unit) {
  return Boolean(unit?.craftable) && (index.usedIn.get(unit.id) ?? []).length === 0;
}

/**
 * 추천에 올릴 '최상위' 목표 — 초월·불멸·영원만.
 * 히든·해적선·변화된은 최종급이지만 그 위가 있는 라인이라 목표로는 안 세운다
 * (대표 지시 2026-08-20 — "최상위만 추천에 넣어라").
 */
function isTopGoal(index, unit) {
  return isFinalGoal(index, unit) && powerRank(index, unit) >= 8;
}

/** 난이도 구간 — 최종 목표는 코스트 폭이 15~157개로 너무 넓어 그냥 늘어놓으면 못 고른다 */
function goalTier(cost) {
  const n = cost?.units ?? 0;
  if (n <= 25) return { key: 'light', label: '가벼움', note: '한 판에 충분히 끝냅니다' };
  if (n <= 60) return { key: 'mid', label: '보통', note: '자리 잡으면 노릴 만합니다' };
  return { key: 'heavy', label: '장기', note: '재료가 많이 듭니다' };
}


/**
 * "뭘 만들지 모르겠다"는 사람에게 줄 목표 후보.
 *
 * 고르는 기준 (초보자 관점) —
 *   ① 재료가 적게 든다 (완주 가능성)
 *   ② 핵심 역할(방깎·이감·스턴·보잡)을 맡는다 (실제로 쓸모 있다)
 *   ③ 지금 보유로 얼마나 가까운가
 *   ④ 조합 단계가 너무 깊지 않다
 */
function starterGoals(index, inventory = new Map(), { limit = 8 } = {}) {
  const rows = [];
  for (const unit of index.units.values()) {
    // ⭐ 최종 목표급만 추천한다. 중간재는 '진행' 화면이 순서로 보여주므로 목표가 아니다.
    if (!isTopGoal(index, unit)) continue;
    const cost = unitCost(index, unit.id);
    if (!cost) continue;

    const plan = planTarget(index, unit.id, inventory);
    const progress = plan.leafTotal ? plan.leafHave / plan.leafTotal : 0;
    const coreRoles = unit.roles.filter((r) => CORE_ROLE_KEYS.includes(r));

    // 싸고 · 쓸모 있고 · 가까울수록 높다
    const score = Math.max(0, 160 - cost.units) * 0.9
      + coreRoles.length * 14
      + progress * 70
      + Math.max(0, 30 - cost.steps) * 1.2;
    rows.push({ unit, cost, plan, progress, coreRoles, tier: goalTier(cost), score });
  }
  return rows.sort((a, b) => b.score - a.score).slice(0, limit);
}

/** 지금 보유로 가장 가까운(완성이 임박한) 목표 */
function closestGoals(index, inventory, { limit = 6 } = {}) {
  return [...index.units.values()]
    .filter((u) => isTopGoal(index, u))
    .map((unit) => {
      const plan = planTarget(index, unit.id, inventory);
      return { unit, plan, progress: plan.leafTotal ? plan.leafHave / plan.leafTotal : 0 };
    })
    // progress>0 만으로는 0.01%짜리도 '거의 다 됨'으로 올라온다(2026-08-20 실측). 실질 기준으로 자른다.
    .filter((r) => r.progress >= 0.3 && r.progress < 1)
    .sort((a, b) => b.progress - a.progress || powerRank(index, b.unit) - powerRank(index, a.unit))
    .slice(0, limit);
}

/**
 * 역할 하나를 골랐을 때 그 안에서 '만들 만한' 순서.
 * 센 순으로만 늘어놓으면 초보에게는 40개 중 뭘 골라야 할지 알 수 없다(2026-08-20 대표 지적).
 * 그래서 지금 보유·코스트·단계까지 넣어 점수를 매긴다.
 */
function roleGoals(index, roleKey, inventory = new Map(), { limit = 5, damageType = null } = {}) {
  return [...index.units.values()]
    .filter((u) => isTopGoal(index, u) && u.roles.includes(roleKey))
    .filter((u) => !damageType || u.damageType === damageType)
    .map((unit) => {
      const cost = unitCost(index, unit.id);
      const plan = planTarget(index, unit.id, inventory);
      const progress = plan.leafTotal ? plan.leafHave / plan.leafTotal : 0;
      const core = unit.roles.filter((r) => CORE_ROLE_KEYS.includes(r)).length;
      // 가까울수록 · 쌀수록 · 역할 많을수록 · 셀수록 높다
      // ⚠️ 역할 겸용에 점수를 주면 만능 유닛 몇 개가 모든 역할에서 1위를 먹어
      //    역할별 추천이 전부 똑같아진다(2026-08-20 실측). 여기서는 겸용 보너스를 빼고
      //    '만들 수 있느냐'(코스트·진행률)에 집중한다.
      const score = progress * 70
        + Math.max(0, 160 - (cost?.units ?? 999)) * 0.9
        + powerRank(index, unit) * 2
        + Math.max(0, 30 - (cost?.steps ?? 99)) * 1.2;
      return { unit, cost, plan, progress, tier: goalTier(cost), score };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);
}

/**
 * 이미 만든 영웅들을 보고 **다음에 만들면 좋은 최종 목표**를 고른다.
 *
 * 기준 —
 *   ① 지금 덱에 **비어 있는 핵심 역할**을 메우는가 (주딜만 있으면 방깎·이감·스턴을 권한다)
 *   ② 이미 만든 것과 **재료를 덜 뺏는가** (같은 재료를 다투면 둘 다 못 만든다)
 *   ③ 지금 보유로 가까운가 · 재료가 적게 드는가
 */
function nextGoals(index, madeIds = [], inventory = new Map(), { limit = 5 } = {}) {
  const made = [...new Set(madeIds)].map((id) => index.get(id)).filter(Boolean);
  const haveRoles = new Set(made.flatMap((u) => u.roles.filter((r) => CORE_ROLE_KEYS.includes(r))));
  const missing = CORE_ROLE_KEYS.filter((r) => !haveRoles.has(r));
  const madeFinals = made.filter((u) => isTopGoal(index, u));

  const rows = [];
  for (const unit of index.units.values()) {
    if (!isTopGoal(index, unit)) continue;
    if (madeIds.includes(unit.id)) continue;
    // 이미 만든 것과 효과가 겹쳐 죽는 조합은 권하지 않는다
    if (madeFinals.some((m) => conflictsOf(index, m.id).some((c) => c.withId === unit.id))) continue;

    const cost = unitCost(index, unit.id);
    if (!cost) continue;
    const plan = planTarget(index, unit.id, inventory);
    const progress = plan.leafTotal ? plan.leafHave / plan.leafTotal : 0;
    const fills = unit.roles.filter((r) => missing.includes(r));

    // 이미 만든 것들과 재료가 얼마나 겹치는지 (평균)
    const overlap = madeFinals.length
      ? madeFinals.reduce((s, m) => s + materialOverlap(index, m.id, unit.id), 0) / madeFinals.length
      : 0;

    // 빈 역할을 메우는 것이 1순위다 — 싸다고 역할 안 맞는 걸 위로 올리면 덱이 절름발이가 된다
    const score = fills.length * 90
      + Math.max(0, 160 - cost.units) * 0.45
      + progress * 55
      - overlap * 30;
    rows.push({ unit, cost, plan, progress, fills, overlap, tier: goalTier(cost), score });
  }
  rows.sort((a, b) => b.score - a.score);
  return { missing, haveRoles: [...haveRoles], picks: rows.slice(0, limit) };
}

/**
 * 「선택 위습」으로 받은 영웅에서 출발해 노릴 만한 최종 목표를 고른다.
 *
 * 원랜디는 스토리를 밀면 그 등급의 '선택 위습'을 주고 원하는 유닛을 하나 받는다.
 * 그 유닛이 그 판의 출발점이 되므로, **그것을 재료로 쓰는 최종 목표**를 보여주면
 * 초보자가 길을 잃지 않는다 (대표 제안 2026-08-20).
 *
 * @returns {{seed: object, goals: {unit, cost, plan, progress, uses, tier, score}[]}}
 */
function goalsFrom(index, seedId, inventory = new Map(), { limit = 6 } = {}) {
  const seed = index.get(seedId);
  if (!seed) return { seed: null, goals: [] };

  // seed가 (직·간접) 재료로 들어가는 최종 목표만 추린다
  const reachable = new Set(upgradePaths(index, seedId, { depth: 6 }).map((r) => r.unit.id));
  const goals = [...reachable]
    .map((id) => index.get(id))
    .filter((u) => u && isTopGoal(index, u))
    .map((unit) => {
      const cost = unitCost(index, unit.id);
      const plan = planTarget(index, unit.id, inventory);
      const progress = plan.leafTotal ? plan.leafHave / plan.leafTotal : 0;
      // seed가 그 목표에 몇 개나 들어가는지 — 많이 쓰일수록 그 판의 축이 된다
      const uses = expandLeaves(index, unit.id, 1).get(seedId)
        ?? (index.usedIn.get(seedId) ?? []).find((p) => p.id === unit.id)?.count ?? 1;
      const core = unit.roles.filter((r) => CORE_ROLE_KEYS.includes(r)).length;
      const score = Math.max(0, 160 - (cost?.units ?? 999)) * 0.7
        + progress * 60 + core * 12 + Math.min(uses, 8) * 4;
      return { unit, cost, plan, progress, uses, tier: goalTier(cost), score };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, limit);
  return { seed, goals };
}

/** 선택 위습으로 받을 만한 유닛 (그 등급에서 위로 잘 뻗는 것 순) */
function wispPicks(index, gradeBase, { limit = 12 } = {}) {
  const reach = materialReach(index);
  return [...index.units.values()]
    .filter((u) => u.gradeBase === gradeBase)
    .map((unit) => ({ unit, reach: reach.get(unit.id) ?? 0 }))
    .sort((a, b) => b.reach - a.reach || a.unit.name.localeCompare(b.unit.name, 'ko'))
    .slice(0, limit);
}

/**
 * ORANDI 조합 도우미 — 화면 계층 (2026-08-20 전면 개편)
 *
 * 설계 원칙 하나: **요리 레시피처럼 체크해 나간다.**
 *   목표 하나를 정하면 만들어야 할 것이 순서대로 뜨고,
 *   만들 때마다 「만들었음」만 누르면 다음 것이 저절로 올라온다.
 *   보유를 일일이 입력하던 병목을 없애는 것이 목적이다.
 *
 * 계산은 전부 engine.js가 한다. 여기서는 그리기와 상태 보관만 한다.
 */

const REMOTE = 'https://static.tmo.gg/ord-helper/assets.json';
const STORE = 'orandi:v4';

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const img = (u) => `<img src="${esc(u.image)}" alt="" loading="lazy" />`;

const state = {
  index: null,
  inventory: new Map(),   // 기본 재료 보유
  goal: null,             // 지금 만들려는 최종 영웅 id
  made: [],               // 만든 순서 기록
  mode: 'run',
  zoom: 1,
  pickerRole: 'reco',        // 처음엔 추천부터 보여준다 (초보자 기준)
  findRole: 'mainDps',
  selected: null,
  seed: null,                 // 선택 위습으로 받은 시작 영웅
  pickMode: 'goal',           // 'goal' = 목표 고르기 / 'seed' = 받은 영웅 고르기
  seedGrade: '특별함',
};

/* ───────────────────────── 저장 ───────────────────────── */

function persist() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      inventory: [...state.inventory], goal: state.goal, made: state.made, zoom: state.zoom, seed: state.seed,
    }));
  } catch { /* 저장 실패가 기능을 막지는 않는다 */ }
}

function restore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || '{}');
    if (Array.isArray(s.inventory)) state.inventory = new Map(s.inventory.filter(([id]) => state.index.get(id)));
    if (s.goal && state.index.get(s.goal)) state.goal = s.goal;
    if (s.seed && state.index.get(s.seed)) state.seed = s.seed;
    if (Array.isArray(s.made)) state.made = s.made.filter((id) => state.index.get(id));
    if (Number(s.zoom) > 0) state.zoom = Number(s.zoom);
  } catch { /* 손상된 저장값은 버린다 */ }
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.hidden = true; }, 2400);
}

/* ───────────────────────── 공통 조각 ───────────────────────── */

function gradeTag(u) {
  const r = powerRank(state.index, u);
  // ⚠️ 클래스 이름을 'top'으로 두면 헤더의 .top 스타일이 배지에 딸려 붙는다(2026-08-20 적발)
  const tier = r < 0 ? 'gr-sp' : r <= 3 ? 'gr-low' : r <= 5 ? 'gr-mid' : r <= 8 ? 'gr-high' : 'gr-top';
  return `<span class="gr ${tier}">${esc(u.gradeBase)}</span>`
    + (u.damageType ? `<span class="dt ${u.damageType === '마딜' ? 'm' : u.damageType === '물딜' ? 'p' : 's'}">${esc(u.damageType)}</span>` : '');
}

function roleTags(u) {
  return u.roles.map((k) => ROLES.find((r) => r.key === k)).filter(Boolean)
    .map((r) => `<span class="rt">${esc(r.label)}</span>`).join('');
}

function matsOf(u) {
  return u.stuffs.map((s) => {
    const have = invGet(state.inventory, s.id);
    const ok = have >= s.count;
    return `<span class="m ${ok ? 'ok' : ''}">${esc(state.index.name(s.id))}${s.count > 1 ? `×${s.count}` : ''}</span>`;
  }).join('');
}

/* ───────────────────────── 진행 화면 ───────────────────────── */

function renderRun() {
  const goal = state.index.get(state.goal);

  if (!goal && state.seed) {
    const { seed, goals } = goalsFrom(state.index, state.seed, state.inventory, { limit: 5 });
    const label = (k) => ROLES.find((r) => r.key === k)?.label ?? k;
    $('#goalBar').innerHTML = `
      <div class="seed-card">
        ${img(seed)}
        <div>
          <span class="gc-label">받은 영웅</span>
          <b>${esc(seed.name)}</b>
          <span class="gc-tags">${gradeTag(seed)}${roleTags(seed)}</span>
        </div>
        <button class="ghost-btn" data-open-seed>바꾸기</button>
      </div>`;
    $('#laneNow').innerHTML = goals.length ? `
      <h2 class="lane-h next">이 영웅으로 갈 수 있는 목표</h2>
      <p class="lane-note">고르면 만들 순서가 펼쳐집니다.</p>
      ${goals.map((g) => `
        <article class="task next-task">
          ${img(g.unit)}
          <div class="t-text">
            <b>${esc(g.unit.name)}</b>
            <div class="t-mats">
              <span class="tier ${g.tier.key}">${esc(g.tier.label)}</span>
              ${gradeTag(g.unit)}
              <span class="m">재료 ${g.cost.units}개</span>
              ${g.unit.roles.filter((r) => CORE_ROLE_KEYS.includes(r)).length
                ? `<span class="fills">${g.unit.roles.filter((r) => CORE_ROLE_KEYS.includes(r)).map(label).map(esc).join('·')}</span>` : ''}
            </div>
          </div>
          <button class="make-btn" data-goal="${esc(g.unit.id)}">이걸로</button>
        </article>`).join('')}`
      : '<p class="lane-note">이 영웅에서 이어지는 최종 목표를 못 찾았습니다. 위 <b>바꾸기</b>로 다른 영웅을 골라보세요.</p>';
    $('#laneWait').innerHTML = '';
    $('#laneMats').innerHTML = '';
    $('#doneDrawer').hidden = true;
    return;
  }

  if (!goal) {
    $('#goalBar').innerHTML = `
      <div class="pick-hero">
        <h1>무엇을 만들까요?</h1>
        <p>목표를 하나 정하면 <b>만들 순서가 전부 펼쳐집니다.</b><br />만들 때마다 누르기만 하면 됩니다.</p>
        <button class="big-btn" data-open-picker>목표 고르기</button>
        <p class="or-line">또는</p>
        <button class="big-btn ghost" data-open-seed>게임에서 받은 영웅으로 시작</button>
        <p class="hint-line">스토리를 밀면 주는 <b>선택 위습</b>으로 받은 영웅을 고르면,<br />그 영웅으로 갈 수 있는 목표를 찾아드립니다.</p>
      </div>`;
    $('#laneNow').innerHTML = '';
    $('#laneWait').innerHTML = '';
    $('#laneMats').innerHTML = '';
    $('#doneDrawer').hidden = true;
    return;
  }

  const plan = planTarget(state.index, goal.id, state.inventory);
  const pct = plan.leafTotal ? Math.round((plan.leafHave / plan.leafTotal) * 100) : 100;
  const doable = plan.steps.filter((s) => craftTimes(state.index, state.inventory, state.index.get(s.unitId)) >= s.times);
  const waiting = plan.steps.filter((s) => !doable.includes(s));

  // 목표 + 진행률
  $('#goalBar').innerHTML = `
    <div class="goal-card ${plan.ok ? 'ready' : ''}">
      ${img(goal)}
      <div class="gc-text">
        <span class="gc-label">목표</span>
        <b>${esc(goal.name)}</b>
        <span class="gc-tags">${gradeTag(goal)}${roleTags(goal)}</span>
      </div>
      <div class="gc-pct">
        <b>${pct}<i>%</i></b>
        <span>재료 ${plan.leafHave}/${plan.leafTotal}</span>
      </div>
      <button class="ghost-btn" data-open-picker>바꾸기</button>
      <div class="gc-bar"><i style="width:${pct}%"></i></div>
    </div>
    <details class="recipe-drawer">
      <summary>${esc(goal.name)} 조합식 전체 보기</summary>
      <ul class="tree">${recipeTree(goal.id)}</ul>
    </details>`;

  // 1) 지금 만들 수 있는 것 — 화면에서 제일 크다
  if (plan.ok && !plan.steps.length) {
    $('#laneNow').innerHTML = `
      <div class="finished">
        <b>완성했습니다</b>
        <span>${esc(goal.name)} 재료가 전부 모였습니다. 인게임에서 조합하세요.</span>
        ${goal.commands.length ? `<button class="cmd-btn big" data-copy="${esc(goal.commands[0])}">-${esc(goal.commands[0])} 복사</button>` : ''}
      </div>`;
    // 다음에 뭘 만들지까지 이어서 알려준다 — 역할이 비지 않게
    $('#laneWait').innerHTML = renderNextGoals([...state.made, goal.id]);
    $('#laneMats').innerHTML = '';
    renderDone();
    return;
  }

  $('#laneNow').innerHTML = doable.length ? `
    <h2 class="lane-h now">지금 만들 수 있는 것 <b>${doable.length}</b></h2>
    ${doable.map((s) => {
      const u = state.index.get(s.unitId);
      const cmd = u.commands[0];
      return `<article class="task go">
        ${img(u)}
        <div class="t-text">
          <b>${esc(u.name)}${s.times > 1 ? ` ×${s.times}` : ''}</b>
          <div class="t-mats">${matsOf(u)}</div>
        </div>
        ${cmd ? `<button class="cmd-btn" data-copy="${esc(cmd)}">-${esc(cmd)}</button>` : ''}
        <button class="make-btn" data-make="${esc(u.id)}" data-n="${s.times}">만들었음</button>
      </article>`;
    }).join('')}` : `
    <h2 class="lane-h idle">지금 만들 수 있는 게 없습니다</h2>
    <p class="lane-note">아래 <b>더 모아야 할 재료</b>를 채우면 여기에 올라옵니다.</p>`;

  // 2) 재료 기다리는 것
  $('#laneWait').innerHTML = waiting.length ? `
    <h2 class="lane-h wait">재료 모이면 만들 것 <b>${waiting.length}</b></h2>
    ${waiting.slice(0, 12).map((s) => {
      const u = state.index.get(s.unitId);
      return `<article class="task">
        ${img(u)}
        <div class="t-text">
          <b>${esc(u.name)}${s.times > 1 ? ` ×${s.times}` : ''}</b>
          <div class="t-mats">${matsOf(u)}</div>
        </div>
      </article>`;
    }).join('')}
    ${waiting.length > 12 ? `<p class="lane-note">그 밖에 ${waiting.length - 12}단계 더 있습니다.</p>` : ''}` : '';

  // 3) 더 모아야 할 기본 재료 — 여기가 유일한 입력 지점
  const short = [...plan.shortage.entries()]
    .map(([id, n]) => ({ unit: state.index.get(id), n }))
    .filter((r) => r.unit)
    .sort((a, b) => b.n - a.n);
  const res = [...plan.resources.entries()]
    .map(([id, n]) => ({ unit: state.index.get(id), n })).filter((r) => r.unit);

  $('#laneMats').innerHTML = (short.length || res.length) ? `
    <h2 class="lane-h mats">더 모아야 할 재료</h2>
    <p class="lane-note">게임에서 얻으면 <b>+</b>를 누르세요.</p>
    <div class="mat-grid">
      ${short.map((r) => `
        <div class="mat">
          ${img(r.unit)}
          <span class="mat-n"><b>${esc(r.unit.name)}</b><small>${invGet(state.inventory, r.unit.id)} / 필요 ${r.n + invGet(state.inventory, r.unit.id)}</small></span>
          <span class="mat-need">${r.n}<i>더</i></span>
          <span class="mat-btns">
            <button data-inv="${esc(r.unit.id)}" data-d="-1">−</button>
            <button data-inv="${esc(r.unit.id)}" data-d="1">＋</button>
          </span>
        </div>`).join('')}
      ${res.map((r) => `
        <div class="mat res">
          ${img(r.unit)}
          <span class="mat-n"><b>${esc(r.unit.name)}</b><small>${invGet(state.inventory, r.unit.id)} / 필요 ${r.n + invGet(state.inventory, r.unit.id)}</small></span>
          <span class="mat-need">${r.n}<i>더</i></span>
          <span class="mat-btns">
            <button data-inv="${esc(r.unit.id)}" data-d="-1">−</button>
            <button data-inv="${esc(r.unit.id)}" data-d="1">＋</button>
          </span>
        </div>`).join('')}
    </div>` : `
    <h2 class="lane-h ok">재료가 전부 모였습니다</h2>`;

  renderDone();
}

/** 다음에 만들면 좋은 영웅 — 비어 있는 역할을 메우고 재료를 덜 뺏는 순 */
function renderNextGoals(madeIds) {
  const { missing, haveRoles, picks } = nextGoals(state.index, madeIds, state.inventory, { limit: 5 });
  const label = (k) => ROLES.find((r) => r.key === k)?.label ?? k;
  if (!picks.length) return '';

  return `
    <h2 class="lane-h next">다음엔 이걸 만드세요</h2>
    <p class="lane-note">
      지금 갖춘 역할 — ${haveRoles.length ? haveRoles.map(label).map(esc).join(' · ') : '아직 없음'}<br />
      ${missing.length
        ? `<b class="miss">비어 있는 역할 — ${missing.map(label).map(esc).join(' · ')}</b>`
        : '<b class="ok-text">핵심 역할이 전부 채워졌습니다</b>'}
    </p>
    ${picks.map((r) => `
      <article class="task next-task">
        ${img(r.unit)}
        <div class="t-text">
          <b>${esc(r.unit.name)}</b>
          <div class="t-mats">
            <span class="tier ${r.tier.key}">${esc(r.tier.label)}</span>
            ${gradeTag(r.unit)}
            ${r.fills.length ? `<span class="fills">${r.fills.map(label).map(esc).join('·')} 메움</span>` : ''}
            <span class="m">재료 ${r.cost.units}개</span>
            ${r.overlap > 0.4 ? `<span class="m warn">재료 겹침 ${Math.round(r.overlap * 100)}%</span>` : ''}
          </div>
        </div>
        <button class="make-btn" data-goal="${esc(r.unit.id)}">이걸 목표로</button>
      </article>`).join('')}`;
}

function renderDone() {
  const drawer = $('#doneDrawer');
  drawer.hidden = state.made.length === 0;
  $('#doneCount').textContent = state.made.length;
  $('#doneList').innerHTML = state.made.slice().reverse().map((id) => {
    const u = state.index.get(id);
    return u ? `<span class="done-chip">${img(u)}${esc(u.name)}</span>` : '';
  }).join('');
}

/* ───────────────────────── 목표 고르기 ───────────────────────── */

function openPicker(mode = 'goal') {
  state.pickMode = mode;
  $('#picker').hidden = false;
  $('#pickerQ').value = '';
  $('.sheet-head h2').textContent = mode === 'seed' ? '게임에서 받은 영웅이 뭔가요?' : '무엇을 만들까요';
  renderPicker();
  $('#pickerQ').focus();
}

/** 받은 영웅(선택 위습) 고르기 — 등급별로 '위로 잘 뻗는' 순 */
function renderSeedPicker() {
  const q = $('#pickerQ').value.trim();
  const grades = ['흔함', '안흔함', '특별함', '희귀함', '전설'];
  $('#pickerRoles').innerHTML = grades.map((g) =>
    `<button class="chip ${state.seedGrade === g ? 'on' : ''}" data-sgrade="${esc(g)}">${esc(g)}</button>`).join('');

  const list = q
    ? searchUnits(state.index, q, { limit: 30 }).map((h) => ({ unit: h.unit, reach: null }))
    : wispPicks(state.index, state.seedGrade, { limit: 14 });

  $('#pickerList').innerHTML = `
    <div class="pick-sec">
      <h3>${q ? '검색 결과' : `${esc(state.seedGrade)} 선택 위습`}</h3>
      <p>${q ? '' : '위쪽 조합에 많이 쓰이는 순서입니다. 이걸 받으면 길이 넓어집니다.'}</p>
    </div>
    ${list.map(({ unit, reach }) => `
      <button class="pick-row" data-seed="${esc(unit.id)}">
        ${img(unit)}
        <span class="pr-text">
          <b>${esc(unit.name)}</b>
          <span class="pr-tags">${gradeTag(unit)}${roleTags(unit)}</span>
          <small>${reach !== null ? `상위 조합 ${reach}곳에 쓰임` : esc(unit.grade)}</small>
        </span>
      </button>`).join('')}`;
}

function pickRow(u, note, star) {
  const c = unitCost(state.index, u.id);
  const p = planTarget(state.index, u.id, state.inventory);
  const pct = p.leafTotal ? Math.round((p.leafHave / p.leafTotal) * 100) : 100;
  const tier = goalTier(c);
  return `<button class="pick-row ${star ? 'reco' : ''}" data-goal="${esc(u.id)}">
    ${img(u)}
    <span class="pr-text">
      <b>${esc(u.name)}</b>
      <span class="pr-tags">${star ? '<span class="star">⭐</span>' : ''}<span class="tier ${tier.key}">${esc(tier.label)}</span>${gradeTag(u)}${roleTags(u)}</span>
      <small>${esc(costLabel(c))}${note ? ` · ${esc(note)}` : ''}</small>
    </span>
    <span class="pr-pct ${pct >= 100 ? 'full' : ''}">${pct}%</span>
  </button>`;
}

function renderPicker() {
  if (state.pickMode === 'seed') { renderSeedPicker(); return; }
  const q = $('#pickerQ').value.trim();
  $('#pickerRoles').innerHTML =
    `<button class="chip ${state.pickerRole === 'reco' ? 'on' : ''}" data-prole="reco">⭐ 추천</button>`
    + ROLES.map((r) =>
      `<button class="chip ${state.pickerRole === r.key ? 'on' : ''}" data-prole="${r.key}">${esc(r.label)}</button>`).join('');

  // 검색 중이면 검색 결과
  if (q) {
    const list = searchUnits(state.index, q, { limit: 40 }).map((h) => h.unit).filter((u) => u.craftable);
    $('#pickerList').innerHTML = list.length ? list.map((u) => pickRow(u)).join('')
      : '<p class="empty">해당하는 영웅이 없습니다.</p>';
    return;
  }

  // 추천 — 뭘 만들지 모를 때 여기부터 본다
  if (state.pickerRole === 'reco') {
    const starters = starterGoals(state.index, state.inventory, { limit: 8 });
    const close = closestGoals(state.index, state.inventory, { limit: 5 });
    const label = (k) => ROLES.find((r) => r.key === k)?.label ?? k;
    $('#pickerList').innerHTML = `
      ${close.length ? `
        <div class="pick-sec">
          <h3>지금 재료로 가장 가까운 것</h3>
          <p>거의 다 모았습니다. 이것부터 끝내면 빠릅니다.</p>
        </div>
        ${close.map((r) => pickRow(r.unit, '거의 다 됨', true)).join('')}` : ''}
      <div class="pick-sec">
        <h3>처음이라면 이것부터</h3>
        <p><b>최종 목표</b>만 보여줍니다. 낮은 등급은 어차피 가는 길에 저절로 만들어집니다.</p>
      </div>
      ${starters.map((r) => pickRow(r.unit,
        r.coreRoles.length ? `${r.coreRoles.map(label).join('·')} 담당` : '', true)).join('')}`;
    return;
  }

  // 역할을 골랐을 때 — 센 순으로만 늘어놓으면 뭘 고를지 알 수 없다.
  // 그 역할 안에서 '만들 만한 것'을 먼저 세운다.
  const roleName = ROLES.find((r) => r.key === state.pickerRole)?.label ?? '';
  const picks = roleGoals(state.index, state.pickerRole, state.inventory, { limit: 5 });
  const pickIds = new Set(picks.map((p) => p.unit.id));
  const rest = heroesByRole(state.index, state.pickerRole, { limit: 60 })
    .filter((u) => u.craftable && !pickIds.has(u.id));

  if (!picks.length && !rest.length) {
    $('#pickerList').innerHTML = '<p class="empty">해당하는 영웅이 없습니다.</p>';
    return;
  }

  $('#pickerList').innerHTML = `
    ${picks.length ? `
      <div class="pick-sec">
        <h3>⭐ ${esc(roleName)} 최종 목표</h3>
        <p>이 역할을 맡는 <b>최종 영웅</b>입니다. 난이도를 보고 고르세요.</p>
      </div>
      ${picks.map((r, i) => pickRow(r.unit, i === 0 ? '가장 추천' : '', true)).join('')}` : ''}
    ${rest.length ? `
      <div class="pick-sec">
        <h3>${esc(roleName)} 전체 <span class="sec-n">${rest.length}</span></h3>
        <p>중간 단계 영웅까지 포함한 목록입니다. 대부분 위 목표로 가는 길에 자동으로 거쳐 갑니다.</p>
      </div>
      ${rest.map((u) => pickRow(u)).join('')}` : ''}`;
}

/* ───────────────────────── 영웅 찾기 ───────────────────────── */

function renderFind() {
  const q = $('#q').value.trim();
  $('#roleChips').innerHTML = ROLES.map((r) =>
    `<button class="chip ${!q && state.findRole === r.key ? 'on' : ''}" data-frole="${r.key}">${esc(r.label)}</button>`).join('');

  const list = q
    ? searchUnits(state.index, q, { limit: 48 }).map((h) => h.unit)
    : heroesByRole(state.index, state.findRole, { limit: 48 });

  $('#findList').innerHTML = list.length ? list.map((u) => {
    const c = unitCost(state.index, u.id);
    return `<button class="hero ${state.selected === u.id ? 'on' : ''}" data-sel="${esc(u.id)}">
      ${img(u)}
      <span class="h-text">
        <b>${esc(u.name)}</b>
        <span class="h-tags">${gradeTag(u)}${roleTags(u)}</span>
        ${c ? `<small>${esc(costLabel(c))}</small>` : `<small>${esc(howToGet(state.index, u).kind)}</small>`}
      </span>
    </button>`;
  }).join('') : '<p class="empty">없습니다.</p>';

  renderDetail();
}

function renderDetail() {
  const box = $('#findDetail');
  const u = state.index.get(state.selected);
  if (!u) { box.innerHTML = ''; return; }

  const how = howToGet(state.index, u);
  const cost = unitCost(state.index, u.id);
  const ups = upgradePaths(state.index, u.id, { depth: 2 });
  const mates = partnersFor(state.index, u.id, { limit: 6 });
  const conf = conflictsOf(state.index, u.id);

  box.innerHTML = `
    <div class="detail">
      <div class="d-head">
        ${img(u)}
        <div>
          <b>${esc(u.name)}</b>
          <div class="h-tags">${gradeTag(u)}${roleTags(u)}</div>
          <div class="d-facts">
            <span><i>얻는 법</i>${esc(how.text)}</span>
            ${cost ? `<span><i>코스트</i>${esc(costLabel(cost))}</span>` : ''}
            ${conf.map((c) => `<span class="warn"><i>같이 못 씀</i>${esc(c.withName)} — ${esc(c.reason)}</span>`).join('')}
          </div>
          ${u.craftable ? `<button class="big-btn sm" data-goal="${esc(u.id)}">이걸 목표로</button>` : ''}
        </div>
      </div>

      ${u.desc ? `<pre class="d-desc">${esc(u.desc)}</pre>` : ''}

      ${u.craftable ? `<div class="d-sec">
        <h3>조합식 <small>무엇으로 만드는지 끝까지</small></h3>
        <ul class="tree">${recipeTree(u.id)}</ul>
      </div>` : ''}

      ${ups.length ? `<div class="d-sec">
        <h3>이걸 재료로 쓰는 조합 <b>${ups.length}</b></h3>
        <div class="chip-row">${ups.slice(0, 12).map((x) =>
          `<button class="uchip" data-sel="${esc(x.unit.id)}">${img(x.unit)}${esc(x.unit.name)}<i>${x.step}단계</i></button>`).join('')}</div>
      </div>` : ''}

      ${mates.length ? `<div class="d-sec">
        <h3>같이 쓰면 좋은 영웅</h3>
        <div class="chip-row">${mates.map((m) =>
          `<button class="uchip" data-sel="${esc(m.unit.id)}">${img(m.unit)}${esc(m.unit.name)}
            <i>${m.covers.map((k) => ROLES.find((r) => r.key === k)?.label).filter(Boolean).join('·')} 보완</i></button>`).join('')}</div>
      </div>` : ''}
    </div>`;
}

/**
 * 조합식 트리 — 이 유닛이 무엇으로 만들어지는지 끝까지 펼친다.
 * 이미 다 갖춘 가지는 접어서 남은 것만 보이게 한다.
 */
function recipeTree(unitId, times = 1, depth = 0, path = new Set()) {
  const u = state.index.get(unitId);
  if (!u) return `<li>알 수 없는 재료</li>`;
  const have = invGet(state.inventory, unitId);
  const enough = have >= times;

  // 누르면 +1, 오른쪽 클릭이면 −1. 다 채우면 초록으로 바뀌고 아래가 접힌다.
  const head = `<button class="tnode ${enough ? 'ok' : ''}" data-inv="${esc(u.id)}" data-d="1"
      title="누르면 있음(+1) · 오른쪽 클릭이면 −1">
      ${img(u)}
      <b>${esc(u.name)}</b>
      ${times > 1 ? `<i class="tq">×${times}</i>` : ''}
      <span class="tg">${esc(u.gradeBase)}</span>
      <span class="ts">${have}/${times}</span>
      ${enough ? '<span class="tok">✓</span>' : ''}
    </button>`;

  if (!u.craftable || path.has(unitId) || depth > 9) return `<li>${head}</li>`;
  if (enough) return `<li>${head}<span class="tfold">아래 생략</span></li>`;

  const next = new Set(path).add(unitId);
  return `<li>${head}<ul>${u.stuffs
    .map((x) => recipeTree(x.id, x.count * times, depth + 1, next)).join('')}</ul></li>`;
}

/* ───────────────────────── 동작 ───────────────────────── */

function setSeed(id) {
  state.seed = id;
  state.inventory = invAdd(state.inventory, id, 1);   // 받은 영웅은 이미 손에 있다
  $('#picker').hidden = true;
  persist();
  renderRun();
  toast(`${state.index.name(id)}로 시작합니다`);
}

function setGoal(id) {
  state.goal = id;
  $('#picker').hidden = true;
  setMode('run');
  persist();
  renderRun();
  toast(`목표: ${state.index.name(id)}`);
}

function make(id, want = 1) {
  try {
    // 화면에 「×4」라고 적어놓고 1개만 만들면 라벨이 거짓말이 된다.
    // 만들 수 있는 만큼 한 번에 만든다.
    const n = Math.max(1, Math.min(want, craftTimes(state.index, state.inventory, state.index.get(id))));
    state.inventory = applyCraft(state.index, state.inventory, id, n);
    for (let i = 0; i < n; i += 1) state.made.push(id);
    persist();
    renderRun();
    toast(`${state.index.name(id)}${n > 1 ? ` ${n}개` : ''} 완료`);
  } catch (e) {
    toast(e.message);
  }
}

function setMode(mode) {
  state.mode = mode;
  $$('.mode').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  $('#viewRun').hidden = mode !== 'run';
  $('#viewFind').hidden = mode !== 'find';
  window.scrollTo(0, 0);
  if (mode === 'find') renderFind();
}

/* ───────────────────────── 이벤트 ───────────────────────── */

document.addEventListener('click', (e) => {
  const t = (sel) => e.target.closest(sel);

  if (t('[data-mode]')) { setMode(t('[data-mode]').dataset.mode); return; }
  if (t('[data-open-picker]')) { openPicker('goal'); return; }
  if (t('[data-open-seed]')) { openPicker('seed'); return; }
  if (t('[data-seed]')) { setSeed(t('[data-seed]').dataset.seed); return; }
  const sg = t('[data-sgrade]');
  if (sg) { state.seedGrade = sg.dataset.sgrade; $('#pickerQ').value = ''; renderPicker(); return; }
  if (t('#pickerClose')) { $('#picker').hidden = true; return; }
  if (t('[data-goal]')) { setGoal(t('[data-goal]').dataset.goal); return; }
  if (t('[data-make]')) { const b = t('[data-make]'); make(b.dataset.make, Number(b.dataset.n || 1)); return; }

  const inv = t('[data-inv]');
  if (inv) {
    const openRecipe = document.querySelector('.recipe-drawer')?.open;
    state.inventory = invAdd(state.inventory, inv.dataset.inv, Number(inv.dataset.d));
    persist();
    renderRun();
    if (state.mode === 'find') renderFind();
    // 조합식을 펼쳐놓고 체크하던 중이면 계속 펼쳐 둔다
    if (openRecipe) { const d = document.querySelector('.recipe-drawer'); if (d) d.open = true; }
    return;
  }

  const prole = t('[data-prole]');
  if (prole) { state.pickerRole = prole.dataset.prole; $('#pickerQ').value = ''; renderPicker(); return; }

  const frole = t('[data-frole]');
  if (frole) { state.findRole = frole.dataset.frole; $('#q').value = ''; renderFind(); return; }

  const sel = t('[data-sel]');
  if (sel) { state.selected = sel.dataset.sel; renderFind(); $('#findDetail').scrollIntoView({ block: 'start' }); return; }

  const copy = t('[data-copy]');
  if (copy) {
    navigator.clipboard?.writeText(`-${copy.dataset.copy}`)
      .then(() => toast(`"-${copy.dataset.copy}" 복사됨 — 채팅창에 붙여넣으세요`))
      .catch(() => toast('복사 실패'));
  }

});

$('#pickerQ').addEventListener('input', renderPicker);
$('#q').addEventListener('input', renderFind);

document.addEventListener('contextmenu', (e) => {
  const el = e.target.closest('[data-inv]');
  if (!el) return;
  e.preventDefault();
  const openRecipe = document.querySelector('.recipe-drawer')?.open;
  state.inventory = invAdd(state.inventory, el.dataset.inv, -1);
  persist();
  renderRun();
  if (state.mode === 'find') renderFind();
  if (openRecipe) { const d = document.querySelector('.recipe-drawer'); if (d) d.open = true; }
});

$('#homeBtn').addEventListener('click', () => {
  // 첫 화면으로. 모은 재료는 그대로 두고 목표만 푼다(재료까지 지우는 건 '새 판'이다).
  state.goal = null;
  state.seed = null;
  setMode('run');
  persist();
  renderRun();
});

$('#zoomBtn').addEventListener('click', () => {
  const steps = [1, 1.15, 1.3, 1.5];
  state.zoom = steps[(steps.indexOf(state.zoom) + 1) % steps.length];
  document.documentElement.style.setProperty('--zoom', state.zoom);
  $('#zoomBtn').textContent = `가 ${Math.round(state.zoom * 100)}%`;
  persist();
});

$('#resetBtn').addEventListener('click', () => {
  if (!state.inventory.size && !state.goal && !state.made.length) { toast('이미 비어 있습니다.'); return; }
  if (!confirm('새 판을 시작합니다.\n\n지금까지 모은 재료와 목표를 모두 지웁니다.')) return;
  state.inventory = new Map();
  state.goal = null;
  state.seed = null;
  state.made = [];
  persist();
  renderRun();
  toast('새 판을 시작합니다.');
});

/* ───────────────────────── 부팅 ───────────────────────── */

async function load() {
  if (globalThis.__ORANDI_DATA__) {
    return { payload: globalThis.__ORANDI_DATA__, overrides: globalThis.__ORANDI_OVERRIDES__ ?? null };
  }
  const res = await fetch(REMOTE, { cache: 'no-store' });
  const payload = res.ok ? await res.json() : JSON.parse(await (await fetch('./data/assets.json')).text());
  let overrides = null;
  try { const o = await fetch('./data/overrides.json'); if (o.ok) overrides = await o.json(); } catch { /* 없어도 된다 */ }
  return { payload, overrides };
}

(async function boot() {
  try {
    const { payload, overrides } = await load();
    state.index = applyOverrides(buildIndex(payload), overrides);
    restore();
    document.documentElement.style.setProperty('--zoom', state.zoom);
    $('#zoomBtn').textContent = `가 ${Math.round(state.zoom * 100)}%`;
    renderRun();
  } catch (err) {
    $('#goalBar').innerHTML = `<p class="empty">데이터를 불러오지 못했습니다: ${esc(err.message)}</p>`;
  }
})();

</script>
  </body>
</html>
