<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세미클래스 워크샵 게임</title>
<style>
  /* 놀이용 발표 화면 — 어두운 방·프로젝터 기준 다크 테마 */
  :root {
    --bg: #15171b; --panel: #1f2228; --line: #2e323a;
    --text: #f2efe8; --muted: #a3a7b0;
    --accent: #f5b83d; --a: #ff6b5b; --b: #4fb3ff; --ok: #5fd08a;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .score {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 32px; background: var(--panel);
    box-shadow: 0 1px 0 var(--line);
  }
  .team { display: flex; align-items: center; gap: 14px; }
  .team .name { font-size: 22px; font-weight: 700; outline: none; padding: 2px 6px; border-radius: 6px; }
  .team .name:focus { background: var(--line); }
  .team .pts { font-size: 40px; font-weight: 800; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  .team.a .pts { color: var(--a); } .team.b .pts { color: var(--b); }
  .team button {
    width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 22px; cursor: pointer;
    transition: transform 100ms ease-out, border-color 150ms ease-out;
  }
  .team button:active { transform: scale(0.96); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .center-title { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 48px; text-align: center; }
  .home h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; }
  .home p { color: var(--muted); font-size: 20px; margin-bottom: 48px; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card {
    width: 260px; padding: 36px 24px; border-radius: 10px; background: var(--panel);
    border: 1px solid var(--line); cursor: pointer; color: inherit; font: inherit;
    transition: transform 220ms var(--ease), border-color 220ms var(--ease);
  }
  .card:active { transform: scale(0.96); }
  @media (hover: hover) and (pointer: fine) {
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .team button:hover { border-color: var(--accent); }
  }
  .card .num { font-size: 15px; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
  .card .t { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
  .card .d { font-size: 16px; color: var(--muted); line-height: 1.5; }
  .meta { font-size: 18px; color: var(--accent); font-weight: 700; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .q { font-size: 52px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; max-width: 1100px; word-break: keep-all; text-wrap: balance; }
  .chosung { font-size: 110px; letter-spacing: .12em; font-weight: 800; word-break: keep-all; line-height: 1.3; }
  .emoji { font-size: 140px; line-height: 1.2; letter-spacing: .08em; }
  .hint-ch { margin-top: 32px; font-size: 44px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
  .choices { margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; font-size: 32px; color: var(--muted); text-align: left; }
  /* 인물 사진: 확대+흐림 → 조금 멀리 → 전체 → 정답 */
  .photo-row { display: flex; align-items: center; gap: 48px; min-height: 0; }
  .frame {
    height: min(62vh, 620px); aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden;
    background: #0b0c0e; outline: 1px solid rgba(255,255,255,.1); outline-offset: -1px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .frame img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%;
    transform-origin: 50% 28%; transition: transform 600ms var(--ease), filter 600ms var(--ease);
  }
  .z0 img { transform: scale(3.2); filter: blur(10px); }
  .z1 img { transform: scale(1.9); filter: blur(3px); }
  .z2 img, .z3 img { transform: none; filter: none; }
  .side { text-align: left; min-width: 320px; }
  .side .step { font-size: 22px; color: var(--muted); margin-bottom: 14px; }
  .answer {
    font-size: 64px; font-weight: 800; letter-spacing: -0.02em; color: var(--ok);
    opacity: 0; transform: scale(.95); transition: opacity 250ms var(--ease), transform 250ms var(--ease);
  }
  main > .answer, .bell-a { margin-top: 44px; }
  .answer.show { opacity: 1; transform: none; }
  .answer small { display: block; font-size: 22px; letter-spacing: 0; color: var(--muted); font-weight: 400; margin-top: 8px; }
  .timer { position: fixed; right: 36px; bottom: 76px; font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
  .timer.end { color: var(--a); }
  footer { padding: 12px 32px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 24px; box-shadow: 0 -1px 0 var(--line); }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-family: inherit; }
  @media (max-width: 900px) {
    .score { padding: 10px 12px; }
    .team { gap: 6px; }
    .team .name { font-size: 16px; white-space: nowrap; }
    .team .pts { font-size: 30px; min-width: 36px; }
    .team button { width: 40px; height: 40px; }
    .center-title { display: none; }
    .photo-row { flex-direction: column; gap: 20px; }
    .frame { height: 46vh; }
    .side { text-align: center; min-width: 0; }
    .chosung { font-size: 64px; }
    .q { font-size: 34px; }
    .choices { font-size: 22px; }
    footer { flex-direction: column; gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .frame img { transition: filter 200ms; }
    .answer, .card, .team button { transition: opacity 200ms; transform: none; }
  }
</style>
</head>
<body>
  <div class="score">
    <div class="team a"><span class="name" contenteditable>A팀</span><button data-t="a" data-d="-1" aria-label="A팀 1점 빼기">−</button><span class="pts" id="pa">0</span><button data-t="a" data-d="1" aria-label="A팀 1점 더하기">+</button></div>
    <div class="center-title" id="ctitle">세미클래스 워크샵</div>

  </div>

  <div class="timer" id="timer" hidden></div>
  <footer>
    <span><kbd>스페이스</kbd> 다음 단계·정답 &nbsp; <kbd>→</kbd> 다음 문제 &nbsp; <kbd>←</kbd> 이전 &nbsp; <kbd>T</kbd> 타이머 &nbsp; <kbd>Esc</kbd> 처음으로</span>
    <span><kbd>1</kbd>/<kbd>2</kbd> A팀 +1/−1 &nbsp; <kbd>9</kbd>/<kbd>0</kbd> B팀 +1/−1</span>

const stage = document.getElementById('stage');
const ctitle = document.getElementById('ctitle');
const timerEl = document.getElementById('timer');
let game = null, idx = 0, step = 0, timer = null;
const pts = { a: 0, b: 0 };

function addPt(t, d) {
  pts[t] = Math.max(0, pts[t] + d);
  document.getElementById('p' + t).textContent = pts[t];
}
document.querySelectorAll('.team button').forEach(b =>
  b.addEventListener('click', () => addPt(b.dataset.t, +b.dataset.d)));

// 정답 글자에서 초성만 뽑는다 (한글이 아닌 글자는 그대로)
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const chosungOf = s => [...s].map(c => {
  const k = c.charCodeAt(0) - 0xAC00;
  return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c;
}).join('');

function home() {
  game = null; stopTimer();
  ctitle.textContent = '세미클래스 워크샵';
  stage.innerHTML = `<div class="home">
    <h1>오늘의 게임</h1>
    <p>팀 이름은 점수판의 이름을 눌러 바꿀 수 있어요</p>
    <div class="cards">${Object.entries(GAMES).map(([k, g], i) =>
      `<button class="card" data-k="${k}"><div class="num">GAME ${i + 1}</div><div class="t">${g.title}</div>
       <div class="d">${g.desc}<br>(${g.items.length}문제)</div></button>`).join('')}</div></div>`;
  stage.querySelectorAll('.card').forEach(c => c.onclick = () => start(c.dataset.k));
}

function start(k) { game = GAMES[k]; idx = 0; step = 0; render(); }

const maxStep = () => game.type === 'emoji' ? 2
  : game.type === 'bell' && game.items[idx][3] ? 2 : 1;

function render() {
  stopTimer();
  const it = game.items[idx];
  const n = `${game.title} ${idx + 1} / ${game.items.length}`;
  ctitle.textContent = n;
  let h = '';
  if (game.type === 'emoji') {
    const [kind, emo, a, hint] = it;
    h = `<div class="meta">${n}</div><div class="emoji">${emo}</div>` +
      (step >= 1 ? `<div class="hint-ch">${kind} · ${hint || chosungOf(a)}</div>` : '') +
      `<div class="answer bell-a ${step >= 2 ? 'show' : ''}">${a}</div>`;
  } else if (game.type === 'chosung') {
    h = `<div class="meta">${n} · ${it[0]}</div><div class="chosung">${it[1]}</div>
      <div class="answer ${step >= 1 ? 'show' : ''}">${it[2]}</div>`;
  } else {
    const [point, q, a, hint, note] = it;
    const shown = hint ? step >= 2 : step >= 1; // 힌트가 있으면 스페이스 한 번 더 눌러야 정답
    let hintHtml = '';
    if (hint && step >= 1) {
      hintHtml = Array.isArray(hint)
        ? `<div class="choices">${hint.map((c, i) => `<div>${i + 1}. ${c}</div>`).join('')}</div>`
        : `<div class="hint-ch">힌트 · ${hint}</div>`;
    }
    h = `<div class="meta">${n} · ${point}점${hint && step < 1 ? ' · 힌트 있음' : ''}</div><div class="q">${q}</div>` +
      hintHtml +
      `<div class="answer bell-a ${shown ? 'show' : ''}">${a}${note ? `<small>${note}</small>` : ''}</div>`;
  }
  stage.innerHTML = h;
}

function stopTimer() { clearInterval(timer); timer = null; timerEl.hidden = true; timerEl.classList.remove('end'); }
function startTimer(sec = 15) {
  stopTimer(); let s = sec; timerEl.hidden = false; timerEl.textContent = s;
  timer = setInterval(() => {
    s--; timerEl.textContent = s;
    if (s <= 0) { clearInterval(timer); timer = null; timerEl.textContent = '땡!'; timerEl.classList.add('end'); }
  }, 1000);
}

function stepTo(s) { step = s; render(); }

document.addEventListener('keydown', e => {
  if (e.target.isContentEditable) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } return; }
  const k = e.key;
  if (k === '1') addPt('a', 1); else if (k === '2') addPt('a', -1);
  else if (k === '9') addPt('b', 1); else if (k === '0') addPt('b', -1);
  else if (k === 'Escape') home();
  if (!game) return;
  if (k === ' ') { e.preventDefault(); if (step < maxStep()) stepTo(step + 1); }
  else if (k === 'ArrowRight') { if (idx < game.items.length - 1) { idx++; step = 0; render(); } }
  else if (k === 'ArrowLeft') { if (idx > 0) { idx--; step = 0; render(); } }
  else if (k === 't' || k === 'T') startTimer(15);
});

home();
</script>
</body>
</html>
