<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헬스푸드 데이터랩 모션그래픽 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root {
    --charcoal: #1C1C1A;
    --cream: #F2F0EB;
    --deep-green: #1E3932;
    --ink: rgba(0, 0, 0, 0.87);
    --ink-muted: rgba(0, 0, 0, 0.58);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 48px; }
  .brand { height: 22px; width: auto; display: block; margin-bottom: 20px; }
  h1 { font-size: 21px; line-height: 1.3; letter-spacing: -0.02em; font-weight: 700; margin: 0 0 6px; color: var(--charcoal); text-wrap: balance; }
  p { text-wrap: pretty; }
  .meta { font-size: 13px; color: var(--ink-muted); margin: 0 0 18px; }
  .frame {
    border-radius: 4px;
    overflow: hidden;
    background: var(--cream);
    outline: 1px solid rgba(0, 0, 0, 0.1);
    outline-offset: -1px;
  }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: var(--cream); }
  .hint { font-size: 15px; color: var(--ink); margin: 14px 0 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px;
    border-radius: 4px; font-size: 15px; font-weight: 600; text-decoration: none;
  }
  .btn-main { background: var(--deep-green); color: var(--cream); }
  .btn-main:hover, .btn-main:active { background: var(--charcoal); }
  .btn-sub { color: var(--deep-green); box-shadow: inset 0 0 0 1px var(--deep-green); }
  .btn-sub:hover, .btn-sub:active { text-decoration: underline; text-underline-offset: 3px; }
  .note { font-size: 13px; color: var(--ink-muted); margin: 32px 0 0; line-height: 1.6; }
  @media (min-width: 720px) {
    main { padding-top: 44px; }
    h1 { font-size: 40px; }
  }
</style>
</head>
<body>
<main>
  <img class="brand" src="assets/health-food-data-lab-horizontal-20260924.svg" alt="HEALTH FOOD DATA LAB">
  <h1>데이터랩 소개 모션그래픽 시안</h1>
  <p class="meta">24초 · 소리 없음 · 2026-10-02 클로드 제작</p>
  <div class="frame">
    <video src="media/hfdl-motion-24s-261002.mp4" poster="img/hfdl-motion-poster-261002.png" autoplay muted loop playsinline controls preload="auto"></video>
  </div>
  <p class="hint">폰을 가로로 돌리면 크게 보입니다.</p>
  <div class="actions">
    <a class="btn btn-main" href="media/hfdl-motion-24s-261002.mp4" download>영상 파일 받기</a>
    <a class="btn btn-sub" href="vcbio-market-fable.html">데이터랩 열기</a>
  </div>
  <p class="note">영상 속 순위·숫자는 데이터랩 화면 2026년 9월 말 기준 예시입니다. 원료 수와 자료 수는 데이터랩 「자료 지도」(2026-10-02)에서 가져왔습니다.</p>
</main>
</body>
</html>
