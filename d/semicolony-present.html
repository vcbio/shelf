:root{

  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.

  --cap-b: #37D0A9;   /* 민트 그린 */

.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }

{t:"doc",c:`<!-- s02 · 자기소개 — 3단계 타임라인 + 중앙 큰 문구 "저는 코딩 못 합니다" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>

{t:"doc",c:`<!-- s03 · 실물 3분할 — 원료 제안서 덱 / 견적서(실물) / 영업 랜딩페이지 (실물 산출물) -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

{t:"doc",c:`<!-- s05 · AI ≠ AGI — 기대와 현실 / 기대한 '만능 직원'(AGI) vs 지금의 도구(AI) 좌우 비교 + 용어 미니정의 -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

{t:"doc",c:`<!-- s06 · 네 단어 지도 — "오늘의 네 단어" / 정확성·정밀성·반복성·재현성 개관(지도) -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>
<div class="slide">

{t:"doc",c:`<!-- s07 · 다트판 2×2 — 정확성·정밀성 매트릭스 / "지금 어느 판인가요?" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */

.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }

  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------

   --------------------------------------------------------------------------- */

  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));

.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }

.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

            <div style="border-left:2px solid var(--accent-line);padding-left:9px;font-size:11.5px;line-height:1.4;color:var(--text-dim);">한 줄 던지고, 나오는 대로 받는 단계 — <b style="color:var(--accent);font-weight:700;">오늘 여기서 탈출합니다.<\/b><\/div>
          <\/div>
        <\/div>
      <\/div>

    <\/div>
  <\/div>

  <!-- 각주: 용어 병기 -->
  <div class="footnote">전문용어 &nbsp;·&nbsp; 정확성 <b>accuracy<\/b> &nbsp;/&nbsp; 정밀성 <b>precision<\/b><\/div>

  <div class="foot-brand"><span class="mark"><\/span><span class="wm">Semicolony<\/span><\/div>

{t:"doc",c:`<!-- s08 · 반복성·재현성 두 축 — 다트판 1개 + 시간축(가로)·조건축(세로) / "다음 주에도, 남이 해도" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>
<style>
  /* 다트판 그룹 호버 확대 — 이 슬라이드 판은 SVG(부모 pointer-events:none)라 공용 .hov-lift(box-shadow)가
     안 걸린다. 그래서 판 위에 pointer-events 살아있는 투명 히트 div를 겹치고, 그 hover가 대응 SVG 그룹에
     .on 클래스를 토글해 스케일한다(JS 최소 8줄). 이징·시간은 .hov-lift와 동일. */
  .brd-hov{ transform-box:fill-box; transform-origin:center;
    transition: transform .28s cubic-bezier(.2,.7,.3,1); }
  .brd-hov.on{ transform: scale(1.045); }
  /* z-index 7 = .stage(6)·SVG(5)보다 위 — 안 그러면 stage가 호버를 가로챈다(실측 확인).
     히트 영역은 판 원형 rect만 덮고 옆 텍스트 라벨과는 겹치지 않음. */
  .brd-hit{ position:absolute; z-index:7; border-radius:50%; cursor:default; }
  @media (prefers-reduced-motion: reduce){ .brd-hov{ transition:none } .brd-hov.on{ transform:none } }
<\/style>
<div class="slide">

  <div class="bg-grad"><\/div>
  <div class="glow-orb" style="width:440px;height:440px;left:24%;top:56%;transform:translate(-50%,-50%);opacity:.34;"><\/div>
  <div class="bg-grain"><\/div>
  <div class="vignette"><\/div>

  <div class="kicker"><span class="no">08<\/span><span class="bar"><\/span><span class="nm">Repeatability × Reproducibility<\/span><\/div>
  <div style="position:absolute;top:44px;right:64px;text-align:right;z-index:6;">
    <div class="label" style="color:var(--text-dim)">한 번 맞춘 게 아니라, 계속 맞추는가<\/div>
  <\/div>

  <div class="stage" style="display:flex;flex-direction:column;z-index:6;">
    <!-- 헤드라인 -->
    <div class="title" style="font-size:40px;">
      <span class="ac">다음 주<\/span>에도, <span class="ac">남<\/span>이 해도
    <\/div>
  <\/div>

  <!-- 두 축 다이어그램 (풀캔버스 좌표 1280×720 — 확정 레이아웃) -->
  <svg viewBox="0 0 1280 720" style="position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;">
    <defs>
      <!-- 과녁 심볼 (명암 교차 링 + 불스아이, 스케일 가능) -->
      <symbol id="board6" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="58" fill="var(--board-dark)" stroke="var(--line)" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="47" fill="var(--board-light)"/>
        <circle cx="60" cy="60" r="36" fill="var(--board-dark)"/>
        <circle cx="60" cy="60" r="25" fill="var(--board-light)"/>
        <circle cx="60" cy="60" r="15" fill="var(--board-dark)"/>
        <circle cx="60" cy="60" r="7" fill="var(--board-bull)"/>
        <g fill="none" stroke="var(--bg-deep)" stroke-opacity=".55" stroke-width=".8">
          <circle cx="60" cy="60" r="47"/><circle cx="60" cy="60" r="36"/>
          <circle cx="60" cy="60" r="25"/><circle cx="60" cy="60" r="15"/><circle cx="60" cy="60" r="7"/>
        <\/g>
      <\/symbol>
      <!-- 공용 화살표 라인 그라디언트 (꼬리 .15 → 머리 .9) -->
      <linearGradient id="arwG-h" gradientUnits="userSpaceOnUse" x1="540" y1="480" x2="984" y2="480">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/>
        <stop offset="1" stop-color="var(--accent)" stop-opacity=".95"/>
      <\/linearGradient>
      <linearGradient id="arwG-v" gradientUnits="userSpaceOnUse" x1="420" y1="362" x2="420" y2="332">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/>
        <stop offset="1" stop-color="var(--accent)" stop-opacity=".95"/>
      <\/linearGradient>
      <!-- 명중점 드롭섀도 -->
      <filter id="hit6" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity=".55"/>
      <\/filter>
      <!-- 불스아이 발광 (원점 과녁 전용) -->
      <filter id="bull6" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/><\/feMerge>
      <\/filter>
    <\/defs>

    <!-- L자 축: 조건축(세로, 원점 위로) + 시간축(가로, 원점 오른쪽으로). 꼬리 페이드 라인 + 셰브런 헤드. -->
    <line x1="420" y1="362" x2="420" y2="332" class="arw-line" style="stroke:url(#arwG-v)"/>
    <polyline class="arw-head arw-glow" points="414,339 420,331 426,339"/>
    <line x1="540" y1="480" x2="984" y2="480" class="arw-line" style="stroke:url(#arwG-h)"/>
    <polyline class="arw-head arw-glow" points="983,473 991,480 983,487"/>

    <!-- 원점 과녁 (지금·내가·이 AI) 중심(420,480) 지름220 -->
    <g class="brd-hov" id="brd-origin">
    <use href="#board6" x="310" y="370" width="220" height="220"/>
    <circle cx="420" cy="480" r="13" fill="var(--board-bull)" filter="url(#bull6)"/>
    <g fill="var(--text)" stroke="var(--board-dark)" stroke-width="1.4" filter="url(#hit6)">
      <circle cx="418" cy="480" r="5.5"/><circle cx="426" cy="476" r="5.5"/>
      <circle cx="420" cy="486" r="5.5"/><circle cx="413" cy="478" r="5.5"/>
    <\/g>
    <\/g>
    <text x="420" y="632" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" font-weight="700" fill="var(--text)">지금 · 내가 · 이 AI로<\/text>

    <!-- 조건축 위성 과녁 (재현성) 중심(420,238) 지름160 -->
    <g class="brd-hov" id="brd-repro">
    <use href="#board6" x="340" y="158" width="160" height="160"/>
    <g fill="var(--text)" stroke="var(--board-dark)" stroke-width="1.2" filter="url(#hit6)">
      <circle cx="418" cy="238" r="4"/><circle cx="426" cy="235" r="4"/>
      <circle cx="420" cy="244" r="4"/><circle cx="413" cy="236" r="4"/>
    <\/g>
    <\/g>
    <text x="540" y="212" font-family="Pretendard,sans-serif" font-size="18" font-weight="800" fill="var(--accent)">다른 사람·다른 AI가 던져도?<\/text>
    <text x="540" y="236" font-family="Pretendard,sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="var(--text-dim)">조건축 · 재현성<\/text>
    <text x="540" y="260" font-family="Pretendard,sans-serif" font-size="12.5" fill="var(--text-dim)">자료를 한 곳에 모아 두면 누가 해도 같은 결과<\/text>

    <!-- 시간축 위성 과녁 (반복성) 중심(1080,480) 지름160 -->
    <g class="brd-hov" id="brd-repeat">
    <use href="#board6" x="1000" y="400" width="160" height="160"/>
    <g fill="var(--text)" stroke="var(--board-dark)" stroke-width="1.2" filter="url(#hit6)">
      <circle cx="1078" cy="480" r="4"/><circle cx="1086" cy="477" r="4"/>
      <circle cx="1081" cy="486" r="4"/><circle cx="1073" cy="478" r="4"/>
    <\/g>
    <\/g>
    <text x="764" y="562" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="18" font-weight="800" fill="var(--accent)">다음 주에 다시 던져도?<\/text>
    <text x="764" y="586" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="var(--text-dim)">시간축 · 반복성<\/text>
    <text x="764" y="610" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="12.5" fill="var(--text-dim)">지시문을 저장해 두면 시간이 지나도 같은 품질<\/text>
  <\/svg>

  <!-- 다트판 호버 히트 영역 (pointer-events 살아있는 투명 div — SVG 판 위에 겹침) -->
  <div class="brd-hit" id="brd-hit-origin" style="left:310px;top:370px;width:220px;height:220px;"><\/div>
  <div class="brd-hit" id="brd-hit-repro"  style="left:340px;top:158px;width:160px;height:160px;"><\/div>
  <div class="brd-hit" id="brd-hit-repeat" style="left:1000px;top:400px;width:160px;height:160px;"><\/div>

  <!-- 각주: 용어 병기 -->
  <div class="footnote">전문용어 &nbsp;·&nbsp; 반복성 <b>repeatability<\/b> &nbsp;/&nbsp; 재현성 <b>reproducibility<\/b><\/div>

  <div class="foot-brand"><span class="mark"><\/span><span class="wm">Semicolony<\/span><\/div>

<\/div>
<script>
/* 히트 div hover → 대응 다트판 SVG 그룹 .on 토글 (실동작 보증) */
(function(){
  [['brd-hit-origin','brd-origin'],['brd-hit-repro','brd-repro'],['brd-hit-repeat','brd-repeat']].forEach(function(p){
    var hit=document.getElementById(p[0]), g=document.getElementById(p[1]);
    if(!hit||!g) return;
    hit.addEventListener('mouseenter',function(){ g.classList.add('on'); });

})();

{t:"doc",c:`<!-- s09 · 연구실의 3종 세트 — SOP·실험노트·QC 카드 3개 / "연구실이 데이터를 믿는 이유" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>
<div class="slide">

  <div class="bg-grad"><\/div>
  <div class="glow-orb" style="width:520px;height:420px;right:-60px;top:-90px;opacity:.34;"><\/div>
  <div class="bg-grain"><\/div>
  <div class="vignette"><\/div>

  <div class="kicker"><span class="no">09<\/span><span class="bar"><\/span><span class="nm">The Lab Trio<\/span><\/div>
  <div style="position:absolute;top:44px;right:64px;text-align:right;z-index:6;">
    <div class="label" style="color:var(--text-dim)">우연이 아니라 시스템<\/div>
  <\/div>

  <div class="stage" style="display:flex;flex-direction:column;z-index:6;">

    <!-- 헤드라인 -->
    <div>
      <div class="title" style="max-width:900px;">
        연구실이 <span class="ac">데이터를 믿는<\/span> 이유
      <\/div>
      <div class="sub" style="margin-top:12px;color:var(--text-dim);max-width:720px;">
        똑같은 결과가 나오도록, 세 가지를 항상 갖춰 둡니다.
      <\/div>
    <\/div>

    <!-- 카드 3분할 -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px;">

      <!-- 카드 1: SOP (매뉴얼) -->

          border:1px solid var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft);

          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--accent)"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="18" rx="2"/>
            <path d="M9 4a3 3 0 0 1 6 0"/><rect x="9" y="2.4" width="6" height="3.2" rx="1"/>

          <\/svg>
        <\/div>
        <div>
          <span class="label" style="color:var(--accent);">01 · SOP<\/span>
          <div style="font-size:20px;font-weight:800;color:var(--text);margin-top:6px;">매뉴얼<\/div>
          <div class="body" style="margin-top:8px;color:var(--text);font-size:18px;line-height:1.45;">
            일 잘하는 <b class="w700">순서<\/b>를 적어둔 지침서
          <\/div>

      <!-- 카드 2: 실험노트 (기록) -->

        <div style="width:64px;height:64px;border-radius:16px;background:var(--surface);
          border:1px solid var(--line);display:flex;align-items:center;justify-content:center;">
          <!-- 노트/기록 아이콘 -->
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
            <path d="M5 7H3M5 12H3M5 17H3"/><path d="M9 8h6M9 12h6M9 16h4"/>
          <\/svg>
        <\/div>
        <div>
          <span class="label" style="color:var(--text-dim);">02 · 실험노트<\/span>
          <div style="font-size:20px;font-weight:800;color:var(--text);margin-top:6px;">기록<\/div>
          <div class="body" style="margin-top:8px;color:var(--text);font-size:18px;line-height:1.45;">
            빠짐없이 <b class="w700">적어두는<\/b> 실험의 흔적

        <div style="margin-top:auto;padding-top:13px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;">
          <span class="label" style="letter-spacing:.1em;color:var(--text-dim);">AI에선<\/span>

        <\/div>
      <\/div>

      <!-- 카드 3: QC (검사) -->
      <div class="card hov-lift" style="padding:24px;display:flex;flex-direction:column;gap:16px;height:308px;">
        <div style="width:64px;height:64px;border-radius:16px;background:var(--surface);

          <!-- 돋보기/검사 아이콘 -->

        <div>

          <\/div>
