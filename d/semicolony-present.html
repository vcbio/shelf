{t:"doc",c:`<!-- s10 · 잘 시키는 법 — before/after 말풍선 + 4원칙 칩 / "구체적으로 시켜라" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>

{t:"doc",c:`<!-- s11 · 실제 지시문 목업 — 다크 채팅/에디터 프레임 하나 크게 / "제가 실제로 쓰는 지시문입니다"

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */

.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }

  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

   --------------------------------------------------------------------------- */

  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.

   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------

   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.

.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

    <\/div>

    <div class="small" style="text-align:center;margin-top:6px;color:var(--text-dim);">지시문은 <b style="color:var(--text);font-weight:700;">방법<\/b>을 고정합니다 — 나머지 절반, <b class="ac" style="font-weight:700;">재료<\/b>는 다음 장.<\/div>
  <\/div>

  <!-- 각주: 용어 병기 -->
  <div class="footnote">AI 용어 &nbsp;·&nbsp; <b>스킬 · 커스텀 지시문<\/b> = 연구실의 <b>SOP<\/b><\/div>

  <div class="foot-brand"><span class="mark"><\/span><span class="wm">Semicolony<\/span><\/div>

{t:"doc",c:`<!-- s13 · 자료를 줘라 — 파일 뭉치 → AI 노드 → 새 세션·다른 AI가 같은 결과로 / "설명하지 말고, 자료를 줘라" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>

      <stop offset="0" stop-color="var(--text-dim)" stop-opacity=".22"/>
      <stop offset="1" stop-color="var(--text-dim)" stop-opacity=".9"/><\/linearGradient>
  <\/defs><\/svg>

  <div class="kicker"><span class="no">13<\/span><span class="bar"><\/span><span class="nm">Give It Materials<\/span><\/div>
  <div style="position:absolute;top:44px;right:64px;text-align:right;z-index:6;">
    <div class="label" style="color:var(--text-dim)">기억이 아니라 자료로<\/div>

  <div class="stage" style="display:flex;flex-direction:column;z-index:6;">

    <!-- 헤드라인 -->
    <div>
      <div class="title" style="max-width:940px;">
        설명하지 말고, <span class="ac">자료를 줘라<\/span>
      <\/div>
      <div class="sub" style="margin-top:12px;color:var(--text-dim);max-width:760px;">
        지시문이 <b class="w700" style="color:var(--text)">방법<\/b>이라면, 자료는 <b class="ac w700">재료<\/b> — 둘이 갖춰져야 <b class="w700" style="color:var(--text)">누가 해도 같은 결과<\/b>.

    <!-- 흐름 다이어그램 -->

          <span class="body" style="font-size:16px;color:var(--text);">제품 규격서 <span class="dim" style="font-size:13px;">PDF<\/span><\/span>

          border-radius:11px;padding:10px 15px;width:186px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--cap-c)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/><\/svg>
          <span class="body" style="font-size:16px;color:var(--text);">단가표 <span class="dim" style="font-size:13px;">xlsx<\/span><\/span>
        <\/div>
        <!-- 노트 -->
        <div class="hov-lift" style="display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);
          border-radius:11px;padding:10px 15px;width:186px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--cap-d)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M5 8H3M5 12H3M5 16H3"/><\/svg>
          <span class="body" style="font-size:16px;color:var(--text);">지난 회의 노트<\/span>
        <\/div>
      <\/div>

      <!-- 화살표: 자료 주입 -->
      <div style="flex:none;display:flex;flex-direction:column;align-items:center;margin:0 22px;">

        <svg width="76" height="20" viewBox="0 0 76 20" fill="none">
          <line x1="0" y1="10" x2="66" y2="10" class="arw-line" style="stroke:url(#arwG-h)"/>

      <!-- ② AI 노드 -->
      <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;">

          background:linear-gradient(160deg,var(--surface2),var(--surface));

          display:flex;align-items:center;justify-content:center;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 7V4M9 4h6"/>
            <circle cx="9.5" cy="13" r="1.3" fill="var(--accent)" stroke="none"/><circle cx="14.5" cy="13" r="1.3" fill="var(--accent)" stroke="none"/>

      <!-- 화살표: 분기 -->

        <svg width="76" height="20" viewBox="0 0 76 20" fill="none">

        <\/svg>
      <\/div>

      <!-- ③ 두 조건 → 같은 결과 -->
      <div style="flex:none;display:flex;flex-direction:column;gap:18px;">
        <!-- 새 세션 -->
        <div style="display:flex;align-items:center;gap:14px;">
          <span class="chip chip--ghost" style="height:30px;font-size:14px;border-color:var(--accent-line);color:var(--accent);width:118px;justify-content:center;">새 세션<\/span>

{t:"doc",c:`<!-- s14 · 실험 예고 — 플라스크 + 2×2 실험 설계표(셀은 물음표) / "같은 요청을 4번 던져보겠습니다" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>

  <div class="bg-grain"><\/div>

  <div style="position:absolute;top:44px;right:64px;text-align:right;z-index:6;">
    <div class="label" style="color:var(--accent)">지금부터 라이브<\/div>

  <div class="stage" style="display:flex;align-items:center;gap:52px;z-index:6;">

    <!-- 좌: 헤드라인 + 플라스크 -->
    <div style="flex:0 0 486px;">

      <\/div>

        지시 방식 2가지 × 각 2회 반복 —<br>결과가 어떻게 달라지는지 눈으로 봅니다.

      <!-- 관전 포인트 -->
      <div style="margin-top:16px;display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:11px;
        background:var(--accent-soft);border:1px solid var(--accent-line);">
        <span style="font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.02em;">관전 포인트<\/span>
        <span style="font-size:15px;color:var(--text);">두 결과가 <b class="w700">얼마나 다른지<\/b>만 보세요<\/span>

      <!-- 플라스크 / 비커 SVG -->
      <svg width="360" height="128" viewBox="0 0 360 128" fill="none" style="margin-top:34px;">

          <!-- 기포 -->

          <path d="M0,58 h54" stroke="var(--accent)" stroke-width="2" stroke-opacity=".45"/>

          <path d="M3,64 L3,88" stroke="var(--text)" stroke-opacity=".13" stroke-width="2.2" stroke-linecap="round"/>

        <\/g>
        <!-- A/B 라벨 (플라스크=지시A, 비커=지시B) -->
        <g><circle cx="92" cy="24" r="12" fill="var(--accent-soft)" stroke="var(--accent-line)"/>

        <g><circle cx="272" cy="40" r="12" fill="var(--surface2)" stroke="var(--line)"/>
          <text x="272" y="45" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="14" font-weight="800" fill="var(--text-dim)">B<\/text><\/g>

    <!-- 우: 2×2 실험 설계표 -->

        <!-- 헤더 행 -->

{t:"doc",c:`<!-- s15 · 데모 1 배경판 — "대충 한 줄 × 2회" / 빈 결과 프레임 2개(점선) / "결과가 매번 딴판입니다" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>

        <div style="filter:blur(.6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;

{t:"doc",c:`<!-- s16 · 데모 2 배경판 — "매뉴얼 + 자료 × 2회" / 빈 결과 프레임 2개(accent 보더) / "편차가 줄었습니다 — 반복성" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }
