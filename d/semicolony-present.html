{t:"doc",c:`<!-- s18 · 에이전트 라이브 로그 — 다크 터미널 + s17 업무 루프 실행 로그가 로드 시 한 줄씩 타이핑(체크 점등·커서 깜빡임) / "이 루프는 제가 자리에 없어도 돕니다 — 승인 도장만 빼고." -->
<!-- ※ 결정론적 애니메이션(Math.random 없음): 로드 1회 재생 후 정지, 프레임 호버 시 리플레이(재생 가드). prefers-reduced-motion이면 전 줄 즉시 표시. 실제 녹화로 교체 가능. -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>
<div class="slide">

  <div class="bg-grad"><\/div>
  <div class="glow-orb" style="width:520px;height:420px;right:-60px;top:-80px;opacity:.32;"><\/div>
  <div class="bg-grain"><\/div>
  <div class="vignette"><\/div>

  <div class="kicker"><span class="no">18<\/span><span class="bar"><\/span><span class="nm">Agent · Live<\/span><\/div>
  <div style="position:absolute;top:44px;right:64px;text-align:right;z-index:6;">
    <div class="label" style="color:var(--text-dim)">실행 로그<\/div>
  <\/div>

  <style>
    /* s18 라이브 로그 — 한 줄씩 좌→우 와이프(타이핑감) + 커서 깜빡임 */
    #agentlog .logln{ opacity:0; }
    #agentlog .logln.show{ opacity:1; animation: logwipe .34s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes logwipe{ from{ clip-path: inset(0 100% 0 0); } to{ clip-path: inset(0 0 0 0); } }
    #agentlog .mk{ display:inline-block; width:22px; }
    #agentlog .mk.a{ color:var(--accent); } #agentlog .mk.ok{ color:var(--cap-b); }
    #agentlog .ok2{ color:var(--cap-b); font-weight:700; }
    .logcursor{ display:inline-block; width:8px; height:16px; background:var(--accent); vertical-align:-2px;
      margin-left:5px; box-shadow:0 0 8px var(--glow); animation: blink 1s steps(1) infinite; }
    @keyframes blink{ 50%{ opacity:0; } }
    @media (prefers-reduced-motion: reduce){
      #agentlog .logln{ opacity:1; } #agentlog .logln.show{ animation:none; } .logcursor{ animation:none; }
    }
  <\/style>

  <div class="stage" style="display:flex;flex-direction:column;justify-content:center;z-index:6;">

    <!-- 터미널 프레임 (다크) -->
    <div id="agentframe" style="border-radius:14px;overflow:hidden;border:1px solid var(--line);
      background:var(--bg-deep);box-shadow:0 40px 80px -34px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.4);">

      <!-- 타이틀바 -->
      <div style="display:flex;align-items:center;gap:14px;padding:12px 18px;
        background:var(--surface);border-bottom:1px solid var(--line);">
        <div style="display:flex;gap:8px;">
          <span style="width:12px;height:12px;border-radius:50%;background:var(--cap-b);"><\/span>
          <span style="width:12px;height:12px;border-radius:50%;background:var(--cap-d);"><\/span>
          <span style="width:12px;height:12px;border-radius:50%;background:var(--cap-c);"><\/span>
        <\/div>
        <div style="flex:1;display:flex;justify-content:center;">
          <div style="display:inline-flex;align-items:center;gap:8px;padding:5px 16px;border-radius:8px;
            background:var(--bg-deep);border:1px solid var(--line);
            font-size:13px;font-weight:600;color:var(--text-dim);letter-spacing:.02em;">
            <span style="width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow);"><\/span>
            agent — 발주 업무 루프
          <\/div>
        <\/div>
        <div class="label" style="display:inline-flex;align-items:center;gap:6px;color:var(--accent);">
          <span style="width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow);"><\/span>LIVE
        <\/div>
      <\/div>

      <!-- 본문 로그 (모노 · s17 루프 실행 로그, 가상 수치 없음) -->
      <div id="agentlog" style="padding:22px 26px;font-family:'Consolas','SFMono-Regular','Menlo',monospace;
        font-size:15px;line-height:2.02;letter-spacing:.01em;">

        <div class="logln" style="color:var(--text);"><span class="mk ok">✓<\/span><span class="ac w700">(동시)<\/span> 거래명세서 작성·납품일 알림 <span class="dim">∥<\/span> 입고 서류 분류<\/div>
        <div class="logln" style="color:var(--accent);"><span class="mk ok">✓<\/span>검수 통과 <span class="dim">→<\/span> <span class="w700">업체 전송 완료<\/span><span class="logcursor" id="logcursor"><\/span><\/div>

<script>
/* 결정론적 라이브 로그: 로드 1회 재생 → 정지, 프레임 호버 리플레이(재생 가드, s04 문법). reduced-motion이면 즉시 전체 표시. */
(function () {
  var body = document.getElementById('agentlog');
  var frame = document.getElementById('agentframe');
  var cursor = document.getElementById('logcursor');
  var lines = Array.prototype.slice.call(body.querySelectorAll('.logln'));
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DELAYS = [300, 620, 640, 900, 640, 720]; // 승인 줄(3번째) 앞 여유 = 사람 대기 뉘앙스
  var timers = [];
  var playing = false;

  function clearAll() {
    timers.forEach(clearTimeout); timers = [];
    lines.forEach(function (l) { l.classList.remove('show'); });
  }
  function showAll() {
    clearAll();
    lines.forEach(function (l) { l.classList.add('show'); });
    lines[lines.length - 1].appendChild(cursor);
    playing = false;
  }
  function play() {
    if (playing) return;
    playing = true; clearAll();
    var t = 0;
    lines.forEach(function (l, i) {
      t += DELAYS[i];
      timers.push(setTimeout(function () {
        l.classList.add('show');
        l.appendChild(cursor);                 // 커서를 현재 줄 끝으로 이동
        if (i === lines.length - 1) playing = false;
      }, t));
    });
  }

  if (reduce) showAll(); else play();
  frame.addEventListener('mouseenter', function () { if (reduce) return; if (!playing) play(); });
})();
<\/script>

{t:"doc",c:`<!-- s19 · 검사 라인 — 만드는 AI → 검사하는 AI → 사람 도장 / 가로 흐름 다이어그램 -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;

/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }

.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }

.bg-grad{ position:absolute; inset:0; z-index:0;

.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;

.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;

/* ---------------------------------------------------------------------------

.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }

/* ---------------------------------------------------------------------------

/* ---------------------------------------------------------------------------

@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

{t:"doc",c:`<!-- s21 · 환각 = AI의 직업병 — 실제 증상 3카드(출처 지어냄·확신 있게 단언·지적해도 우김) + 실화 콜아웃 + 대응 수칙 스트립(출처확인·대조·발송, 증상 1:1) / 현상→대응 -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>
<div class="slide">

  <div class="bg-grad"><\/div>
  <div class="glow-orb" style="width:460px;height:400px;left:50%;top:-60px;transform:translateX(-50%);opacity:.3;"><\/div>
  <div class="bg-grain"><\/div>
  <div class="vignette"><\/div>

  <div class="kicker"><span class="no">21<\/span><span class="bar"><\/span><span class="nm">Watch Out<\/span><\/div>
  <div style="position:absolute;top:44px;right:64px;text-align:right;z-index:6;">
    <div class="label" style="color:var(--text-dim)">AI의 직업병<\/div>
  <\/div>

  <div class="stage" style="display:flex;flex-direction:column;z-index:6;">

    <!-- 헤드라인 (유지) -->
    <div style="flex:none;margin-top:2px;">
      <div class="title" style="font-size:42px;">
        <span class="ac">환각<\/span>은, 확신 있게 틀립니다
      <\/div>
      <div class="sub" style="margin-top:10px;color:var(--text-dim);max-width:760px;font-size:20px;">
        너무 그럴싸해서 그냥 믿게 됩니다 — 그래서 사람이 걸러야 합니다.
      <\/div>
    <\/div>

    <!-- 하단 스택: 카드3 + 실화 + 수칙 스트립을 남은 공간 세로 중앙으로 -->
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;">

      <!-- 증상 3카드 (현상) -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch;">

        <!-- 증상 1: 없는 출처를 지어냄 -->
        <div class="card hov-lift" style="min-height:196px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;">
          <div style="width:52px;height:52px;flex:none;border-radius:15px;background:var(--surface2);
            border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3.5h8l4 4V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"/><path d="M14 3.5V8h4"/>
              <path d="M7.5 12h6M7.5 15h4"/>
              <path d="M18 13.4l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z" fill="var(--accent)" stroke="none"/><\/svg>
          <\/div>
          <div>
            <div class="label" style="color:var(--accent);margin-bottom:5px;">증상 01<\/div>
            <div style="font-size:20px;font-weight:800;color:var(--text);line-height:1.28;">없는 출처를 지어냅니다<\/div>
            <div class="small" style="margin-top:8px;">그럴싸한 논문·링크·판례를 만들어 인용합니다.<\/div>
          <\/div>
        <\/div>

        <!-- 증상 2: 없는 사실을 확신 있게 단언 -->
        <div class="card hov-lift" style="min-height:196px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;">
          <div style="width:52px;height:52px;flex:none;border-radius:15px;background:var(--surface2);
            border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11.4A7.4 7.4 0 0 1 12.6 18.8c-1.2 0-2.3-.3-3.3-.8L4.5 19.5l1.5-4.6A7.4 7.4 0 1 1 20 11.4Z"/>
              <path d="M12.4 7.6v4.2" stroke-width="2"/><circle cx="12.4" cy="14.7" r=".5" fill="var(--accent)" stroke="none"/><\/svg>
          <\/div>
          <div>
            <div class="label" style="color:var(--accent);margin-bottom:5px;">증상 02<\/div>
            <div style="font-size:20px;font-weight:800;color:var(--text);line-height:1.28;">없는 사실을 확신 있게 말합니다<\/div>
            <div class="small" style="margin-top:8px;">수치·규정·근거를 매끄럽게 지어냅니다.<\/div>
          <\/div>
        <\/div>

        <!-- 증상 3: 지적해도 우김 -->
        <div class="card hov-lift" style="min-height:196px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;">
          <div style="width:52px;height:52px;flex:none;border-radius:15px;background:var(--surface2);
            border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 9.5A7.5 7.5 0 0 1 17 6.2l2.2 2"/><path d="M19.5 14.5A7.5 7.5 0 0 1 7 17.8l-2.2-2"/>
              <path d="M19 4.2v4.2h-4.2"/><path d="M5 19.8v-4.2h4.2"/><\/svg>
          <\/div>
          <div>
            <div class="label" style="color:var(--accent);margin-bottom:5px;">증상 03<\/div>
            <div style="font-size:20px;font-weight:800;color:var(--text);line-height:1.28;">지적해도 우깁니다<\/div>
            <div class="small" style="margin-top:8px;">맞다고 주장하거나, 사과 후 같은 오류를 반복합니다.<\/div>
          <\/div>
        <\/div>

      <\/div>

      <!-- 실화 콜아웃 (신뢰 장치) -->
      <div class="card lite-edge hov-lift" style="padding:13px 20px;display:flex;align-items:center;gap:13px;
        border:1px solid var(--accent-line);background:linear-gradient(180deg,var(--surface2),var(--surface));">
        <span style="flex:none;display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:999px;
          background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:800;letter-spacing:.03em;">실화<\/span>
        <span class="small" style="font-size:14.5px;color:var(--text);line-height:1.4;">
          미국 변호사가 AI가 지어낸 <b class="w700" style="color:var(--text);">가짜 판례<\/b>를 법원에 제출했다가 제재받았습니다 <span class="dim">(2023)<\/span>.
        <\/span>
      <\/div>

      <!-- 대응 수칙 스트립 (기존 3수칙 압축 보존) -->
      <div class="hov-lift" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;
        padding:15px 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.05);">
        <span style="flex:none;font-size:15.5px;font-weight:800;color:var(--accent);white-space:nowrap;">그래서, 사람이 거릅니다 —<\/span>
        <div style="flex:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0;">
          <!-- ① 출처는 직접 열어 확인 (증상① 해독제) -->
          <span style="display:inline-flex;align-items:center;gap:9px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;">
              <path d="M9.5 14.5 14.5 9.5"/><path d="M11.5 7 13 5.5a3.5 3.5 0 0 1 5 5L16.5 12"/><path d="M12.5 17 11 18.5a3.5 3.5 0 0 1-5-5L7.5 12"/><\/svg>
            <span style="font-size:14px;color:var(--text);">출처는 직접 열어 확인<\/span>
          <\/span>
          <span style="width:1px;height:20px;background:var(--line);flex:none;"><\/span>
          <!-- ② 원본과 대조 -->
          <span style="display:inline-flex;align-items:center;gap:9px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;">
              <path d="M6 3.5h8l4 4V16"/><path d="M14 3.5V8h4"/><circle cx="10.5" cy="15" r="3.6"/><path d="M13.2 17.7 16 20.5"/><\/svg>
            <span style="font-size:14px;color:var(--text);">숫자·사실은 원본과 대조<\/span>
          <\/span>
          <span style="width:1px;height:20px;background:var(--line);flex:none;"><\/span>
          <!-- ③ 검토 후 발송 -->
          <span style="display:inline-flex;align-items:center;gap:9px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;">
              <path d="M20.5 3.5 11 13"/><path d="M20.5 3.5 14.5 20.5 11 13 3.5 9.5z"/><circle cx="18.4" cy="18.4" r="4.4" fill="var(--surface)"/><path d="M16.6 20.2 20.2 16.6"/><\/svg>
            <span style="font-size:14px;color:var(--text);">검토 후에만 외부 발송<\/span>
          <\/span>
        <\/div>
      <\/div>

    <\/div>

  <\/div>

  <!-- 각주: 용어 병기 (유지) -->
  <div class="footnote">전문용어 &nbsp;·&nbsp; 환각 <b>hallucination<\/b> &nbsp;=&nbsp; 그럴싸하지만 사실이 아닌 답<\/div>

  <div class="foot-brand"><span class="mark"><\/span><span class="wm">Semicolony<\/span><\/div>
  <div class="foot-page"><b>21<\/b> / 24<\/div>
<\/div>

{t:"doc",c:`<!-- s22 · 용어 사다리 — 오늘 쓴 말 / 연구실 용어 / AI 용어 3열 표 (사진 찍는 장표) -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }

<!-- s23 · Level Check — 8단계 레벨 사다리(자가진단) + 오늘의 과제 통합 / "나는 지금 몇 레벨?" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

        <path d="M941,27 V60" stroke="rgba(34,122,255,.55)" stroke-width="1.4" stroke-dasharray="3 4" fill="none"/>

      <!-- 8개 계단 -->

      <\/div>
      <div class="lv-bar on hov-lift" style="left:292px;height:164px;z-index:2;">
        <span class="lv-no">Lv.3<\/span><span class="lv-nm">손발 주기<\/span><span class="lv-ai">· 도구<\/span><span class="lv-de">파일을 읽고, 고치고, 실행한다<\/span>

        <span class="lv-no">Lv.6<\/span><span class="lv-nm">검사 달기<\/span><span class="lv-ai">· 하네스<\/span><span class="lv-de">AI 결과를 자동으로 검사시킨다<\/span>

        <\/div>
        <div class="small" style="margin-top:4px;font-size:14px;">
          이것만 하면 오늘 <b class="w700" style="color:var(--text)">강의값은 뽑은<\/b> 겁니다.

{t:"doc",c:`<!-- s24 · 클로징 — 표지 수미상관 / 다트판 동심원 은은히 + "질문 환영합니다" -->
<style>
/* ============================================================================
   세미콜로니 AI 강의 덱 — 공용 스타일 (deck.css)
   시안본 / 2026-07-21 / 콘셉트: 연구실의 반복성·정밀성·재현성을 AI에 접목
   전 슬라이드 공용: 1280x720 16:9 캔버스. 로컬 더블클릭으로 단독 렌더.
   ★ 색은 전부 이 파일의 CSS 변수로만 정의 — 변수 값 교체만으로 전체 리스킨.
   ★ 외부 의존 0 (system.css 필요 규격을 여기에 복사). 폰트만 시스템 fallback.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   [팔레트 — 블루본] 다크 네이비 베이스 + 단일 강조색(블루 1색)
   강의용 selectable 톤. 최종 색은 아래 값만 교체하면 됨.
   --------------------------------------------------------------------------- */
:root{
  --bg:          #101720;   /* 다크 네이비 베이스 */
  --bg-deep:     #0A0E14;   /* 비네트/최하단 */
  --surface:     #18222E;   /* 카드 표면 */
  --surface2:    #1E2B3A;   /* 카드 강조 표면 */
  --line:        #2A3849;   /* 헤어라인·구분선 */
  --text:        #EDF3FA;   /* 본문 밝은 오프화이트 */
  --text-dim:    #8FA0B5;   /* 라벨·캡션 뮤트 */
  --accent:      #227AFF;   /* 블루 — 주강조(핵심어·활성·불스아이) */
  --accent2:     #6AAEFF;   /* 라이트 블루 — 보조강조 */
  --accent-soft: rgba(34,122,255,.13); /* 블루 소프트 배경 */
  --accent-line: rgba(34,122,255,.34); /* 블루 헤어라인 */
  --accent-ink:  #061226;   /* 블루 칩 위 글자 */
  --glow:        rgba(34,122,255,.42); /* 발광 라디얼 */

  /* 과녁(다트판) 전용 — 명암 교차 링을 또렷하게 (s05·s06) */
  --board-light: #D8E2EE;   /* 밝은 링 */
  --board-dark:  #223142;   /* 어두운 링 */
  --board-bull:  var(--accent); /* 중앙 불스아이 */

  /* 뽑기 캡슐용 소폭 확장 팔레트 (s04) — 알록달록하되 블루 톤에 조화.
     전부 변수라 리스킨 시 함께 조정 가능. */
  --cap-a: #227AFF;   /* 블루 */
  --cap-b: #37D0A9;   /* 민트 그린 */
  --cap-c: #6AAEFF;   /* 라이트 블루 */
  --cap-d: #9AB0C9;   /* 슬레이트 그레이 */
  --cap-e: #4B7178;   /* 딥 틸 */
}

/* ---------------------------------------------------------------------------
   [타이포 스케일 — Pretendard 단독 fallback]
   --------------------------------------------------------------------------- */
:root{
  --f-giant: 92px;
  --f-title: 46px;
  --f-sub:   26px;
  --f-body:  20px;
  --f-small: 16px;
  --f-label: 13px;
  --f-foot:  12px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ background:#000; }

.slide{
  position:relative; width:1280px; height:720px; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  word-break:keep-all; overflow-wrap:anywhere;
}
/* 브라우저 중앙 정렬(더블클릭 열람 시) */
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }

/* 타이포 유틸 */
.giant{ font-size:var(--f-giant); font-weight:800; letter-spacing:-.035em; line-height:1.02; }
.title{ font-size:var(--f-title); font-weight:800; letter-spacing:-.025em; line-height:1.1; }
.sub  { font-size:var(--f-sub);   font-weight:500; letter-spacing:-.01em;  line-height:1.35; color:var(--text); }
.body { font-size:var(--f-body);  font-weight:400; line-height:1.5; color:var(--text); }
.small{ font-size:var(--f-small); font-weight:400; line-height:1.45; color:var(--text-dim); }
.label{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.ac { color:var(--accent); }
.ac2{ color:var(--accent2); }
.dim{ color:var(--text-dim); }
.w800{ font-weight:800; } .w700{ font-weight:700; } .w600{ font-weight:600; } .w400{ font-weight:400; }

/* 그리드/스테이지 — safe margin 64px */
:root{ --mx:64px; --my:64px; --cw:1152px; --ch:592px; }
.stage{ position:absolute; inset:var(--my) var(--mx); width:var(--cw); height:var(--ch); }

/* ---------------------------------------------------------------------------
   [배경 텍스처] 그레인 + 발광 라디얼 + 비네트
   --------------------------------------------------------------------------- */
.bg-grad{ position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(110% 90% at 82% 16%, var(--accent-soft), transparent 55%),
    radial-gradient(90% 80% at 8% 104%, rgba(34,122,255,.06), transparent 60%),
    linear-gradient(158deg,#14202D 0%, var(--bg) 44%, var(--bg-deep) 100%); }
.bg-grain{ position:absolute; inset:0; z-index:0; opacity:.42; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/><\/svg>"); }
.vignette{ position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(130% 120% at 50% 42%, transparent 56%, rgba(0,0,0,.44) 100%); }
.glow-orb{ position:absolute; border-radius:50%; filter:blur(64px); z-index:0; pointer-events:none;
  background:radial-gradient(circle, var(--glow), transparent 70%); }

/* ---------------------------------------------------------------------------
   [페이지 가구] 키커(좌상) · 브랜드(좌하) · 페이지번호(우하)
   --------------------------------------------------------------------------- */
.kicker{ position:absolute; top:48px; left:var(--mx); display:flex; align-items:center; gap:10px; z-index:6; }
.kicker .no{ font-size:var(--f-label); font-weight:700; letter-spacing:.12em; color:var(--accent); }
.kicker .bar{ width:22px; height:1px; background:var(--line); }
.kicker .nm{ font-size:var(--f-label); font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }

.foot-brand{ position:absolute; left:var(--mx); bottom:40px; display:flex; align-items:center; gap:8px; z-index:6; }
.foot-brand .mark{ width:16px; height:16px; border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.foot-brand .wm{ font-size:var(--f-foot); font-weight:700; letter-spacing:.08em; color:var(--text); }
.foot-page{ position:absolute; right:var(--mx); bottom:40px; z-index:6;
  font-size:var(--f-foot); font-weight:600; letter-spacing:.1em; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.foot-page b{ color:var(--text); font-weight:800; }

/* 각주(용어 병기) */
.footnote{ position:absolute; left:50%; transform:translateX(-50%); bottom:38px; z-index:6;
  font-size:var(--f-foot); letter-spacing:.02em; color:var(--text-dim); }
.footnote b{ color:var(--text); font-weight:700; }

/* ---------------------------------------------------------------------------
   [컴포넌트] 칩 / 카드
   --------------------------------------------------------------------------- */
.chip{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 15px;
  border-radius:999px; font-size:var(--f-small); font-weight:600; }
.chip--pill{ background:var(--accent); color:var(--accent-ink); }
.chip--ghost{ background:transparent; border:1px solid var(--line); color:var(--text-dim); }
.chip--dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); }

.card{ position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; }
.card--glow{ background:linear-gradient(180deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 1px var(--accent-line), 0 20px 46px -24px rgba(0,0,0,.75); }

/* ---------------------------------------------------------------------------
   [공용 화살표 언어 — 2026-07-21 폴리시 추가] (기존 규칙 불변, 추가만)
   촌스러운 꽉 찬 삼각촉 폐기 → 꼬리 페이드 라인 + 열린 셰브런 헤드로 통일.
   · 라인 색은 per-slide 공유 그라디언트(#arwG-h 가로 / #arwG-v 세로 / -hd 뮤트)로
     inline style="stroke:url(#…)" 지정 — 꼬리 .15 → 머리 .9 로 밝아짐.
   · 헤드는 .arw-head 셰브런(두 획, round cap/join, 라인과 동일 굵기).
   · 발광은 .arw-glow 만(절제).  · 점선 흐름은 .arw-flow(원형 도트 대시).
   --------------------------------------------------------------------------- */
.arw-line{ fill:none; stroke-width:1.8; stroke-linecap:round; }
.arw-head{ fill:none; stroke:var(--accent); stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
.arw-head--dim{ stroke:var(--text-dim); }
.arw-glow{ filter:drop-shadow(0 0 6px var(--glow)); }
/* 점선 흐름 변형(s17 컨베이어): 도트 굵기·간격의 유일 정본. 인라인 우회 금지. */
.arw-flow{ fill:none; stroke-width:3.2; stroke-linecap:round; stroke-dasharray:.1 7; }

/* 텍스트 화살표(→) 절제: 본문보다 작게·뮤트·좌우 여백 균등 */
.tarrow{ font-size:.82em; font-weight:400; color:var(--text-dim);
  margin:0 .32em; letter-spacing:0; }

/* [카드 디테일 유틸] 상단 1px 라이트 엣지 + 깊이 그림자 — 빛 받는 상단 면(§12) */
.lite-edge{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.depth{ box-shadow:0 14px 34px -18px rgba(0,0,0,.6); }
.card-lift{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),
  0 14px 34px -18px rgba(0,0,0,.6); }

/* ---------------------------------------------------------------------------
   [호버 리프트 — 카드류 공용 2026-07-22] (기존 규칙 불변, 추가만)
   마우스 오버 시 살짝 떠오르며 확대. 카드형 요소·다트판에 .hov-lift 부여.
   썸네일 줌은 .hov-zoom(컨테이너 overflow:hidden 전제).
   compositor-friendly(transform/opacity)만 사용. reduced-motion 무력화.
   --------------------------------------------------------------------------- */
.hov-lift{ transition: transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease; will-change: transform; }
.hov-lift:hover{ transform: translateY(-4px) scale(1.035); box-shadow: 0 18px 44px -18px rgba(0,0,0,.65), 0 0 0 1px var(--accent-line); }
.hov-lift:active{ transform: translateY(-1px) scale(1.01); transition-duration:.09s; }
.hov-zoom img{ transition: transform .45s cubic-bezier(.2,.7,.3,1); }
.hov-zoom:hover img{ transform: scale(1.06); }
@media (prefers-reduced-motion: reduce){ .hov-lift,.hov-zoom img{ transition:none } .hov-lift:hover,.hov-lift:active{ transform:none; box-shadow:none } .hov-zoom:hover img{ transform:none } }

<\/style>
<div class="slide">

  <div class="bg-grad"><\/div>
  <div class="glow-orb" style="width:520px;height:520px;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.4;"><\/div>

  <!-- 다트판 동심원 모티프 (중앙 대칭, 저채도·저대비로 은은히) -->
  <svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"
       style="position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;">
    <defs>
      <radialGradient id="fadeC" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="white" stop-opacity="1"/>
        <stop offset="0.5" stop-color="white" stop-opacity="0.7"/>
        <stop offset="0.82" stop-color="white" stop-opacity="0"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      <\/radialGradient>
      <mask id="maskC"><rect width="1280" height="720" fill="url(#fadeC)"/><\/mask>
      <filter id="cGlow2" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/><\/feMerge>
      <\/filter>
    <\/defs>

    <g mask="url(#maskC)"><g transform="translate(640 360)">
      <!-- 동심원 링 -->
      <g fill="none" stroke="var(--text-dim)" stroke-opacity=".14">
        <circle r="330" stroke-width="1"/>
        <circle r="262" stroke-width="1"/>
        <circle r="194" stroke-width="1"/>
        <circle r="128" stroke-width="1.2"/>
      <\/g>
      <!-- 섹터 분할선 -->
      <g stroke="var(--text-dim)" stroke-opacity=".09" stroke-width="1">
        <line x1="0" y1="-330" x2="0" y2="330"/>
        <line x1="-330" y1="0" x2="330" y2="0"/>

var TOTAL = SLIDES.length;
var deck = document.getElementById('deck');
var frames = [], loaded = [];
for (var i = 0; i < TOTAL; i++) {
  var f = document.createElement('iframe');
  f.className = 'fr'; f.setAttribute('scrolling', 'no'); f.setAttribute('title', 'slide ' + (i + 1));
  deck.appendChild(f); frames.push(f); loaded.push(false);
}
var cur = -1;

function loadInto(i, force) {           // 결정론적 (재)로드 — 도착 시 s18 타이핑·s04 3D 재생
  if (i < 0 || i >= TOTAL) return;
  if (loaded[i] && !force) return;
  var s = SLIDES[i], f = frames[i];
  loaded[i] = true;
  if (s.t === 'src') {
    f.removeAttribute('srcdoc'); f.src = 'about:blank';
    (function (fr, src) { requestAnimationFrame(function () { fr.src = src; }); })(f, s.c);
  } else {
    f.removeAttribute('src'); f.srcdoc = '';
    (function (fr, html) { requestAnimationFrame(function () { fr.srcdoc = html; }); })(f, s.c);
  }
}

function show(i) {
  i = Math.max(0, Math.min(TOTAL - 1, i));
  if (i === cur) return;
  cur = i;
  loadInto(i, true);            // 활성 = 재로드(연출 시작점 보장)
  loadInto(i - 1, false);       // 이웃 선로드(성능)
  loadInto(i + 1, false);
  for (var k = 0; k < TOTAL; k++) frames[k].classList.toggle('active', k === i);
  document.getElementById('cur').textContent = (i + 1);
}
function next() { show(cur + 1); }
function prev() { show(cur - 1); }

function fit() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  deck.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

document.addEventListener('keydown', function (e) {
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': case 'Spacebar': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End': e.preventDefault(); show(TOTAL - 1); break;
    case 'f': case 'F': e.preventDefault(); toggleFs(); break;
  }
});
document.getElementById('zoneL').addEventListener('click', prev);
document.getElementById('zoneR').addEventListener('click', next);
function toggleFs() {
  if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
  else { if (document.exitFullscreen) document.exitFullscreen(); }
}
var tsx = 0, tsy = 0;
document.addEventListener('touchstart', function (e) { tsx = e.changedTouches[0].clientX; tsy = e.changedTouches[0].clientY; }, { passive: true });
document.addEventListener('touchend', function (e) {
  var dx = e.changedTouches[0].clientX - tsx, dy = e.changedTouches[0].clientY - tsy;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { if (dx < 0) next(); else prev(); }
}, { passive: true });

// 조작 힌트 4초 후 페이드
setTimeout(function () { var h = document.getElementById('hint'); if (h) h.style.opacity = '0'; }, 4000);

show(0);
