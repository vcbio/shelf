{t:"doc",c:`<!DOCTYPE html>
<html lang="ko" class="fit anim">
<head>
<meta charset="utf-8">
<title>방금 넣은 여덟 줄, 들어갔는지 봅니다 · 세미콜로니 AI 입문 합본<\/title>
<style>
/* 세미콜로니 AI 입문 합본 덱 — build.py가 생성. 직접 수정 금지.
   스타일 본문은 1회차 덱(세미콜로니-1회차/_build/build.py)의 CSS를 그대로 옮겼다.
   색·폰트 토큰과 컴포넌트 규칙은 한 줄도 바꾸지 않는다 — 아래 주석의 장 번호는
   0회차·1회차 기준으로 붙은 것이라 합본 장 번호와 어긋날 수 있다(값은 원문 그대로). */

:root{
  font-size:10px;

  --c-bg:#FBFAF7;
  --c-shell:#EFEBE3;
  --c-surface:#FFFFFF;
  --c-ink:#1A1A18;
  --c-ink-2:#5C5A54;
  --c-ink-3:#93908A;
  --c-line:#E4E0D8;
  --c-line-2:#CFC9BC;
  --c-brand:#E2622A;
  --c-brand-tint:#FDEDE4;
  --c-support:#1F6F5C;
  --c-support-tint:#E6F1ED;

  --c-track-a:var(--c-brand);
  --c-track-b:var(--c-support);

  --font:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
         'Apple SD Gothic Neo', system-ui, 'Noto Sans KR', sans-serif;
  --shadow:0 .2rem .8rem rgba(0,0,0,.05);
}

html.fit{ font-size:min(0.625vw, 1.111vh); }

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:var(--font);
  color:var(--c-ink);
  background:var(--c-shell);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  word-break:keep-all; overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}

/* ── 슬라이드 캔버스 ─────────────────────────────── */
.slide{
  position:relative;
  width:160rem; height:90rem;
  background:var(--c-bg);
  padding:6.4rem 8rem 5.6rem;
  display:flex; flex-direction:column;
  overflow:hidden;
}

.hd{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4rem; }
.chip{
  font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em;
  color:var(--c-brand); background:var(--c-brand-tint);
  padding:1rem 2rem; border-radius:99rem;
}
.prog{ font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em; color:var(--c-ink-3); }

h1{ font-size:6.4rem; line-height:1.2; font-weight:700; letter-spacing:-.01em; }
.lead{ font-size:3.6rem; line-height:1.45; font-weight:500; color:var(--c-ink-2); margin-top:2.4rem; }
.lead.nm{ margin-top:0; }
.punch{ font-size:3.6rem; line-height:1.45; font-weight:700; }
.cap{ font-size:2rem; line-height:1.5; color:var(--c-ink-2); }
/* .tm — 상표 귀속 줄(s05). 읽히되 내용을 밀어내지 않는 크기 */
.cap.tm{ font-size:1.8rem; color:var(--c-ink-3); }
.sm{ font-size:2.8rem; line-height:1.6; color:var(--c-ink-2); margin-top:1.6rem; }

.body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:4rem; margin-top:4rem; }
.body.dense{ gap:2.4rem; margin-top:2.4rem; }

/* ── 표지 ───────────────────────────────────────── */
/* 좌: 제목 블록 / 우: 일러스트. 오른쪽 여백이 비어 있던 것을 채운다(2026-07-27). */
.cover{ flex:1; display:flex; align-items:center; gap:6.4rem; }
.cover .covertxt{ flex:1; min-width:0; }
.cover h1{ font-size:9.6rem; line-height:1.15; font-weight:800; }
.cover .sub{ font-size:3.6rem; line-height:1.45; font-weight:500; color:var(--c-ink-2); margin-top:4rem; }
.cover .trio{ width:60rem; flex:none; }
.trio-svg{ display:block; width:100%; height:auto; }
.cover .foot{
  position:absolute; left:8rem; bottom:5.6rem;
  font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em; color:var(--c-ink-3);
}
/* 표지 상표 귀속 줄 — 표지가 첫 화면이자 공유되는 장이라 작게 넣는다.
   .foot 과 같은 밑선에 맞추고, 크기는 읽히되 제목을 방해하지 않는 1.8rem. */
.cover .tmfoot{
  position:absolute; right:8rem; bottom:5.6rem;
  font-size:1.8rem; line-height:1; color:var(--c-ink-3);
}

/* ── 카드 ───────────────────────────────────────── */
.cards{ display:grid; gap:3.2rem; }
.cards.c3{ grid-template-columns:repeat(3,1fr); }
.cards.c2{ grid-template-columns:repeat(2,1fr); gap:4.8rem; }
.cards.tight{ gap:2.4rem; }
.card{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:4rem; box-shadow:var(--shadow);
}
.cards.tight .card{ padding:2.8rem 3.2rem; }
.card h3{ font-size:3.2rem; line-height:1.3; font-weight:700; margin-bottom:2.4rem; }
.card p{ font-size:2.8rem; line-height:1.6; }
.card .ic{ color:var(--c-brand); display:block; margin-bottom:2.4rem; }
.card.hi{ border-color:var(--c-brand); background:var(--c-brand-tint); }
.card.mute{ background:var(--c-surface); }
.card.mute h3, .card.mute p{ color:var(--c-ink-2); }
.card.mute .ic{ color:var(--c-ink-3); }
.card .num{
  display:inline-block; font-size:4rem; font-weight:800; line-height:1;
  color:var(--c-brand); margin-bottom:2.4rem;
}
.card .eyebrow{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-ink-3); margin-bottom:1.2rem; }
/* 카드 머리줄 (s10) — 아이콘과 출처 회사 라벨을 한 줄에 놓아 높이를 아낀다 */
.card .cardhd{ display:flex; align-items:center; gap:1.6rem; margin-bottom:2rem; }
.card .cardhd .ic{ margin-bottom:0; }
.card .cardhd .eyebrow{ margin-bottom:0; }
.cards.tight .card h3{ margin-bottom:2rem; }
.card .tag{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-brand); margin-top:2.4rem; }

/* ── 회사 로고 자리 (s05) ────────────────────────────
   로고 SVG 자체는 slides.py 의 LOGO 가 각 사 공식 자산 원본을 그대로 물고 있다.
   여기서는 '크기와 여백'만 다룬다 — 색·형태를 건드리는 규칙은 두지 않는다
   (재색·왜곡 금지가 세 회사 가이드라인 공통). filter·opacity 도 걸지 않는다.
   여백(clear space): OpenAI 규정이 마크 폭의 0.543배로 가장 빡빡하다.
   마크 3.2rem 기준 필요 여백 1.74rem → 위(카드 padding 4rem)·아래(2.4rem)·
   왼쪽(카드 padding 4rem)·오른쪽(카드 잔여폭)이 모두 이를 넘는다.
   최소 크기 규정은 세 회사 모두 공개 문서에서 확인하지 못했다 — 3.2rem은
   1600px 폭 슬라이드에서 32px 실그림이라 인쇄·투사 모두 여유가 있다. */
/* 줄 높이는 가장 큰 로고(3.6rem)에 맞춘다 — 로고가 제 칸을 넘지 않게 해서
   넘침 검사에 걸리지 않도록 한다. */
.card .logo{ display:flex; align-items:center; height:3.6rem; margin-bottom:2.4rem; }
.card .logo .lg{ display:block; height:3.2rem; width:auto; }
/* 시각 무게 맞춤 — 획이 가느다란 심벌은 같은 높이에서 더 작아 보여 높이만 키운다.
   비율은 그대로다(width:auto — 늘리거나 찌그러뜨리지 않는다).
   ⚠️ 1회차 덱에는 회사 로고를 쓰는 장이 없다. 0회차에서 온 규칙을 남겨만 둔다
   (제품 이름이 든 실측 주석은 1회차 제작 제약에 맞춰 걷어냈다). */
.card .logo .lg-cl{ height:3.6rem; }
/* 2026-08-03 1회차: 세 번째 회사 로고용 규칙(.lg-gm)은 삭제했다.
   1회차는 두 트랙만 다루고 그 회사를 언급하지 않으므로(제작 제약 5),
   CSS 주석에 회사 이름이 남으면 금지어 검사(A)에 걸린다. */

/* ── 3층 스택 ───────────────────────────────────── */
.stack{ display:flex; flex-direction:column; gap:2.4rem; }
.layer{
  display:flex; align-items:center; gap:3.2rem;
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:3.2rem 4rem; box-shadow:var(--shadow);
}
.layer .n{ font-size:4rem; font-weight:800; line-height:1; color:var(--c-brand); width:5rem; flex:none; }
.layer .ic{ color:var(--c-brand); flex:none; }
.layer h3{ font-size:3.2rem; line-height:1.3; font-weight:700; width:28rem; flex:none; }
.layer p{ font-size:2.8rem; line-height:1.6; }

/* ── 표 ─────────────────────────────────────────── */
.tbl{
  width:100%; border-collapse:separate; border-spacing:0;
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; overflow:hidden; box-shadow:var(--shadow);
}
.tbl th, .tbl td{
  font-size:3rem; line-height:1.4; font-weight:400;
  padding:3.2rem 2.4rem; text-align:center;
  border-bottom:.1rem solid var(--c-line);
}
.tbl tr:last-child th, .tbl tr:last-child td{ border-bottom:none; }
.tbl th{ font-weight:700; color:var(--c-ink-2); }
.tbl .rowh{ font-weight:700; text-align:left; padding-left:4rem; }
.tbl .hi{ background:var(--c-brand-tint); color:var(--c-brand); font-weight:700; }

/* ── 시연 프레임 — 구 s07(3사 시연) 삭제로 현재 미사용. 클래스만 남겨둔다 */
.ask{
  display:flex; align-items:center; gap:3.2rem;
  background:var(--c-brand-tint); border-radius:2rem; padding:3.2rem 4rem;
}
.ask .ic{ color:var(--c-brand); flex:none; }
.ask p{ font-size:3.2rem; line-height:1.3; font-weight:700; }
.frame{
  height:22rem; border:.2rem dashed var(--c-line-2); border-radius:2rem;
  background:var(--c-surface); display:flex; align-items:flex-start; justify-content:center;
  padding:2.4rem;
}
.frame span{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-ink-3); }

/* ── 인용 ───────────────────────────────────────── */
.quotes{ display:grid; grid-template-columns:1fr 1fr; gap:4.8rem; }
.quote{ border-left:.4rem solid var(--c-brand); padding-left:2.4rem; }
.quote.b{ border-left-color:var(--c-support); }
.quote p{ font-size:2.8rem; line-height:1.6; }
.quote .src{ font-size:2rem; color:var(--c-ink-3); margin-top:1.2rem; }

/* ── 설치 스텝 (s11) ────────────────────────────── */
.steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:3.2rem; }
.step{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:3.2rem; box-shadow:var(--shadow);
}
.step .n{ display:block; font-size:4rem; font-weight:800; line-height:1; color:var(--c-brand); }
.step .ic{ color:var(--c-ink-2); display:block; margin:2.4rem 0; }
.step p{ font-size:2.8rem; line-height:1.6; font-weight:700; }
.step .tag{ font-size:2.2rem; font-weight:700; color:var(--c-ink-3); margin-top:1.2rem; letter-spacing:.02em; }
/* ── 절차 세로 목록 (1회차 s04 · s06) ─────────────────
   0회차 s11 이 이미 '4칸 가로 스텝 상자 + 아이콘'으로 설치 절차를 보여줬다.
   같은 그릇을 다시 쓰면 최대 병목 파트가 지난주 그림의 재방송이 되므로,
   상자를 없앤 밑줄 목록으로 두고 핵심 한 걸음(.key)만 띠로 띄운다.
   구분선은 쓰지 않는다 — 강조 띠(.key)가 가운데 들어가면 선이 한 경계에만 남아 이물이 된다
   (2026-08-06 실측: 경계 4곳 중 1곳만 1px). 좌우 안쪽 여백은 모든 행이 같은 값이라
   번호열·본문열·우측 주석열이 한 세로선에 선다(강조 행만 밀리던 문제 해소).
   [2026-08-06 주석 수리 2차] 위 문단에 주석 종결 기호(별표+슬래시)가 리터럴로
   들어가 있어 주석이 조기 종결되고 .plan 규칙이 버려지는 사고가 두 번 났다.
   이 주석 블록 안에서는 그 두 글자를 절대 붙여 쓰지 말 것. 값은 원문 그대로다. */
.plan{ display:flex; flex-direction:column; }
/* .slim — 장을 합쳐 목록 밑에 블록이 더 붙는 곳(s04 · s06)에서 행 높이만 줄인다.
   활자 크기·색·좌우 여백은 그대로다. 강조 행(.key)은 제외한다 — :not(.key) 로 빼지 않으면
   이 규칙이 더 구체적이라 .pstep.key 의 넉넉한 padding 을 덮어써 강조 띠가 납작해진다. */
.plan.slim .pstep:not(.key){ padding:1.2rem 2.4rem; }
.pstep{ display:flex; align-items:baseline; gap:2.8rem; padding:2.4rem; }
.pstep .n{ font-size:3.2rem; font-weight:800; line-height:1.2; color:var(--c-ink-3); width:4.4rem; flex:none; }
.pstep .t{ font-size:3.2rem; font-weight:700; line-height:1.3; }
.pstep .sub{ font-size:2.4rem; font-weight:500; line-height:1.4; color:var(--c-ink-3); margin-left:auto; padding-left:2.4rem; text-align:right; }
.pstep.key{ background:var(--c-brand-tint); border-radius:1.6rem; padding:3.2rem 2.4rem; margin:.8rem 0; }
.pstep.key .n{ color:var(--c-brand); }
.pstep.key .t{ font-size:4rem; color:var(--c-brand); }
.pstep.key .sub{ color:var(--c-brand); font-weight:700; }

/* ── 확인 한 줄 (현행 미사용 — 10장 재편으로 s08이 구14+15 합본이 됨) ─────────────────────
   0회차 s12(초록 체크 리스트)와도, 0회차 s20·현행 s09(.task 틴트 띠)과도
   겹치지 않는 제3의 형태. 확인할 것이 하나뿐인 장이라 굵은 세로선 + 큰 문장 한 줄로 둔다. */
.oneline{ border-left:.6rem solid var(--c-support); padding:1.6rem 0 1.6rem 3.2rem; }
.oneline p{ font-size:4.8rem; line-height:1.3; font-weight:800; }

/* ── 지침 경로 행 (현행 s02) ───────────────────
   0회차 s13 이 같은 경로를 '카드 2장 + 색 pill'로 보여줬다. 같은 그릇을 쓰면
   장면이 복제되므로, 색 덩어리 없이 밑줄 두 줄짜리 납작한 행으로만 적는다. */
.paths{ display:flex; flex-direction:column; }
.prow{ display:flex; align-items:baseline; gap:3.2rem; padding:3.2rem .4rem; border-bottom:.1rem solid var(--c-line); }
.prow:first-child{ border-top:.1rem solid var(--c-line); }
.prow .who{ font-size:2.8rem; font-weight:700; letter-spacing:.02em; color:var(--c-ink-3); width:20rem; flex:none; }
.prow .where{ font-size:3.6rem; font-weight:700; line-height:1.3; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:4.8rem; align-items:center; }
.warn{ font-size:2.8rem; line-height:1.6; font-weight:700; color:var(--c-brand); }

/* ── 1차 → 한 줄 → 2차 흐름 (현행 s07) ─────────
   좌우는 결과 카드, 가운데는 '사람이 보탠 한 줄'이라 형태를 다르게 둔다 —
   카드가 아니라 좁은 세로 띠 + 지지색(딥그린)이라 3단 나열로 안 읽힌다.
   기존 규칙 값은 건드리지 않고 블록을 새로 더하기만 했다. */
.flow{ display:grid; grid-template-columns:1fr 5.6rem .84fr 5.6rem 1fr; gap:2rem; align-items:stretch; }
.flow .arw{ display:flex; align-items:center; justify-content:center; color:var(--c-line-2); }
/* 1차 칸만 확실히 내린다 — .card.mute 는 흰 바탕이라 본문 바탕과 거의 같아 신호가 안 산다.
   기존 .card.mute 규칙은 그대로 두고 .flow 안에서만 한 단계 더 눌러 좌→우 낙차를 만든다. */
.flow .card.mute{ background:var(--c-shell); border-color:var(--c-line-2); box-shadow:none; }
.saybar{
  align-self:center;
  /* 테두리는 .3rem 미만이면 크로뮴이 정수 px 로 내려 1px 로 렌더된다(실측) → .4rem */
  background:var(--c-support-tint); border:.4rem solid var(--c-support);
  border-radius:1.6rem; padding:2.8rem 2.4rem;
}
.saybar .eyebrow{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-support); margin-bottom:1.2rem; }
.saybar p{ font-size:2.8rem; line-height:1.5; font-weight:700; color:var(--c-support); }

/* ── 캡처 플레이스홀더 ──────────────────────────── */
.capture{
  border:.2rem dashed var(--c-line-2); background:var(--c-surface);
  border-radius:1.6rem; height:12rem;
  display:flex; align-items:center; justify-content:center;
}
.capture span{ font-size:2rem; color:var(--c-ink-3); }

/* ── 체크 (현행 s08) ─────────────────────────────────── */
.checks{ display:flex; flex-direction:column; gap:2.4rem; }
.chk{ display:flex; align-items:center; gap:2.4rem; font-size:3.2rem; line-height:1.3; font-weight:700; }
.chk .ic{ color:var(--c-support); flex:none; }
.big-ok{ display:flex; align-items:center; justify-content:center; }
.big-ok .ic.big{ color:var(--c-support); opacity:.35; }

/* ── 지침 경로 pill — 현행 10장 체제 미사용(0회차 유래, 규칙만 보존) ─────────────────── */
.pill{
  display:inline-block; font-size:2.8rem; line-height:1.4; font-weight:700;
  background:var(--c-brand-tint); color:var(--c-brand);
  padding:1.2rem 2.4rem; border-radius:1.2rem;
}
.pill.b{ background:var(--c-support-tint); color:var(--c-support); }
/* .hi 카드(이미 brand-tint 바탕) 안에서는 pill 을 흰 바탕으로 — 대비 확보 */
.pill.w{ background:var(--c-surface); color:var(--c-brand); }
/* s14 — pill 두 개를 세로로 쌓는다(파일 이름도 본문 폰트 + pill 로만 표기) */
.pills{ display:flex; flex-direction:column; align-items:flex-start; gap:1.2rem; margin-top:2.4rem; }

/* ── 빈칸 템플릿 (s15) ──────────────────────────── */
.tmpl{ display:grid; grid-template-columns:1fr 1fr; gap:3.2rem; align-items:start; }
.tbox{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:2.8rem 3.2rem; box-shadow:var(--shadow);
}
.tbox.span2{ grid-column:2; grid-row:1 / span 2; }
.tbox h4{ font-size:2.8rem; font-weight:700; color:var(--c-brand); margin-bottom:1.6rem; }
.tbox p{ font-size:2.8rem; line-height:1.9; }
.tbox ul{ list-style:none; }
.tbox li{ font-size:2.8rem; line-height:1.7; padding-left:2.4rem; position:relative; }
/* 불릿은 폭이 좁은 가운뎃점으로 — em-dash는 본문에 붙어 보인다 */
.tbox li::before{ content:'\\2022'; position:absolute; left:.4rem; color:var(--c-ink-3); }
.blank{
  display:inline-block; width:16rem; height:2.8rem;
  border-bottom:.2rem solid var(--c-line-2); vertical-align:-.4rem;
}

/* ── QR 패널 (s15) ──────────────────────────────────
   세로 여유가 없어 QR을 아래로 못 쌓는다 → 템플릿을 3단으로 넓혀 오른쪽에 세운다.
   .tbox.span2 의 grid-row:1/span 2 를 그대로 두어야 3번 칸이 1행 높이를 밀지 않는다. */
.tmpl.wq{ grid-template-columns:1fr 1fr 30rem; }
/* 3번 칸과 QR 패널은 두 행을 채워 아랫변을 왼쪽 두 칸과 맞춘다(.tmpl 은 align-items:start) */
.tmpl.wq > .tbox.span2, .tmpl.wq > .qr{ align-self:stretch; }
.qr{
  grid-column:3; grid-row:1 / span 2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2.4rem; background:var(--c-brand-tint); border-radius:2rem; padding:2.4rem 2rem;
}
/* 흰 바탕 + 여백 — 프로젝터에서 주변 색이 QR의 여백(quiet zone)을 먹지 않게 한다 */
.qrimg{
  display:block; width:26rem; height:26rem;
  background:var(--c-surface); border-radius:1.2rem; padding:1.2rem;
}
.qr p{ font-size:2.4rem; line-height:1.4; font-weight:700; color:var(--c-brand); text-align:center; }

/* ── 지침 8줄 (s16 · 2026-07-28 신설) ───────────────
   붙여넣을 문안이라 한 글자도 줄일 수 없다 → 2단으로 나눠 한 장에 담는다.
   긴 1번과 6번만 두 단 폭(.rule.wide)으로 눕히고 나머지는 좌우로 짝짓는다.
   코드 블록 모티프는 금지라 본문 글꼴 그대로 쓰고,
   '한 덩어리'라는 건 머리말(.blockhd)과 번호 배지로만 알린다. */
.blockhd{ font-size:2.4rem; font-weight:700; letter-spacing:.02em; color:var(--c-brand); }
.rules{ display:grid; grid-template-columns:1fr 1fr; gap:1.2rem 4rem; align-content:start; }
/* 1번(끄는 목록)과 6번(3줄 요약)은 세 줄짜리라 두 단을 가로질러 눕힌다 */
.rule.wide{ grid-column:1 / -1; }
.rule{ display:flex; align-items:flex-start; gap:1.6rem; }
/* '이럴 땐 계획 없이 그냥 해라' — 과발동을 끄는 줄이라 색으로 갈라 보인다 */
.rule .off{ display:block; color:var(--c-support); font-weight:700; }
.rule .n{
  flex:none; width:3.6rem; height:3.6rem; border-radius:99rem;
  background:var(--c-brand-tint); color:var(--c-brand);
  font-size:2.2rem; font-weight:800; line-height:3.6rem; text-align:center;
}
.rule p{ font-size:2.2rem; line-height:1.5; }

/* ── 해설표 (s17 · s18 · 2026-07-28 신설) ───────────
   설명을 줄이지 않고(대표 지시) 4행씩 두 장으로 나눠 담는다.
   .tbl 기본값(3rem / 3.2rem 패딩·가운데 정렬)보다 촘촘하고 왼쪽 정렬이다. */
.tbl.gl th, .tbl.gl td{ font-size:2.4rem; line-height:1.5; padding:2rem 2.4rem; text-align:left; }
.tbl.gl th:first-child, .tbl.gl td:first-child{ width:34rem; padding-left:3.2rem; }
.tbl.gl .rowh{ padding-left:3.2rem; color:var(--c-ink); vertical-align:top; }
.tbl.gl b{ font-weight:700; color:var(--c-brand); }
/* 제목 뒤 회차 표시(1~4 / 5~8) — 제목과 같은 줄, 무게만 뺀다 */
.hnum{ font-weight:400; color:var(--c-ink-3); }

/* ── 말풍선 (s18) ───────────────────────────────── */
.talk{ display:flex; flex-direction:column; gap:2.4rem; }
.bubble{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:2.8rem 4rem; box-shadow:var(--shadow); max-width:110rem;
}
.bubble.me{ background:var(--c-brand-tint); border-color:var(--c-brand-tint); align-self:flex-start; }
.bubble:not(.me){ align-self:flex-end; }
.bubble p{ font-size:3.2rem; line-height:1.4; font-weight:700; }

/* ── 과제 (현행 s09) ───────────────────────────────
   ⚠️ 이 CSS 블록들의 괄호 안 장 번호는 0회차에서 붙은 것이라
   1회차 장 번호와 어긋난다. 이 줄만 1회차 기준으로 고쳐 둔다. */
.task{
  display:flex; align-items:center; gap:4rem;
  background:var(--c-brand-tint); border-radius:2rem; padding:4.8rem 5.6rem;
}
.task .ic{ color:var(--c-brand); flex:none; }
.task p{ font-size:4rem; line-height:1.4; font-weight:700; }
/* .slim — 회고와 같은 장에 얹히는 s09 용. 띠 높이만 낮추고 활자는 그대로 둔다. */
.task.slim{ padding:3.2rem 5.6rem; }

/* ══ 진입 모션 ═══════════════════════════════════
   발표용 덱이라 힘은 '장이 뜰 때'에만 싣는다(호버는 부차).
   - html.anim 이 붙은 sNN.html 에서만 재생. index.html(썸네일)은 정지.
   - prefers-reduced-motion: reduce 에서는 규칙 자체가 적용되지 않는다.
   - fill-mode: backwards — 종료 후 원래 스타일로 복귀(= 정상 레이아웃). both 를 쓰면 종료 후에도 transform 이 채워져 :hover 가 죽는다(2026-07-27 실측).
   - 단계: 헤더 0s → 제목 .06s → 리드 .14s → 본문 블록 .24s부터, 항목 간 .06s.
     가장 늦은 시작이 .70s라 진입은 1.15s 안에 끝난다. */

@keyframes rise{
  from{ opacity:0; transform:translateY(1.6rem); }
  to{ opacity:1; transform:none; }
}
@keyframes pop{
  from{ opacity:0; transform:scale(.72); }
  to{ opacity:1; transform:none; }
}
@keyframes tint{
  from{ background:var(--c-surface); color:var(--c-ink); }
  to{ background:var(--c-brand-tint); color:var(--c-brand); }
}
@keyframes sweep{
  from{ transform:scaleX(0); }
  to{ transform:scaleX(1); }
}

/* 호버 — 마우스가 있는 기기에서만. reduced-motion 과 무관하게 유효하다
   (진입 애니는 fill-mode:backwards 라 종료 후 transform 을 비워두므로 여기서 덮이지 않는다). */
@media (hover:hover) and (pointer:fine){
  .card, .step, .layer, .tbox{ transition:transform .2s cubic-bezier(.22,.85,.3,1); }
  .card:hover, .step:hover, .layer:hover, .tbox:hover{ transform:translateY(-.3rem); }
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion: reduce){
  .card, .step, .layer, .tbox{ transition:none; }
}

@media (prefers-reduced-motion: no-preference){
  /* --db = 블록(본문 단) 지연, --ds = 블록 안 항목 stagger */
  .anim .slide{ --db:.24s; --ds:0s; }

  .anim .slide > .hd,
  .anim .slide > h1,
  .anim .slide > .lead,
  .anim .cover h1,
  .anim .cover .sub,
  .anim .cover .foot,
  .anim .cover .tmfoot,
  .anim .body > p,
  .anim .body > .ask,
  .anim .body > .task,
  .anim .body > .oneline,
  .anim .body > .capture,
  .anim .cards > .card,
  .anim .cards > .frame,
  .anim .flow > *,
  .anim .stack > .layer,
  .anim .steps > .step,
  .anim .plan > .pstep,
  .anim .paths > .prow,
  .anim .quotes > .quote,
  .anim .tmpl > .tbox,
  .anim .tmpl > .qr,
  .anim .rules > .rule,
  .anim .talk > .bubble,
  .anim .checks > .chk,
  .anim .row > .big-ok,
  .anim .tbl tr{
    animation:rise .44s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + var(--ds));
  }

  /* 고정 단계 — 헤더 · 제목 · 리드 · 표지 */
  .anim .slide > .hd{ animation-delay:0s; }
  .anim .slide > h1{ animation-delay:.06s; }
  .anim .slide > .lead{ animation-delay:.14s; }
  .anim .cover h1{ animation-delay:.06s; }
  .anim .cover .sub{ animation-delay:.20s; }
  .anim .cover .foot{ animation-delay:.38s; }
  .anim .cover .tmfoot{ animation-delay:.70s; }

  /* 표지 일러스트 — 제목·부제 다음에 셋이 차례로 등장한다(.32s → .48s).
     SVG <g>의 scale 은 fill-box 기준이 아니면 원점이 뷰박스 좌상단이라 튄다. */
  .anim .trio-svg .m{
    transform-box:fill-box; transform-origin:50% 100%;
    animation:pop .5s cubic-bezier(.34,1.4,.64,1) backwards;
  }
  .anim .trio-svg .m1{ animation-delay:.32s; }
  .anim .trio-svg .m2{ animation-delay:.40s; }
  .anim .trio-svg .m3{ animation-delay:.48s; }
  .anim .trio-svg .m0{ animation-name:rise; animation-delay:.60s; }

  /* s05 로고 — 카드가 올라온 뒤(.18s) 제자리에서 살짝 커지며 든다.
     카드의 --db/--ds 를 그대로 물려받아 좌→우 순서가 카드와 어긋나지 않는다.
     로고는 HTML 요소라 transform-origin 기본값(50% 50%)이 그대로 맞는다. */
  .anim .cards > .card .logo .lg{
    animation:pop .42s cubic-bezier(.34,1.4,.64,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .18s);
  }

  /* 본문 단(段) 순서 */
  .anim .body > *:nth-child(1){ --db:.24s; }
  .anim .body > *:nth-child(2){ --db:.52s; }
  .anim .body > *:nth-child(3){ --db:.66s; }
  .anim .body > *:nth-child(4){ --db:.78s; }

  /* 블록 안 항목 stagger */
  .anim .cards > *, .anim .stack > *, .anim .steps > *, .anim .quotes > *,
  .anim .tmpl > *, .anim .talk > *, .anim .checks > *, .anim .tbl tr,
  .anim .rules > *{ --ds:0s; }
  .anim .cards > *:nth-child(2), .anim .stack > *:nth-child(2),
  .anim .steps > *:nth-child(2), .anim .quotes > *:nth-child(2),
  .anim .tmpl > *:nth-child(2), .anim .talk > *:nth-child(2),
  .anim .checks > *:nth-child(2), .anim .tbl tr:nth-child(2),
  .anim .rules > *:nth-child(2){ --ds:.06s; }
  .anim .cards > *:nth-child(3), .anim .stack > *:nth-child(3),
  .anim .steps > *:nth-child(3), .anim .tmpl > *:nth-child(3),
  .anim .checks > *:nth-child(3), .anim .tbl tr:nth-child(3),
  .anim .rules > *:nth-child(3){ --ds:.12s; }
  .anim .cards > *:nth-child(4), .anim .steps > *:nth-child(4),
  .anim .tmpl > *:nth-child(4), .anim .rules > *:nth-child(4){ --ds:.18s; }
  /* 지침 8줄(s16)만 항목이 5개를 넘는다 → 5~8번까지 이어서 정의한다.
     없으면 --ds 가 0으로 떨어져 5~8번이 2~4번보다 먼저 뜬다(2026-07-28 실측). */
  .anim .rules > *:nth-child(5){ --ds:.24s; }
  .anim .rules > *:nth-child(6){ --ds:.30s; }
  .anim .rules > *:nth-child(7){ --ds:.36s; }
  .anim .rules > *:nth-child(8){ --ds:.42s; }

  /* .flow(현행 s07) — 좌 → 화살표 → 가운데 → 화살표 → 우 순서로 흐르게 한다.
     기존 stagger 목록에 얹지 않고 따로 적어, 다른 블록의 --ds 값을 건드리지 않는다. */
  .anim .flow > *{ --ds:0s; }
  .anim .flow > *:nth-child(2){ --ds:.06s; }
  .anim .flow > *:nth-child(3){ --ds:.12s; }
  .anim .flow > *:nth-child(4){ --ds:.18s; }
  .anim .flow > *:nth-child(5){ --ds:.24s; }

  /* .plan(s04·s06) · .paths(s02) — 위에서 아래로 한 줄씩 */
  .anim .plan > *, .anim .paths > *{ --ds:0s; }
  .anim .plan > *:nth-child(2), .anim .paths > *:nth-child(2){ --ds:.06s; }
  .anim .plan > *:nth-child(3){ --ds:.12s; }
  .anim .plan > *:nth-child(4){ --ds:.18s; }

  /* 강조 1개만 특별대우 — 대비 카드의 '되는 쪽'은 살짝 늦게 */
  .anim .cards > .card.hi{ --ds:.16s; }
  /* .seq — 강조 카드가 '왼쪽'인 장(현행 s08)에서는 위 특별대우를 끄고 좌→우 순서를 지킨다 */
  .anim .cards.seq > .card.hi{ --ds:0s; }

  /* s06 표 — 행이 다 들어온 뒤 가운데 칸이 점등 */
  .anim .tbl .hi{
    animation:tint .4s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + .38s);
  }

  /* 현행 s08 체크 — 체크 표시가 하나씩 켜지고, 큰 체크가 마지막에 */
  .anim .chk > .ic{
    animation:pop .4s cubic-bezier(.34,1.4,.64,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .10s);
  }
  .anim .row > .big-ok{ --ds:.24s; animation-name:pop; }

  /* s15 빈칸 — 밑줄이 왼쪽에서 그어진다 */
  .anim .blank{
    transform-origin:0 50%;
    animation:sweep .5s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .18s);
  }

  /* 부차 — 호버(발표 중엔 거의 안 쓰이지만 열람 시 반응) */
  .anim .card, .anim .step, .anim .layer, .anim .tbox{ transition:transform .18s ease-out; }
  /* 호버는 아래 블록(무모션 환경에서도 유효)으로 분리 — 발표 중엔 안 쓰지만 검토 시 유효 */
}

/* 인쇄·PDF는 최종 상태로 고정 */
@media print{
  .anim *{ animation:none !important; transition:none !important; }
}

/* ── 전체 미리보기 (index.html) ─────────────────── */
body.preview{ display:block; padding:6.4rem; background:var(--c-shell); }
.preview .ph{ font-size:4rem; font-weight:800; margin-bottom:1.2rem; }
.preview .psub{ font-size:2rem; color:var(--c-ink-2); margin-bottom:4rem; }
/* 썸네일 1열 = 32rem(320px) 고정, gap 4rem — 화면 폭에 맞춰 열 수를 자동으로 줄인다
   (auto-fill). 1600px 이상이면 4열, 좁아지면 3→2→1열로 줄어 가로 스크롤 없이 표시된다.
   썸네일 크기 자체(32rem×18rem)는 고정 — 안쪽 .slide{transform:scale(.2)}가 어긋나므로 바꾸지 말 것. */
.preview .grid{ display:grid; grid-template-columns:repeat(auto-fill,32rem); gap:4rem; justify-content:center; }
.thumb{ display:block; text-decoration:none; color:inherit; }
.thumb .shot{
  width:32rem; height:18rem; overflow:hidden;
  border:.1rem solid var(--c-line-2); border-radius:1.2rem; background:var(--c-bg);
}
.thumb .shot .slide{ transform:scale(.2); transform-origin:0 0; }
.thumb .lbl{ font-size:1.8rem; font-weight:700; color:var(--c-ink-2); margin-top:1.2rem; }
/* 좁은 화면(모바일)에서는 좌우 여백(6.4rem=64px)만으로도 32rem(320px) 썸네일 1열이
   안 들어가는 폭이 있어(≤448px) 본문 여백을 줄인다. 썸네일 크기 자체는 그대로 둔다. */
@media (max-width:500px){
  body.preview{ padding:2rem; }
}

{t:"doc",c:`<!DOCTYPE html>
<html lang="ko" class="fit anim">
<head>
<meta charset="utf-8">
<title>안 주면 일반론, 주면 내 얘기 · 세미콜로니 AI 입문 합본<\/title>
<style>
/* 세미콜로니 AI 입문 합본 덱 — build.py가 생성. 직접 수정 금지.
   스타일 본문은 1회차 덱(세미콜로니-1회차/_build/build.py)의 CSS를 그대로 옮겼다.
   색·폰트 토큰과 컴포넌트 규칙은 한 줄도 바꾸지 않는다 — 아래 주석의 장 번호는
   0회차·1회차 기준으로 붙은 것이라 합본 장 번호와 어긋날 수 있다(값은 원문 그대로). */

:root{
  font-size:10px;

  --c-bg:#FBFAF7;
  --c-shell:#EFEBE3;
  --c-surface:#FFFFFF;
  --c-ink:#1A1A18;
  --c-ink-2:#5C5A54;
  --c-ink-3:#93908A;
  --c-line:#E4E0D8;
  --c-line-2:#CFC9BC;
  --c-brand:#E2622A;
  --c-brand-tint:#FDEDE4;
  --c-support:#1F6F5C;
  --c-support-tint:#E6F1ED;

  --c-track-a:var(--c-brand);
  --c-track-b:var(--c-support);

  --font:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
         'Apple SD Gothic Neo', system-ui, 'Noto Sans KR', sans-serif;
  --shadow:0 .2rem .8rem rgba(0,0,0,.05);
}

html.fit{ font-size:min(0.625vw, 1.111vh); }

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:var(--font);
  color:var(--c-ink);
  background:var(--c-shell);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  word-break:keep-all; overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}

/* ── 슬라이드 캔버스 ─────────────────────────────── */
.slide{
  position:relative;
  width:160rem; height:90rem;
  background:var(--c-bg);
  padding:6.4rem 8rem 5.6rem;
  display:flex; flex-direction:column;
  overflow:hidden;
}

.hd{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4rem; }
.chip{
  font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em;
  color:var(--c-brand); background:var(--c-brand-tint);
  padding:1rem 2rem; border-radius:99rem;
}
.prog{ font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em; color:var(--c-ink-3); }

h1{ font-size:6.4rem; line-height:1.2; font-weight:700; letter-spacing:-.01em; }
.lead{ font-size:3.6rem; line-height:1.45; font-weight:500; color:var(--c-ink-2); margin-top:2.4rem; }
.lead.nm{ margin-top:0; }
.punch{ font-size:3.6rem; line-height:1.45; font-weight:700; }
.cap{ font-size:2rem; line-height:1.5; color:var(--c-ink-2); }
/* .tm — 상표 귀속 줄(s05). 읽히되 내용을 밀어내지 않는 크기 */
.cap.tm{ font-size:1.8rem; color:var(--c-ink-3); }
.sm{ font-size:2.8rem; line-height:1.6; color:var(--c-ink-2); margin-top:1.6rem; }

.body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:4rem; margin-top:4rem; }
.body.dense{ gap:2.4rem; margin-top:2.4rem; }

/* ── 표지 ───────────────────────────────────────── */
/* 좌: 제목 블록 / 우: 일러스트. 오른쪽 여백이 비어 있던 것을 채운다(2026-07-27). */
.cover{ flex:1; display:flex; align-items:center; gap:6.4rem; }
.cover .covertxt{ flex:1; min-width:0; }
.cover h1{ font-size:9.6rem; line-height:1.15; font-weight:800; }
.cover .sub{ font-size:3.6rem; line-height:1.45; font-weight:500; color:var(--c-ink-2); margin-top:4rem; }
.cover .trio{ width:60rem; flex:none; }
.trio-svg{ display:block; width:100%; height:auto; }
.cover .foot{
  position:absolute; left:8rem; bottom:5.6rem;
  font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em; color:var(--c-ink-3);
}
/* 표지 상표 귀속 줄 — 표지가 첫 화면이자 공유되는 장이라 작게 넣는다.
   .foot 과 같은 밑선에 맞추고, 크기는 읽히되 제목을 방해하지 않는 1.8rem. */
.cover .tmfoot{
  position:absolute; right:8rem; bottom:5.6rem;
  font-size:1.8rem; line-height:1; color:var(--c-ink-3);
}

/* ── 카드 ───────────────────────────────────────── */
.cards{ display:grid; gap:3.2rem; }
.cards.c3{ grid-template-columns:repeat(3,1fr); }
.cards.c2{ grid-template-columns:repeat(2,1fr); gap:4.8rem; }
.cards.tight{ gap:2.4rem; }
.card{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:4rem; box-shadow:var(--shadow);
}
.cards.tight .card{ padding:2.8rem 3.2rem; }
.card h3{ font-size:3.2rem; line-height:1.3; font-weight:700; margin-bottom:2.4rem; }
.card p{ font-size:2.8rem; line-height:1.6; }
.card .ic{ color:var(--c-brand); display:block; margin-bottom:2.4rem; }
.card.hi{ border-color:var(--c-brand); background:var(--c-brand-tint); }
.card.mute{ background:var(--c-surface); }
.card.mute h3, .card.mute p{ color:var(--c-ink-2); }
.card.mute .ic{ color:var(--c-ink-3); }
.card .num{
  display:inline-block; font-size:4rem; font-weight:800; line-height:1;
  color:var(--c-brand); margin-bottom:2.4rem;
}
.card .eyebrow{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-ink-3); margin-bottom:1.2rem; }
/* 카드 머리줄 (s10) — 아이콘과 출처 회사 라벨을 한 줄에 놓아 높이를 아낀다 */
.card .cardhd{ display:flex; align-items:center; gap:1.6rem; margin-bottom:2rem; }
.card .cardhd .ic{ margin-bottom:0; }
.card .cardhd .eyebrow{ margin-bottom:0; }
.cards.tight .card h3{ margin-bottom:2rem; }
.card .tag{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-brand); margin-top:2.4rem; }

/* ── 회사 로고 자리 (s05) ────────────────────────────
   로고 SVG 자체는 slides.py 의 LOGO 가 각 사 공식 자산 원본을 그대로 물고 있다.
   여기서는 '크기와 여백'만 다룬다 — 색·형태를 건드리는 규칙은 두지 않는다
   (재색·왜곡 금지가 세 회사 가이드라인 공통). filter·opacity 도 걸지 않는다.
   여백(clear space): OpenAI 규정이 마크 폭의 0.543배로 가장 빡빡하다.
   마크 3.2rem 기준 필요 여백 1.74rem → 위(카드 padding 4rem)·아래(2.4rem)·
   왼쪽(카드 padding 4rem)·오른쪽(카드 잔여폭)이 모두 이를 넘는다.
   최소 크기 규정은 세 회사 모두 공개 문서에서 확인하지 못했다 — 3.2rem은
   1600px 폭 슬라이드에서 32px 실그림이라 인쇄·투사 모두 여유가 있다. */
/* 줄 높이는 가장 큰 로고(3.6rem)에 맞춘다 — 로고가 제 칸을 넘지 않게 해서
   넘침 검사에 걸리지 않도록 한다. */
.card .logo{ display:flex; align-items:center; height:3.6rem; margin-bottom:2.4rem; }
.card .logo .lg{ display:block; height:3.2rem; width:auto; }
/* 시각 무게 맞춤 — 획이 가느다란 심벌은 같은 높이에서 더 작아 보여 높이만 키운다.
   비율은 그대로다(width:auto — 늘리거나 찌그러뜨리지 않는다).
   ⚠️ 1회차 덱에는 회사 로고를 쓰는 장이 없다. 0회차에서 온 규칙을 남겨만 둔다
   (제품 이름이 든 실측 주석은 1회차 제작 제약에 맞춰 걷어냈다). */
.card .logo .lg-cl{ height:3.6rem; }
/* 2026-08-03 1회차: 세 번째 회사 로고용 규칙(.lg-gm)은 삭제했다.
   1회차는 두 트랙만 다루고 그 회사를 언급하지 않으므로(제작 제약 5),
   CSS 주석에 회사 이름이 남으면 금지어 검사(A)에 걸린다. */

/* ── 3층 스택 ───────────────────────────────────── */
.stack{ display:flex; flex-direction:column; gap:2.4rem; }
.layer{
  display:flex; align-items:center; gap:3.2rem;
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:3.2rem 4rem; box-shadow:var(--shadow);
}
.layer .n{ font-size:4rem; font-weight:800; line-height:1; color:var(--c-brand); width:5rem; flex:none; }
.layer .ic{ color:var(--c-brand); flex:none; }
.layer h3{ font-size:3.2rem; line-height:1.3; font-weight:700; width:28rem; flex:none; }
.layer p{ font-size:2.8rem; line-height:1.6; }

/* ── 표 ─────────────────────────────────────────── */
.tbl{
  width:100%; border-collapse:separate; border-spacing:0;
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; overflow:hidden; box-shadow:var(--shadow);
}
.tbl th, .tbl td{
  font-size:3rem; line-height:1.4; font-weight:400;
  padding:3.2rem 2.4rem; text-align:center;
  border-bottom:.1rem solid var(--c-line);
}
.tbl tr:last-child th, .tbl tr:last-child td{ border-bottom:none; }
.tbl th{ font-weight:700; color:var(--c-ink-2); }
.tbl .rowh{ font-weight:700; text-align:left; padding-left:4rem; }
.tbl .hi{ background:var(--c-brand-tint); color:var(--c-brand); font-weight:700; }

/* ── 시연 프레임 — 구 s07(3사 시연) 삭제로 현재 미사용. 클래스만 남겨둔다 */
.ask{
  display:flex; align-items:center; gap:3.2rem;
  background:var(--c-brand-tint); border-radius:2rem; padding:3.2rem 4rem;
}
.ask .ic{ color:var(--c-brand); flex:none; }
.ask p{ font-size:3.2rem; line-height:1.3; font-weight:700; }
.frame{
  height:22rem; border:.2rem dashed var(--c-line-2); border-radius:2rem;
  background:var(--c-surface); display:flex; align-items:flex-start; justify-content:center;
  padding:2.4rem;
}
.frame span{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-ink-3); }

/* ── 인용 ───────────────────────────────────────── */
.quotes{ display:grid; grid-template-columns:1fr 1fr; gap:4.8rem; }
.quote{ border-left:.4rem solid var(--c-brand); padding-left:2.4rem; }
.quote.b{ border-left-color:var(--c-support); }
.quote p{ font-size:2.8rem; line-height:1.6; }
.quote .src{ font-size:2rem; color:var(--c-ink-3); margin-top:1.2rem; }

/* ── 설치 스텝 (s11) ────────────────────────────── */
.steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:3.2rem; }
.step{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:3.2rem; box-shadow:var(--shadow);
}
.step .n{ display:block; font-size:4rem; font-weight:800; line-height:1; color:var(--c-brand); }
.step .ic{ color:var(--c-ink-2); display:block; margin:2.4rem 0; }
.step p{ font-size:2.8rem; line-height:1.6; font-weight:700; }
.step .tag{ font-size:2.2rem; font-weight:700; color:var(--c-ink-3); margin-top:1.2rem; letter-spacing:.02em; }
/* ── 절차 세로 목록 (1회차 s04 · s06) ─────────────────
   0회차 s11 이 이미 '4칸 가로 스텝 상자 + 아이콘'으로 설치 절차를 보여줬다.
   같은 그릇을 다시 쓰면 최대 병목 파트가 지난주 그림의 재방송이 되므로,
   상자를 없앤 밑줄 목록으로 두고 핵심 한 걸음(.key)만 띠로 띄운다.
   구분선은 쓰지 않는다 — 강조 띠(.key)가 가운데 들어가면 선이 한 경계에만 남아 이물이 된다
   (2026-08-06 실측: 경계 4곳 중 1곳만 1px). 좌우 안쪽 여백은 모든 행이 같은 값이라
   번호열·본문열·우측 주석열이 한 세로선에 선다(강조 행만 밀리던 문제 해소).
   [2026-08-06 주석 수리 2차] 위 문단에 주석 종결 기호(별표+슬래시)가 리터럴로
   들어가 있어 주석이 조기 종결되고 .plan 규칙이 버려지는 사고가 두 번 났다.
   이 주석 블록 안에서는 그 두 글자를 절대 붙여 쓰지 말 것. 값은 원문 그대로다. */
.plan{ display:flex; flex-direction:column; }
/* .slim — 장을 합쳐 목록 밑에 블록이 더 붙는 곳(s04 · s06)에서 행 높이만 줄인다.
   활자 크기·색·좌우 여백은 그대로다. 강조 행(.key)은 제외한다 — :not(.key) 로 빼지 않으면
   이 규칙이 더 구체적이라 .pstep.key 의 넉넉한 padding 을 덮어써 강조 띠가 납작해진다. */
.plan.slim .pstep:not(.key){ padding:1.2rem 2.4rem; }
.pstep{ display:flex; align-items:baseline; gap:2.8rem; padding:2.4rem; }
.pstep .n{ font-size:3.2rem; font-weight:800; line-height:1.2; color:var(--c-ink-3); width:4.4rem; flex:none; }
.pstep .t{ font-size:3.2rem; font-weight:700; line-height:1.3; }
.pstep .sub{ font-size:2.4rem; font-weight:500; line-height:1.4; color:var(--c-ink-3); margin-left:auto; padding-left:2.4rem; text-align:right; }
.pstep.key{ background:var(--c-brand-tint); border-radius:1.6rem; padding:3.2rem 2.4rem; margin:.8rem 0; }
.pstep.key .n{ color:var(--c-brand); }
.pstep.key .t{ font-size:4rem; color:var(--c-brand); }
.pstep.key .sub{ color:var(--c-brand); font-weight:700; }

/* ── 확인 한 줄 (현행 미사용 — 10장 재편으로 s08이 구14+15 합본이 됨) ─────────────────────
   0회차 s12(초록 체크 리스트)와도, 0회차 s20·현행 s09(.task 틴트 띠)과도
   겹치지 않는 제3의 형태. 확인할 것이 하나뿐인 장이라 굵은 세로선 + 큰 문장 한 줄로 둔다. */
.oneline{ border-left:.6rem solid var(--c-support); padding:1.6rem 0 1.6rem 3.2rem; }
.oneline p{ font-size:4.8rem; line-height:1.3; font-weight:800; }

/* ── 지침 경로 행 (현행 s02) ───────────────────
   0회차 s13 이 같은 경로를 '카드 2장 + 색 pill'로 보여줬다. 같은 그릇을 쓰면
   장면이 복제되므로, 색 덩어리 없이 밑줄 두 줄짜리 납작한 행으로만 적는다. */
.paths{ display:flex; flex-direction:column; }
.prow{ display:flex; align-items:baseline; gap:3.2rem; padding:3.2rem .4rem; border-bottom:.1rem solid var(--c-line); }
.prow:first-child{ border-top:.1rem solid var(--c-line); }
.prow .who{ font-size:2.8rem; font-weight:700; letter-spacing:.02em; color:var(--c-ink-3); width:20rem; flex:none; }
.prow .where{ font-size:3.6rem; font-weight:700; line-height:1.3; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:4.8rem; align-items:center; }
.warn{ font-size:2.8rem; line-height:1.6; font-weight:700; color:var(--c-brand); }

/* ── 1차 → 한 줄 → 2차 흐름 (현행 s07) ─────────
   좌우는 결과 카드, 가운데는 '사람이 보탠 한 줄'이라 형태를 다르게 둔다 —
   카드가 아니라 좁은 세로 띠 + 지지색(딥그린)이라 3단 나열로 안 읽힌다.
   기존 규칙 값은 건드리지 않고 블록을 새로 더하기만 했다. */
.flow{ display:grid; grid-template-columns:1fr 5.6rem .84fr 5.6rem 1fr; gap:2rem; align-items:stretch; }
.flow .arw{ display:flex; align-items:center; justify-content:center; color:var(--c-line-2); }
/* 1차 칸만 확실히 내린다 — .card.mute 는 흰 바탕이라 본문 바탕과 거의 같아 신호가 안 산다.
   기존 .card.mute 규칙은 그대로 두고 .flow 안에서만 한 단계 더 눌러 좌→우 낙차를 만든다. */
.flow .card.mute{ background:var(--c-shell); border-color:var(--c-line-2); box-shadow:none; }
.saybar{
  align-self:center;
  /* 테두리는 .3rem 미만이면 크로뮴이 정수 px 로 내려 1px 로 렌더된다(실측) → .4rem */
  background:var(--c-support-tint); border:.4rem solid var(--c-support);
  border-radius:1.6rem; padding:2.8rem 2.4rem;
}
.saybar .eyebrow{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-support); margin-bottom:1.2rem; }
.saybar p{ font-size:2.8rem; line-height:1.5; font-weight:700; color:var(--c-support); }

/* ── 캡처 플레이스홀더 ──────────────────────────── */
.capture{
  border:.2rem dashed var(--c-line-2); background:var(--c-surface);
  border-radius:1.6rem; height:12rem;
  display:flex; align-items:center; justify-content:center;
}
.capture span{ font-size:2rem; color:var(--c-ink-3); }

/* ── 체크 (현행 s08) ─────────────────────────────────── */
.checks{ display:flex; flex-direction:column; gap:2.4rem; }
.chk{ display:flex; align-items:center; gap:2.4rem; font-size:3.2rem; line-height:1.3; font-weight:700; }
.chk .ic{ color:var(--c-support); flex:none; }
.big-ok{ display:flex; align-items:center; justify-content:center; }
.big-ok .ic.big{ color:var(--c-support); opacity:.35; }

/* ── 지침 경로 pill — 현행 10장 체제 미사용(0회차 유래, 규칙만 보존) ─────────────────── */
.pill{
  display:inline-block; font-size:2.8rem; line-height:1.4; font-weight:700;
  background:var(--c-brand-tint); color:var(--c-brand);
  padding:1.2rem 2.4rem; border-radius:1.2rem;
}
.pill.b{ background:var(--c-support-tint); color:var(--c-support); }
/* .hi 카드(이미 brand-tint 바탕) 안에서는 pill 을 흰 바탕으로 — 대비 확보 */
.pill.w{ background:var(--c-surface); color:var(--c-brand); }
/* s14 — pill 두 개를 세로로 쌓는다(파일 이름도 본문 폰트 + pill 로만 표기) */
.pills{ display:flex; flex-direction:column; align-items:flex-start; gap:1.2rem; margin-top:2.4rem; }

/* ── 빈칸 템플릿 (s15) ──────────────────────────── */
.tmpl{ display:grid; grid-template-columns:1fr 1fr; gap:3.2rem; align-items:start; }
.tbox{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:2.8rem 3.2rem; box-shadow:var(--shadow);
}
.tbox.span2{ grid-column:2; grid-row:1 / span 2; }
.tbox h4{ font-size:2.8rem; font-weight:700; color:var(--c-brand); margin-bottom:1.6rem; }
.tbox p{ font-size:2.8rem; line-height:1.9; }
.tbox ul{ list-style:none; }
.tbox li{ font-size:2.8rem; line-height:1.7; padding-left:2.4rem; position:relative; }
/* 불릿은 폭이 좁은 가운뎃점으로 — em-dash는 본문에 붙어 보인다 */
.tbox li::before{ content:'\\2022'; position:absolute; left:.4rem; color:var(--c-ink-3); }
.blank{
  display:inline-block; width:16rem; height:2.8rem;
  border-bottom:.2rem solid var(--c-line-2); vertical-align:-.4rem;
}

/* ── QR 패널 (s15) ──────────────────────────────────
   세로 여유가 없어 QR을 아래로 못 쌓는다 → 템플릿을 3단으로 넓혀 오른쪽에 세운다.
   .tbox.span2 의 grid-row:1/span 2 를 그대로 두어야 3번 칸이 1행 높이를 밀지 않는다. */
.tmpl.wq{ grid-template-columns:1fr 1fr 30rem; }
/* 3번 칸과 QR 패널은 두 행을 채워 아랫변을 왼쪽 두 칸과 맞춘다(.tmpl 은 align-items:start) */
.tmpl.wq > .tbox.span2, .tmpl.wq > .qr{ align-self:stretch; }
.qr{
  grid-column:3; grid-row:1 / span 2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2.4rem; background:var(--c-brand-tint); border-radius:2rem; padding:2.4rem 2rem;
}
/* 흰 바탕 + 여백 — 프로젝터에서 주변 색이 QR의 여백(quiet zone)을 먹지 않게 한다 */
.qrimg{
  display:block; width:26rem; height:26rem;
  background:var(--c-surface); border-radius:1.2rem; padding:1.2rem;
}
.qr p{ font-size:2.4rem; line-height:1.4; font-weight:700; color:var(--c-brand); text-align:center; }

/* ── 지침 8줄 (s16 · 2026-07-28 신설) ───────────────
   붙여넣을 문안이라 한 글자도 줄일 수 없다 → 2단으로 나눠 한 장에 담는다.
   긴 1번과 6번만 두 단 폭(.rule.wide)으로 눕히고 나머지는 좌우로 짝짓는다.
   코드 블록 모티프는 금지라 본문 글꼴 그대로 쓰고,
   '한 덩어리'라는 건 머리말(.blockhd)과 번호 배지로만 알린다. */
.blockhd{ font-size:2.4rem; font-weight:700; letter-spacing:.02em; color:var(--c-brand); }
.rules{ display:grid; grid-template-columns:1fr 1fr; gap:1.2rem 4rem; align-content:start; }
/* 1번(끄는 목록)과 6번(3줄 요약)은 세 줄짜리라 두 단을 가로질러 눕힌다 */
.rule.wide{ grid-column:1 / -1; }
.rule{ display:flex; align-items:flex-start; gap:1.6rem; }
/* '이럴 땐 계획 없이 그냥 해라' — 과발동을 끄는 줄이라 색으로 갈라 보인다 */
.rule .off{ display:block; color:var(--c-support); font-weight:700; }
.rule .n{
  flex:none; width:3.6rem; height:3.6rem; border-radius:99rem;
  background:var(--c-brand-tint); color:var(--c-brand);
  font-size:2.2rem; font-weight:800; line-height:3.6rem; text-align:center;
}
.rule p{ font-size:2.2rem; line-height:1.5; }

/* ── 해설표 (s17 · s18 · 2026-07-28 신설) ───────────
   설명을 줄이지 않고(대표 지시) 4행씩 두 장으로 나눠 담는다.
   .tbl 기본값(3rem / 3.2rem 패딩·가운데 정렬)보다 촘촘하고 왼쪽 정렬이다. */
.tbl.gl th, .tbl.gl td{ font-size:2.4rem; line-height:1.5; padding:2rem 2.4rem; text-align:left; }
.tbl.gl th:first-child, .tbl.gl td:first-child{ width:34rem; padding-left:3.2rem; }
.tbl.gl .rowh{ padding-left:3.2rem; color:var(--c-ink); vertical-align:top; }
.tbl.gl b{ font-weight:700; color:var(--c-brand); }
/* 제목 뒤 회차 표시(1~4 / 5~8) — 제목과 같은 줄, 무게만 뺀다 */
.hnum{ font-weight:400; color:var(--c-ink-3); }

/* ── 말풍선 (s18) ───────────────────────────────── */
.talk{ display:flex; flex-direction:column; gap:2.4rem; }
.bubble{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:2.8rem 4rem; box-shadow:var(--shadow); max-width:110rem;
}
.bubble.me{ background:var(--c-brand-tint); border-color:var(--c-brand-tint); align-self:flex-start; }
.bubble:not(.me){ align-self:flex-end; }
.bubble p{ font-size:3.2rem; line-height:1.4; font-weight:700; }

/* ── 과제 (현행 s09) ───────────────────────────────
   ⚠️ 이 CSS 블록들의 괄호 안 장 번호는 0회차에서 붙은 것이라
   1회차 장 번호와 어긋난다. 이 줄만 1회차 기준으로 고쳐 둔다. */
.task{
  display:flex; align-items:center; gap:4rem;
  background:var(--c-brand-tint); border-radius:2rem; padding:4.8rem 5.6rem;
}
.task .ic{ color:var(--c-brand); flex:none; }
.task p{ font-size:4rem; line-height:1.4; font-weight:700; }
/* .slim — 회고와 같은 장에 얹히는 s09 용. 띠 높이만 낮추고 활자는 그대로 둔다. */
.task.slim{ padding:3.2rem 5.6rem; }

/* ══ 진입 모션 ═══════════════════════════════════
   발표용 덱이라 힘은 '장이 뜰 때'에만 싣는다(호버는 부차).
   - html.anim 이 붙은 sNN.html 에서만 재생. index.html(썸네일)은 정지.
   - prefers-reduced-motion: reduce 에서는 규칙 자체가 적용되지 않는다.
   - fill-mode: backwards — 종료 후 원래 스타일로 복귀(= 정상 레이아웃). both 를 쓰면 종료 후에도 transform 이 채워져 :hover 가 죽는다(2026-07-27 실측).
   - 단계: 헤더 0s → 제목 .06s → 리드 .14s → 본문 블록 .24s부터, 항목 간 .06s.
     가장 늦은 시작이 .70s라 진입은 1.15s 안에 끝난다. */

@keyframes rise{
  from{ opacity:0; transform:translateY(1.6rem); }
  to{ opacity:1; transform:none; }
}
@keyframes pop{
  from{ opacity:0; transform:scale(.72); }
  to{ opacity:1; transform:none; }
}
@keyframes tint{
  from{ background:var(--c-surface); color:var(--c-ink); }
  to{ background:var(--c-brand-tint); color:var(--c-brand); }
}
@keyframes sweep{
  from{ transform:scaleX(0); }
  to{ transform:scaleX(1); }
}

/* 호버 — 마우스가 있는 기기에서만. reduced-motion 과 무관하게 유효하다
   (진입 애니는 fill-mode:backwards 라 종료 후 transform 을 비워두므로 여기서 덮이지 않는다). */
@media (hover:hover) and (pointer:fine){
  .card, .step, .layer, .tbox{ transition:transform .2s cubic-bezier(.22,.85,.3,1); }
  .card:hover, .step:hover, .layer:hover, .tbox:hover{ transform:translateY(-.3rem); }
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion: reduce){
  .card, .step, .layer, .tbox{ transition:none; }
}

@media (prefers-reduced-motion: no-preference){
  /* --db = 블록(본문 단) 지연, --ds = 블록 안 항목 stagger */
  .anim .slide{ --db:.24s; --ds:0s; }

  .anim .slide > .hd,
  .anim .slide > h1,
  .anim .slide > .lead,
  .anim .cover h1,
  .anim .cover .sub,
  .anim .cover .foot,
  .anim .cover .tmfoot,
  .anim .body > p,
  .anim .body > .ask,
  .anim .body > .task,
  .anim .body > .oneline,
  .anim .body > .capture,
  .anim .cards > .card,
  .anim .cards > .frame,
  .anim .flow > *,
  .anim .stack > .layer,
  .anim .steps > .step,
  .anim .plan > .pstep,
  .anim .paths > .prow,
  .anim .quotes > .quote,
  .anim .tmpl > .tbox,
  .anim .tmpl > .qr,
  .anim .rules > .rule,
  .anim .talk > .bubble,
  .anim .checks > .chk,
  .anim .row > .big-ok,
  .anim .tbl tr{
    animation:rise .44s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + var(--ds));
  }

  /* 고정 단계 — 헤더 · 제목 · 리드 · 표지 */
  .anim .slide > .hd{ animation-delay:0s; }
  .anim .slide > h1{ animation-delay:.06s; }
  .anim .slide > .lead{ animation-delay:.14s; }
  .anim .cover h1{ animation-delay:.06s; }
  .anim .cover .sub{ animation-delay:.20s; }
  .anim .cover .foot{ animation-delay:.38s; }
  .anim .cover .tmfoot{ animation-delay:.70s; }

  /* 표지 일러스트 — 제목·부제 다음에 셋이 차례로 등장한다(.32s → .48s).
     SVG <g>의 scale 은 fill-box 기준이 아니면 원점이 뷰박스 좌상단이라 튄다. */
  .anim .trio-svg .m{
    transform-box:fill-box; transform-origin:50% 100%;
    animation:pop .5s cubic-bezier(.34,1.4,.64,1) backwards;
  }
  .anim .trio-svg .m1{ animation-delay:.32s; }
  .anim .trio-svg .m2{ animation-delay:.40s; }
  .anim .trio-svg .m3{ animation-delay:.48s; }
  .anim .trio-svg .m0{ animation-name:rise; animation-delay:.60s; }

  /* s05 로고 — 카드가 올라온 뒤(.18s) 제자리에서 살짝 커지며 든다.
     카드의 --db/--ds 를 그대로 물려받아 좌→우 순서가 카드와 어긋나지 않는다.
     로고는 HTML 요소라 transform-origin 기본값(50% 50%)이 그대로 맞는다. */
  .anim .cards > .card .logo .lg{
    animation:pop .42s cubic-bezier(.34,1.4,.64,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .18s);
  }

  /* 본문 단(段) 순서 */
  .anim .body > *:nth-child(1){ --db:.24s; }
  .anim .body > *:nth-child(2){ --db:.52s; }
  .anim .body > *:nth-child(3){ --db:.66s; }
  .anim .body > *:nth-child(4){ --db:.78s; }

  /* 블록 안 항목 stagger */
  .anim .cards > *, .anim .stack > *, .anim .steps > *, .anim .quotes > *,
  .anim .tmpl > *, .anim .talk > *, .anim .checks > *, .anim .tbl tr,
  .anim .rules > *{ --ds:0s; }
  .anim .cards > *:nth-child(2), .anim .stack > *:nth-child(2),
  .anim .steps > *:nth-child(2), .anim .quotes > *:nth-child(2),
  .anim .tmpl > *:nth-child(2), .anim .talk > *:nth-child(2),
  .anim .checks > *:nth-child(2), .anim .tbl tr:nth-child(2),
  .anim .rules > *:nth-child(2){ --ds:.06s; }
  .anim .cards > *:nth-child(3), .anim .stack > *:nth-child(3),
  .anim .steps > *:nth-child(3), .anim .tmpl > *:nth-child(3),
  .anim .checks > *:nth-child(3), .anim .tbl tr:nth-child(3),
  .anim .rules > *:nth-child(3){ --ds:.12s; }
  .anim .cards > *:nth-child(4), .anim .steps > *:nth-child(4),
  .anim .tmpl > *:nth-child(4), .anim .rules > *:nth-child(4){ --ds:.18s; }
  /* 지침 8줄(s16)만 항목이 5개를 넘는다 → 5~8번까지 이어서 정의한다.
     없으면 --ds 가 0으로 떨어져 5~8번이 2~4번보다 먼저 뜬다(2026-07-28 실측). */
  .anim .rules > *:nth-child(5){ --ds:.24s; }
  .anim .rules > *:nth-child(6){ --ds:.30s; }
  .anim .rules > *:nth-child(7){ --ds:.36s; }
  .anim .rules > *:nth-child(8){ --ds:.42s; }

  /* .flow(현행 s07) — 좌 → 화살표 → 가운데 → 화살표 → 우 순서로 흐르게 한다.
     기존 stagger 목록에 얹지 않고 따로 적어, 다른 블록의 --ds 값을 건드리지 않는다. */
  .anim .flow > *{ --ds:0s; }
  .anim .flow > *:nth-child(2){ --ds:.06s; }
  .anim .flow > *:nth-child(3){ --ds:.12s; }
  .anim .flow > *:nth-child(4){ --ds:.18s; }
  .anim .flow > *:nth-child(5){ --ds:.24s; }

  /* .plan(s04·s06) · .paths(s02) — 위에서 아래로 한 줄씩 */
  .anim .plan > *, .anim .paths > *{ --ds:0s; }
  .anim .plan > *:nth-child(2), .anim .paths > *:nth-child(2){ --ds:.06s; }
  .anim .plan > *:nth-child(3){ --ds:.12s; }
  .anim .plan > *:nth-child(4){ --ds:.18s; }

  /* 강조 1개만 특별대우 — 대비 카드의 '되는 쪽'은 살짝 늦게 */
  .anim .cards > .card.hi{ --ds:.16s; }
  /* .seq — 강조 카드가 '왼쪽'인 장(현행 s08)에서는 위 특별대우를 끄고 좌→우 순서를 지킨다 */
  .anim .cards.seq > .card.hi{ --ds:0s; }

  /* s06 표 — 행이 다 들어온 뒤 가운데 칸이 점등 */
  .anim .tbl .hi{
    animation:tint .4s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + .38s);
  }

  /* 현행 s08 체크 — 체크 표시가 하나씩 켜지고, 큰 체크가 마지막에 */
  .anim .chk > .ic{
    animation:pop .4s cubic-bezier(.34,1.4,.64,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .10s);
  }
  .anim .row > .big-ok{ --ds:.24s; animation-name:pop; }

  /* s15 빈칸 — 밑줄이 왼쪽에서 그어진다 */
  .anim .blank{
    transform-origin:0 50%;
    animation:sweep .5s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .18s);
  }

  /* 부차 — 호버(발표 중엔 거의 안 쓰이지만 열람 시 반응) */
  .anim .card, .anim .step, .anim .layer, .anim .tbox{ transition:transform .18s ease-out; }
  /* 호버는 아래 블록(무모션 환경에서도 유효)으로 분리 — 발표 중엔 안 쓰지만 검토 시 유효 */
}

/* 인쇄·PDF는 최종 상태로 고정 */
@media print{
  .anim *{ animation:none !important; transition:none !important; }
}

/* ── 전체 미리보기 (index.html) ─────────────────── */
body.preview{ display:block; padding:6.4rem; background:var(--c-shell); }
.preview .ph{ font-size:4rem; font-weight:800; margin-bottom:1.2rem; }
.preview .psub{ font-size:2rem; color:var(--c-ink-2); margin-bottom:4rem; }
/* 썸네일 1열 = 32rem(320px) 고정, gap 4rem — 화면 폭에 맞춰 열 수를 자동으로 줄인다
   (auto-fill). 1600px 이상이면 4열, 좁아지면 3→2→1열로 줄어 가로 스크롤 없이 표시된다.
   썸네일 크기 자체(32rem×18rem)는 고정 — 안쪽 .slide{transform:scale(.2)}가 어긋나므로 바꾸지 말 것. */
.preview .grid{ display:grid; grid-template-columns:repeat(auto-fill,32rem); gap:4rem; justify-content:center; }
.thumb{ display:block; text-decoration:none; color:inherit; }
.thumb .shot{
  width:32rem; height:18rem; overflow:hidden;
  border:.1rem solid var(--c-line-2); border-radius:1.2rem; background:var(--c-bg);
}
.thumb .shot .slide{ transform:scale(.2); transform-origin:0 0; }
.thumb .lbl{ font-size:1.8rem; font-weight:700; color:var(--c-ink-2); margin-top:1.2rem; }
/* 좁은 화면(모바일)에서는 좌우 여백(6.4rem=64px)만으로도 32rem(320px) 썸네일 1열이
   안 들어가는 폭이 있어(≤448px) 본문 여백을 줄인다. 썸네일 크기 자체는 그대로 둔다. */
@media (max-width:500px){
  body.preview{ padding:2rem; }
}

{t:"doc",c:`<!DOCTYPE html>
<html lang="ko" class="fit anim">
<head>
<meta charset="utf-8">
<title>오늘 쓸 폴더를 골라 엽니다 · 세미콜로니 AI 입문 합본<\/title>
<style>
/* 세미콜로니 AI 입문 합본 덱 — build.py가 생성. 직접 수정 금지.
   스타일 본문은 1회차 덱(세미콜로니-1회차/_build/build.py)의 CSS를 그대로 옮겼다.
   색·폰트 토큰과 컴포넌트 규칙은 한 줄도 바꾸지 않는다 — 아래 주석의 장 번호는
   0회차·1회차 기준으로 붙은 것이라 합본 장 번호와 어긋날 수 있다(값은 원문 그대로). */

:root{
  font-size:10px;

  --c-bg:#FBFAF7;
  --c-shell:#EFEBE3;
  --c-surface:#FFFFFF;
  --c-ink:#1A1A18;
  --c-ink-2:#5C5A54;
  --c-ink-3:#93908A;
  --c-line:#E4E0D8;
  --c-line-2:#CFC9BC;
  --c-brand:#E2622A;
  --c-brand-tint:#FDEDE4;
  --c-support:#1F6F5C;
  --c-support-tint:#E6F1ED;

  --c-track-a:var(--c-brand);
  --c-track-b:var(--c-support);

  --font:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
         'Apple SD Gothic Neo', system-ui, 'Noto Sans KR', sans-serif;
  --shadow:0 .2rem .8rem rgba(0,0,0,.05);
}

html.fit{ font-size:min(0.625vw, 1.111vh); }

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:var(--font);
  color:var(--c-ink);
  background:var(--c-shell);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  word-break:keep-all; overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}

/* ── 슬라이드 캔버스 ─────────────────────────────── */
.slide{
  position:relative;
  width:160rem; height:90rem;
  background:var(--c-bg);
  padding:6.4rem 8rem 5.6rem;
  display:flex; flex-direction:column;
  overflow:hidden;
}

.hd{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4rem; }
.chip{
  font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em;
  color:var(--c-brand); background:var(--c-brand-tint);
  padding:1rem 2rem; border-radius:99rem;
}
.prog{ font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em; color:var(--c-ink-3); }

h1{ font-size:6.4rem; line-height:1.2; font-weight:700; letter-spacing:-.01em; }
.lead{ font-size:3.6rem; line-height:1.45; font-weight:500; color:var(--c-ink-2); margin-top:2.4rem; }
.lead.nm{ margin-top:0; }
.punch{ font-size:3.6rem; line-height:1.45; font-weight:700; }
.cap{ font-size:2rem; line-height:1.5; color:var(--c-ink-2); }
/* .tm — 상표 귀속 줄(s05). 읽히되 내용을 밀어내지 않는 크기 */
.cap.tm{ font-size:1.8rem; color:var(--c-ink-3); }
.sm{ font-size:2.8rem; line-height:1.6; color:var(--c-ink-2); margin-top:1.6rem; }

.body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:4rem; margin-top:4rem; }
.body.dense{ gap:2.4rem; margin-top:2.4rem; }

/* ── 표지 ───────────────────────────────────────── */
/* 좌: 제목 블록 / 우: 일러스트. 오른쪽 여백이 비어 있던 것을 채운다(2026-07-27). */
.cover{ flex:1; display:flex; align-items:center; gap:6.4rem; }
.cover .covertxt{ flex:1; min-width:0; }
.cover h1{ font-size:9.6rem; line-height:1.15; font-weight:800; }
.cover .sub{ font-size:3.6rem; line-height:1.45; font-weight:500; color:var(--c-ink-2); margin-top:4rem; }
.cover .trio{ width:60rem; flex:none; }
.trio-svg{ display:block; width:100%; height:auto; }
.cover .foot{
  position:absolute; left:8rem; bottom:5.6rem;
  font-size:2.2rem; font-weight:700; line-height:1; letter-spacing:.04em; color:var(--c-ink-3);
}
/* 표지 상표 귀속 줄 — 표지가 첫 화면이자 공유되는 장이라 작게 넣는다.
   .foot 과 같은 밑선에 맞추고, 크기는 읽히되 제목을 방해하지 않는 1.8rem. */
.cover .tmfoot{
  position:absolute; right:8rem; bottom:5.6rem;
  font-size:1.8rem; line-height:1; color:var(--c-ink-3);
}

/* ── 카드 ───────────────────────────────────────── */
.cards{ display:grid; gap:3.2rem; }
.cards.c3{ grid-template-columns:repeat(3,1fr); }
.cards.c2{ grid-template-columns:repeat(2,1fr); gap:4.8rem; }
.cards.tight{ gap:2.4rem; }
.card{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:4rem; box-shadow:var(--shadow);
}
.cards.tight .card{ padding:2.8rem 3.2rem; }
.card h3{ font-size:3.2rem; line-height:1.3; font-weight:700; margin-bottom:2.4rem; }
.card p{ font-size:2.8rem; line-height:1.6; }
.card .ic{ color:var(--c-brand); display:block; margin-bottom:2.4rem; }
.card.hi{ border-color:var(--c-brand); background:var(--c-brand-tint); }
.card.mute{ background:var(--c-surface); }
.card.mute h3, .card.mute p{ color:var(--c-ink-2); }
.card.mute .ic{ color:var(--c-ink-3); }
.card .num{
  display:inline-block; font-size:4rem; font-weight:800; line-height:1;
  color:var(--c-brand); margin-bottom:2.4rem;
}
.card .eyebrow{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-ink-3); margin-bottom:1.2rem; }
/* 카드 머리줄 (s10) — 아이콘과 출처 회사 라벨을 한 줄에 놓아 높이를 아낀다 */
.card .cardhd{ display:flex; align-items:center; gap:1.6rem; margin-bottom:2rem; }
.card .cardhd .ic{ margin-bottom:0; }
.card .cardhd .eyebrow{ margin-bottom:0; }
.cards.tight .card h3{ margin-bottom:2rem; }
.card .tag{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-brand); margin-top:2.4rem; }

/* ── 회사 로고 자리 (s05) ────────────────────────────
   로고 SVG 자체는 slides.py 의 LOGO 가 각 사 공식 자산 원본을 그대로 물고 있다.
   여기서는 '크기와 여백'만 다룬다 — 색·형태를 건드리는 규칙은 두지 않는다
   (재색·왜곡 금지가 세 회사 가이드라인 공통). filter·opacity 도 걸지 않는다.
   여백(clear space): OpenAI 규정이 마크 폭의 0.543배로 가장 빡빡하다.
   마크 3.2rem 기준 필요 여백 1.74rem → 위(카드 padding 4rem)·아래(2.4rem)·
   왼쪽(카드 padding 4rem)·오른쪽(카드 잔여폭)이 모두 이를 넘는다.
   최소 크기 규정은 세 회사 모두 공개 문서에서 확인하지 못했다 — 3.2rem은
   1600px 폭 슬라이드에서 32px 실그림이라 인쇄·투사 모두 여유가 있다. */
/* 줄 높이는 가장 큰 로고(3.6rem)에 맞춘다 — 로고가 제 칸을 넘지 않게 해서
   넘침 검사에 걸리지 않도록 한다. */
.card .logo{ display:flex; align-items:center; height:3.6rem; margin-bottom:2.4rem; }
.card .logo .lg{ display:block; height:3.2rem; width:auto; }
/* 시각 무게 맞춤 — 획이 가느다란 심벌은 같은 높이에서 더 작아 보여 높이만 키운다.
   비율은 그대로다(width:auto — 늘리거나 찌그러뜨리지 않는다).
   ⚠️ 1회차 덱에는 회사 로고를 쓰는 장이 없다. 0회차에서 온 규칙을 남겨만 둔다
   (제품 이름이 든 실측 주석은 1회차 제작 제약에 맞춰 걷어냈다). */
.card .logo .lg-cl{ height:3.6rem; }
/* 2026-08-03 1회차: 세 번째 회사 로고용 규칙(.lg-gm)은 삭제했다.
   1회차는 두 트랙만 다루고 그 회사를 언급하지 않으므로(제작 제약 5),
   CSS 주석에 회사 이름이 남으면 금지어 검사(A)에 걸린다. */

/* ── 3층 스택 ───────────────────────────────────── */
.stack{ display:flex; flex-direction:column; gap:2.4rem; }
.layer{
  display:flex; align-items:center; gap:3.2rem;
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:3.2rem 4rem; box-shadow:var(--shadow);
}
.layer .n{ font-size:4rem; font-weight:800; line-height:1; color:var(--c-brand); width:5rem; flex:none; }
.layer .ic{ color:var(--c-brand); flex:none; }
.layer h3{ font-size:3.2rem; line-height:1.3; font-weight:700; width:28rem; flex:none; }
.layer p{ font-size:2.8rem; line-height:1.6; }

/* ── 표 ─────────────────────────────────────────── */
.tbl{
  width:100%; border-collapse:separate; border-spacing:0;
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; overflow:hidden; box-shadow:var(--shadow);
}
.tbl th, .tbl td{
  font-size:3rem; line-height:1.4; font-weight:400;
  padding:3.2rem 2.4rem; text-align:center;
  border-bottom:.1rem solid var(--c-line);
}
.tbl tr:last-child th, .tbl tr:last-child td{ border-bottom:none; }
.tbl th{ font-weight:700; color:var(--c-ink-2); }
.tbl .rowh{ font-weight:700; text-align:left; padding-left:4rem; }
.tbl .hi{ background:var(--c-brand-tint); color:var(--c-brand); font-weight:700; }

/* ── 시연 프레임 — 구 s07(3사 시연) 삭제로 현재 미사용. 클래스만 남겨둔다 */
.ask{
  display:flex; align-items:center; gap:3.2rem;
  background:var(--c-brand-tint); border-radius:2rem; padding:3.2rem 4rem;
}
.ask .ic{ color:var(--c-brand); flex:none; }
.ask p{ font-size:3.2rem; line-height:1.3; font-weight:700; }
.frame{
  height:22rem; border:.2rem dashed var(--c-line-2); border-radius:2rem;
  background:var(--c-surface); display:flex; align-items:flex-start; justify-content:center;
  padding:2.4rem;
}
.frame span{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-ink-3); }

/* ── 인용 ───────────────────────────────────────── */
.quotes{ display:grid; grid-template-columns:1fr 1fr; gap:4.8rem; }
.quote{ border-left:.4rem solid var(--c-brand); padding-left:2.4rem; }
.quote.b{ border-left-color:var(--c-support); }
.quote p{ font-size:2.8rem; line-height:1.6; }
.quote .src{ font-size:2rem; color:var(--c-ink-3); margin-top:1.2rem; }

/* ── 설치 스텝 (s11) ────────────────────────────── */
.steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:3.2rem; }
.step{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:3.2rem; box-shadow:var(--shadow);
}
.step .n{ display:block; font-size:4rem; font-weight:800; line-height:1; color:var(--c-brand); }
.step .ic{ color:var(--c-ink-2); display:block; margin:2.4rem 0; }
.step p{ font-size:2.8rem; line-height:1.6; font-weight:700; }
.step .tag{ font-size:2.2rem; font-weight:700; color:var(--c-ink-3); margin-top:1.2rem; letter-spacing:.02em; }
/* ── 절차 세로 목록 (1회차 s04 · s06) ─────────────────
   0회차 s11 이 이미 '4칸 가로 스텝 상자 + 아이콘'으로 설치 절차를 보여줬다.
   같은 그릇을 다시 쓰면 최대 병목 파트가 지난주 그림의 재방송이 되므로,
   상자를 없앤 밑줄 목록으로 두고 핵심 한 걸음(.key)만 띠로 띄운다.
   구분선은 쓰지 않는다 — 강조 띠(.key)가 가운데 들어가면 선이 한 경계에만 남아 이물이 된다
   (2026-08-06 실측: 경계 4곳 중 1곳만 1px). 좌우 안쪽 여백은 모든 행이 같은 값이라
   번호열·본문열·우측 주석열이 한 세로선에 선다(강조 행만 밀리던 문제 해소).
   [2026-08-06 주석 수리 2차] 위 문단에 주석 종결 기호(별표+슬래시)가 리터럴로
   들어가 있어 주석이 조기 종결되고 .plan 규칙이 버려지는 사고가 두 번 났다.
   이 주석 블록 안에서는 그 두 글자를 절대 붙여 쓰지 말 것. 값은 원문 그대로다. */
.plan{ display:flex; flex-direction:column; }
/* .slim — 장을 합쳐 목록 밑에 블록이 더 붙는 곳(s04 · s06)에서 행 높이만 줄인다.
   활자 크기·색·좌우 여백은 그대로다. 강조 행(.key)은 제외한다 — :not(.key) 로 빼지 않으면
   이 규칙이 더 구체적이라 .pstep.key 의 넉넉한 padding 을 덮어써 강조 띠가 납작해진다. */
.plan.slim .pstep:not(.key){ padding:1.2rem 2.4rem; }
.pstep{ display:flex; align-items:baseline; gap:2.8rem; padding:2.4rem; }
.pstep .n{ font-size:3.2rem; font-weight:800; line-height:1.2; color:var(--c-ink-3); width:4.4rem; flex:none; }
.pstep .t{ font-size:3.2rem; font-weight:700; line-height:1.3; }
.pstep .sub{ font-size:2.4rem; font-weight:500; line-height:1.4; color:var(--c-ink-3); margin-left:auto; padding-left:2.4rem; text-align:right; }
.pstep.key{ background:var(--c-brand-tint); border-radius:1.6rem; padding:3.2rem 2.4rem; margin:.8rem 0; }
.pstep.key .n{ color:var(--c-brand); }
.pstep.key .t{ font-size:4rem; color:var(--c-brand); }
.pstep.key .sub{ color:var(--c-brand); font-weight:700; }

/* ── 확인 한 줄 (현행 미사용 — 10장 재편으로 s08이 구14+15 합본이 됨) ─────────────────────
   0회차 s12(초록 체크 리스트)와도, 0회차 s20·현행 s09(.task 틴트 띠)과도
   겹치지 않는 제3의 형태. 확인할 것이 하나뿐인 장이라 굵은 세로선 + 큰 문장 한 줄로 둔다. */
.oneline{ border-left:.6rem solid var(--c-support); padding:1.6rem 0 1.6rem 3.2rem; }
.oneline p{ font-size:4.8rem; line-height:1.3; font-weight:800; }

/* ── 지침 경로 행 (현행 s02) ───────────────────
   0회차 s13 이 같은 경로를 '카드 2장 + 색 pill'로 보여줬다. 같은 그릇을 쓰면
   장면이 복제되므로, 색 덩어리 없이 밑줄 두 줄짜리 납작한 행으로만 적는다. */
.paths{ display:flex; flex-direction:column; }
.prow{ display:flex; align-items:baseline; gap:3.2rem; padding:3.2rem .4rem; border-bottom:.1rem solid var(--c-line); }
.prow:first-child{ border-top:.1rem solid var(--c-line); }
.prow .who{ font-size:2.8rem; font-weight:700; letter-spacing:.02em; color:var(--c-ink-3); width:20rem; flex:none; }
.prow .where{ font-size:3.6rem; font-weight:700; line-height:1.3; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:4.8rem; align-items:center; }
.warn{ font-size:2.8rem; line-height:1.6; font-weight:700; color:var(--c-brand); }

/* ── 1차 → 한 줄 → 2차 흐름 (현행 s07) ─────────
   좌우는 결과 카드, 가운데는 '사람이 보탠 한 줄'이라 형태를 다르게 둔다 —
   카드가 아니라 좁은 세로 띠 + 지지색(딥그린)이라 3단 나열로 안 읽힌다.
   기존 규칙 값은 건드리지 않고 블록을 새로 더하기만 했다. */
.flow{ display:grid; grid-template-columns:1fr 5.6rem .84fr 5.6rem 1fr; gap:2rem; align-items:stretch; }
.flow .arw{ display:flex; align-items:center; justify-content:center; color:var(--c-line-2); }
/* 1차 칸만 확실히 내린다 — .card.mute 는 흰 바탕이라 본문 바탕과 거의 같아 신호가 안 산다.
   기존 .card.mute 규칙은 그대로 두고 .flow 안에서만 한 단계 더 눌러 좌→우 낙차를 만든다. */
.flow .card.mute{ background:var(--c-shell); border-color:var(--c-line-2); box-shadow:none; }
.saybar{
  align-self:center;
  /* 테두리는 .3rem 미만이면 크로뮴이 정수 px 로 내려 1px 로 렌더된다(실측) → .4rem */
  background:var(--c-support-tint); border:.4rem solid var(--c-support);
  border-radius:1.6rem; padding:2.8rem 2.4rem;
}
.saybar .eyebrow{ font-size:2.2rem; font-weight:700; letter-spacing:.04em; color:var(--c-support); margin-bottom:1.2rem; }
.saybar p{ font-size:2.8rem; line-height:1.5; font-weight:700; color:var(--c-support); }

/* ── 캡처 플레이스홀더 ──────────────────────────── */
.capture{
  border:.2rem dashed var(--c-line-2); background:var(--c-surface);
  border-radius:1.6rem; height:12rem;
  display:flex; align-items:center; justify-content:center;
}
.capture span{ font-size:2rem; color:var(--c-ink-3); }

/* ── 체크 (현행 s08) ─────────────────────────────────── */
.checks{ display:flex; flex-direction:column; gap:2.4rem; }
.chk{ display:flex; align-items:center; gap:2.4rem; font-size:3.2rem; line-height:1.3; font-weight:700; }
.chk .ic{ color:var(--c-support); flex:none; }
.big-ok{ display:flex; align-items:center; justify-content:center; }
.big-ok .ic.big{ color:var(--c-support); opacity:.35; }

/* ── 지침 경로 pill — 현행 10장 체제 미사용(0회차 유래, 규칙만 보존) ─────────────────── */
.pill{
  display:inline-block; font-size:2.8rem; line-height:1.4; font-weight:700;
  background:var(--c-brand-tint); color:var(--c-brand);
  padding:1.2rem 2.4rem; border-radius:1.2rem;
}
.pill.b{ background:var(--c-support-tint); color:var(--c-support); }
/* .hi 카드(이미 brand-tint 바탕) 안에서는 pill 을 흰 바탕으로 — 대비 확보 */
.pill.w{ background:var(--c-surface); color:var(--c-brand); }
/* s14 — pill 두 개를 세로로 쌓는다(파일 이름도 본문 폰트 + pill 로만 표기) */
.pills{ display:flex; flex-direction:column; align-items:flex-start; gap:1.2rem; margin-top:2.4rem; }

/* ── 빈칸 템플릿 (s15) ──────────────────────────── */
.tmpl{ display:grid; grid-template-columns:1fr 1fr; gap:3.2rem; align-items:start; }
.tbox{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:2.8rem 3.2rem; box-shadow:var(--shadow);
}
.tbox.span2{ grid-column:2; grid-row:1 / span 2; }
.tbox h4{ font-size:2.8rem; font-weight:700; color:var(--c-brand); margin-bottom:1.6rem; }
.tbox p{ font-size:2.8rem; line-height:1.9; }
.tbox ul{ list-style:none; }
.tbox li{ font-size:2.8rem; line-height:1.7; padding-left:2.4rem; position:relative; }
/* 불릿은 폭이 좁은 가운뎃점으로 — em-dash는 본문에 붙어 보인다 */
.tbox li::before{ content:'\\2022'; position:absolute; left:.4rem; color:var(--c-ink-3); }
.blank{
  display:inline-block; width:16rem; height:2.8rem;
  border-bottom:.2rem solid var(--c-line-2); vertical-align:-.4rem;
}

/* ── QR 패널 (s15) ──────────────────────────────────
   세로 여유가 없어 QR을 아래로 못 쌓는다 → 템플릿을 3단으로 넓혀 오른쪽에 세운다.
   .tbox.span2 의 grid-row:1/span 2 를 그대로 두어야 3번 칸이 1행 높이를 밀지 않는다. */
.tmpl.wq{ grid-template-columns:1fr 1fr 30rem; }
/* 3번 칸과 QR 패널은 두 행을 채워 아랫변을 왼쪽 두 칸과 맞춘다(.tmpl 은 align-items:start) */
.tmpl.wq > .tbox.span2, .tmpl.wq > .qr{ align-self:stretch; }
.qr{
  grid-column:3; grid-row:1 / span 2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2.4rem; background:var(--c-brand-tint); border-radius:2rem; padding:2.4rem 2rem;
}
/* 흰 바탕 + 여백 — 프로젝터에서 주변 색이 QR의 여백(quiet zone)을 먹지 않게 한다 */
.qrimg{
  display:block; width:26rem; height:26rem;
  background:var(--c-surface); border-radius:1.2rem; padding:1.2rem;
}
.qr p{ font-size:2.4rem; line-height:1.4; font-weight:700; color:var(--c-brand); text-align:center; }

/* ── 지침 8줄 (s16 · 2026-07-28 신설) ───────────────
   붙여넣을 문안이라 한 글자도 줄일 수 없다 → 2단으로 나눠 한 장에 담는다.
   긴 1번과 6번만 두 단 폭(.rule.wide)으로 눕히고 나머지는 좌우로 짝짓는다.
   코드 블록 모티프는 금지라 본문 글꼴 그대로 쓰고,
   '한 덩어리'라는 건 머리말(.blockhd)과 번호 배지로만 알린다. */
.blockhd{ font-size:2.4rem; font-weight:700; letter-spacing:.02em; color:var(--c-brand); }
.rules{ display:grid; grid-template-columns:1fr 1fr; gap:1.2rem 4rem; align-content:start; }
/* 1번(끄는 목록)과 6번(3줄 요약)은 세 줄짜리라 두 단을 가로질러 눕힌다 */
.rule.wide{ grid-column:1 / -1; }
.rule{ display:flex; align-items:flex-start; gap:1.6rem; }
/* '이럴 땐 계획 없이 그냥 해라' — 과발동을 끄는 줄이라 색으로 갈라 보인다 */
.rule .off{ display:block; color:var(--c-support); font-weight:700; }
.rule .n{
  flex:none; width:3.6rem; height:3.6rem; border-radius:99rem;
  background:var(--c-brand-tint); color:var(--c-brand);
  font-size:2.2rem; font-weight:800; line-height:3.6rem; text-align:center;
}
.rule p{ font-size:2.2rem; line-height:1.5; }

/* ── 해설표 (s17 · s18 · 2026-07-28 신설) ───────────
   설명을 줄이지 않고(대표 지시) 4행씩 두 장으로 나눠 담는다.
   .tbl 기본값(3rem / 3.2rem 패딩·가운데 정렬)보다 촘촘하고 왼쪽 정렬이다. */
.tbl.gl th, .tbl.gl td{ font-size:2.4rem; line-height:1.5; padding:2rem 2.4rem; text-align:left; }
.tbl.gl th:first-child, .tbl.gl td:first-child{ width:34rem; padding-left:3.2rem; }
.tbl.gl .rowh{ padding-left:3.2rem; color:var(--c-ink); vertical-align:top; }
.tbl.gl b{ font-weight:700; color:var(--c-brand); }
/* 제목 뒤 회차 표시(1~4 / 5~8) — 제목과 같은 줄, 무게만 뺀다 */
.hnum{ font-weight:400; color:var(--c-ink-3); }

/* ── 말풍선 (s18) ───────────────────────────────── */
.talk{ display:flex; flex-direction:column; gap:2.4rem; }
.bubble{
  background:var(--c-surface); border:.1rem solid var(--c-line);
  border-radius:2rem; padding:2.8rem 4rem; box-shadow:var(--shadow); max-width:110rem;
}
.bubble.me{ background:var(--c-brand-tint); border-color:var(--c-brand-tint); align-self:flex-start; }
.bubble:not(.me){ align-self:flex-end; }
.bubble p{ font-size:3.2rem; line-height:1.4; font-weight:700; }

/* ── 과제 (현행 s09) ───────────────────────────────
   ⚠️ 이 CSS 블록들의 괄호 안 장 번호는 0회차에서 붙은 것이라
   1회차 장 번호와 어긋난다. 이 줄만 1회차 기준으로 고쳐 둔다. */
.task{
  display:flex; align-items:center; gap:4rem;
  background:var(--c-brand-tint); border-radius:2rem; padding:4.8rem 5.6rem;
}
.task .ic{ color:var(--c-brand); flex:none; }
.task p{ font-size:4rem; line-height:1.4; font-weight:700; }
/* .slim — 회고와 같은 장에 얹히는 s09 용. 띠 높이만 낮추고 활자는 그대로 둔다. */
.task.slim{ padding:3.2rem 5.6rem; }

/* ══ 진입 모션 ═══════════════════════════════════
   발표용 덱이라 힘은 '장이 뜰 때'에만 싣는다(호버는 부차).
   - html.anim 이 붙은 sNN.html 에서만 재생. index.html(썸네일)은 정지.
   - prefers-reduced-motion: reduce 에서는 규칙 자체가 적용되지 않는다.
   - fill-mode: backwards — 종료 후 원래 스타일로 복귀(= 정상 레이아웃). both 를 쓰면 종료 후에도 transform 이 채워져 :hover 가 죽는다(2026-07-27 실측).
   - 단계: 헤더 0s → 제목 .06s → 리드 .14s → 본문 블록 .24s부터, 항목 간 .06s.
     가장 늦은 시작이 .70s라 진입은 1.15s 안에 끝난다. */

@keyframes rise{
  from{ opacity:0; transform:translateY(1.6rem); }
  to{ opacity:1; transform:none; }
}
@keyframes pop{
  from{ opacity:0; transform:scale(.72); }
  to{ opacity:1; transform:none; }
}
@keyframes tint{
  from{ background:var(--c-surface); color:var(--c-ink); }
  to{ background:var(--c-brand-tint); color:var(--c-brand); }
}
@keyframes sweep{
  from{ transform:scaleX(0); }
  to{ transform:scaleX(1); }
}

/* 호버 — 마우스가 있는 기기에서만. reduced-motion 과 무관하게 유효하다
   (진입 애니는 fill-mode:backwards 라 종료 후 transform 을 비워두므로 여기서 덮이지 않는다). */
@media (hover:hover) and (pointer:fine){
  .card, .step, .layer, .tbox{ transition:transform .2s cubic-bezier(.22,.85,.3,1); }
  .card:hover, .step:hover, .layer:hover, .tbox:hover{ transform:translateY(-.3rem); }
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion: reduce){
  .card, .step, .layer, .tbox{ transition:none; }
}

@media (prefers-reduced-motion: no-preference){
  /* --db = 블록(본문 단) 지연, --ds = 블록 안 항목 stagger */
  .anim .slide{ --db:.24s; --ds:0s; }

  .anim .slide > .hd,
  .anim .slide > h1,
  .anim .slide > .lead,
  .anim .cover h1,
  .anim .cover .sub,
  .anim .cover .foot,
  .anim .cover .tmfoot,
  .anim .body > p,
  .anim .body > .ask,
  .anim .body > .task,
  .anim .body > .oneline,
  .anim .body > .capture,
  .anim .cards > .card,
  .anim .cards > .frame,
  .anim .flow > *,
  .anim .stack > .layer,
  .anim .steps > .step,
  .anim .plan > .pstep,
  .anim .paths > .prow,
  .anim .quotes > .quote,
  .anim .tmpl > .tbox,
  .anim .tmpl > .qr,
  .anim .rules > .rule,
  .anim .talk > .bubble,
  .anim .checks > .chk,
  .anim .row > .big-ok,
  .anim .tbl tr{
    animation:rise .44s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + var(--ds));
  }

  /* 고정 단계 — 헤더 · 제목 · 리드 · 표지 */
  .anim .slide > .hd{ animation-delay:0s; }
  .anim .slide > h1{ animation-delay:.06s; }
  .anim .slide > .lead{ animation-delay:.14s; }
  .anim .cover h1{ animation-delay:.06s; }
  .anim .cover .sub{ animation-delay:.20s; }
  .anim .cover .foot{ animation-delay:.38s; }
  .anim .cover .tmfoot{ animation-delay:.70s; }

  /* 표지 일러스트 — 제목·부제 다음에 셋이 차례로 등장한다(.32s → .48s).
     SVG <g>의 scale 은 fill-box 기준이 아니면 원점이 뷰박스 좌상단이라 튄다. */
  .anim .trio-svg .m{
    transform-box:fill-box; transform-origin:50% 100%;
    animation:pop .5s cubic-bezier(.34,1.4,.64,1) backwards;
  }
  .anim .trio-svg .m1{ animation-delay:.32s; }
  .anim .trio-svg .m2{ animation-delay:.40s; }
  .anim .trio-svg .m3{ animation-delay:.48s; }
  .anim .trio-svg .m0{ animation-name:rise; animation-delay:.60s; }

  /* s05 로고 — 카드가 올라온 뒤(.18s) 제자리에서 살짝 커지며 든다.
     카드의 --db/--ds 를 그대로 물려받아 좌→우 순서가 카드와 어긋나지 않는다.
     로고는 HTML 요소라 transform-origin 기본값(50% 50%)이 그대로 맞는다. */
  .anim .cards > .card .logo .lg{
    animation:pop .42s cubic-bezier(.34,1.4,.64,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .18s);
  }

  /* 본문 단(段) 순서 */
  .anim .body > *:nth-child(1){ --db:.24s; }
  .anim .body > *:nth-child(2){ --db:.52s; }
  .anim .body > *:nth-child(3){ --db:.66s; }
  .anim .body > *:nth-child(4){ --db:.78s; }

  /* 블록 안 항목 stagger */
  .anim .cards > *, .anim .stack > *, .anim .steps > *, .anim .quotes > *,
  .anim .tmpl > *, .anim .talk > *, .anim .checks > *, .anim .tbl tr,
  .anim .rules > *{ --ds:0s; }
  .anim .cards > *:nth-child(2), .anim .stack > *:nth-child(2),
  .anim .steps > *:nth-child(2), .anim .quotes > *:nth-child(2),
  .anim .tmpl > *:nth-child(2), .anim .talk > *:nth-child(2),
  .anim .checks > *:nth-child(2), .anim .tbl tr:nth-child(2),
  .anim .rules > *:nth-child(2){ --ds:.06s; }
  .anim .cards > *:nth-child(3), .anim .stack > *:nth-child(3),
  .anim .steps > *:nth-child(3), .anim .tmpl > *:nth-child(3),
  .anim .checks > *:nth-child(3), .anim .tbl tr:nth-child(3),
  .anim .rules > *:nth-child(3){ --ds:.12s; }
  .anim .cards > *:nth-child(4), .anim .steps > *:nth-child(4),
  .anim .tmpl > *:nth-child(4), .anim .rules > *:nth-child(4){ --ds:.18s; }
  /* 지침 8줄(s16)만 항목이 5개를 넘는다 → 5~8번까지 이어서 정의한다.
     없으면 --ds 가 0으로 떨어져 5~8번이 2~4번보다 먼저 뜬다(2026-07-28 실측). */
  .anim .rules > *:nth-child(5){ --ds:.24s; }
  .anim .rules > *:nth-child(6){ --ds:.30s; }
  .anim .rules > *:nth-child(7){ --ds:.36s; }
  .anim .rules > *:nth-child(8){ --ds:.42s; }

  /* .flow(현행 s07) — 좌 → 화살표 → 가운데 → 화살표 → 우 순서로 흐르게 한다.
     기존 stagger 목록에 얹지 않고 따로 적어, 다른 블록의 --ds 값을 건드리지 않는다. */
  .anim .flow > *{ --ds:0s; }
  .anim .flow > *:nth-child(2){ --ds:.06s; }
  .anim .flow > *:nth-child(3){ --ds:.12s; }
  .anim .flow > *:nth-child(4){ --ds:.18s; }
  .anim .flow > *:nth-child(5){ --ds:.24s; }

  /* .plan(s04·s06) · .paths(s02) — 위에서 아래로 한 줄씩 */
  .anim .plan > *, .anim .paths > *{ --ds:0s; }
  .anim .plan > *:nth-child(2), .anim .paths > *:nth-child(2){ --ds:.06s; }
  .anim .plan > *:nth-child(3){ --ds:.12s; }
  .anim .plan > *:nth-child(4){ --ds:.18s; }

  /* 강조 1개만 특별대우 — 대비 카드의 '되는 쪽'은 살짝 늦게 */
  .anim .cards > .card.hi{ --ds:.16s; }
  /* .seq — 강조 카드가 '왼쪽'인 장(현행 s08)에서는 위 특별대우를 끄고 좌→우 순서를 지킨다 */
  .anim .cards.seq > .card.hi{ --ds:0s; }

  /* s06 표 — 행이 다 들어온 뒤 가운데 칸이 점등 */
  .anim .tbl .hi{
    animation:tint .4s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + .38s);
  }

  /* 현행 s08 체크 — 체크 표시가 하나씩 켜지고, 큰 체크가 마지막에 */
  .anim .chk > .ic{
    animation:pop .4s cubic-bezier(.34,1.4,.64,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .10s);
  }
  .anim .row > .big-ok{ --ds:.24s; animation-name:pop; }

  /* s15 빈칸 — 밑줄이 왼쪽에서 그어진다 */
  .anim .blank{
    transform-origin:0 50%;
    animation:sweep .5s cubic-bezier(.22,.85,.3,1) backwards;
    animation-delay:calc(var(--db) + var(--ds) + .18s);
  }

  /* 부차 — 호버(발표 중엔 거의 안 쓰이지만 열람 시 반응) */
  .anim .card, .anim .step, .anim .layer, .anim .tbox{ transition:transform .18s ease-out; }
  /* 호버는 아래 블록(무모션 환경에서도 유효)으로 분리 — 발표 중엔 안 쓰지만 검토 시 유효 */
}

/* 인쇄·PDF는 최종 상태로 고정 */
@media print{
  .anim *{ animation:none !important; transition:none !important; }
}

/* ── 전체 미리보기 (index.html) ─────────────────── */
body.preview{ display:block; padding:6.4rem; background:var(--c-shell); }
.preview .ph{ font-size:4rem; font-weight:800; margin-bottom:1.2rem; }
.preview .psub{ font-size:2rem; color:var(--c-ink-2); margin-bottom:4rem; }
/* 썸네일 1열 = 32rem(320px) 고정, gap 4rem — 화면 폭에 맞춰 열 수를 자동으로 줄인다
   (auto-fill). 1600px 이상이면 4열, 좁아지면 3→2→1열로 줄어 가로 스크롤 없이 표시된다.
   썸네일 크기 자체(32rem×18rem)는 고정 — 안쪽 .slide{transform:scale(.2)}가 어긋나므로 바꾸지 말 것. */
.preview .grid{ display:grid; grid-template-columns:repeat(auto-fill,32rem); gap:4rem; justify-content:center; }
.thumb{ display:block; text-decoration:none; color:inherit; }
.thumb .shot{
  width:32rem; height:18rem; overflow:hidden;
  border:.1rem solid var(--c-line-2); border-radius:1.2rem; background:var(--c-bg);
}
.thumb .shot .slide{ transform:scale(.2); transform-origin:0 0; }
.thumb .lbl{ font-size:1.8rem; font-weight:700; color:var(--c-ink-2); margin-top:1.2rem; }
/* 좁은 화면(모바일)에서는 좌우 여백(6.4rem=64px)만으로도 32rem(320px) 썸네일 1열이
   안 들어가는 폭이 있어(≤448px) 본문 여백을 줄인다. 썸네일 크기 자체는 그대로 둔다. */
@media (max-width:500px){
  body.preview{ padding:2rem; }
}
