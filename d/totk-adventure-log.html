const koreanGuides={'괴물에 탄 공주':'① 신마리타 마구간에서 펜에게 말을 겁니다. ② 쌍둥이 마구간 등에서 남쪽 열대우림의 거대한 생물 소문을 모읍니다. ③ 레이크 사이드 마구간으로 이동합니다. ④ 마구간 앞 샤이에게 동고 이야기를 듣습니다. ⑤ 건너편 동고에게 가서 사육사 시미너와 대화하면 완료됩니다.','진실을 밝혀라! 젤다 공주의 소문!!':'토끼풀 신문사에서 펜에게 말을 건 뒤 각지의 마구간 소문을 조사합니다. 12개 연계 퀘스트를 끝내면 개구리 장비를 얻습니다.','대발명! 워프 마커!!':'하테노 고대 연구소에서 로비의 연구를 진행한 뒤 아칼라 고대 연구소에서 시제품을 회수해 돌아옵니다.','대발명! 발자국 모드':'하테노 고대 연구소에서 로비에게 말을 걸고 연구 조건을 충족하면 지나온 길을 볼 수 있습니다.','대발명! 도감 센서':'하테노 고대 연구소에서 로비에게 도감 생물 사진을 제출하면 센서가 해금됩니다.','보쿠린의 고민':'감시 요새 근처의 보쿠린에게 말을 걸고 나무를 위협하는 적을 처리하면 주머니 확장이 열립니다.','악마와의 계약':'감시 요새 피난소의 악마상과 대화한 뒤 하트와 스태미나를 바꾸는 거래를 진행합니다.','우오토리 마을 재건 계획':'우오토리 마을의 로젤에게 말을 걸고 필요한 재료를 모아 마을 시설을 복구합니다.','이가단에 잠입':'이가단 장비를 입고 이가단 아지트에 들어가 구성원에게 말을 겁니다.','이가단 간부 시험':'이가단 아지트에서 시험을 받고 지정된 장소를 조사합니다.','고대에서 온 메시지':'하이랄 곳곳의 석판을 조사해 조나우 문명의 기록을 모읍니다.','지저에서 부르는 목소리':'지저의 네 여신상을 찾아 복구하면 보상이 이어집니다.'};

document.querySelector('.tabs').insertAdjacentHTML('afterbegin','<button data-view="minis">미니 <span id="mini-count"></span></button>');
const state={view:'quests',filter:'전체',search:'',done:JSON.parse(localStorage.getItem('totk-done')||'[]')},all=()=>[...quests,...episodes,...minis,...gear,...tips];
const save=()=>localStorage.setItem('totk-done',JSON.stringify(state.done));function toggle(id){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render()}
function stats(){let d=state.done.filter(id=>id[0]==='q'||id[0]==='g').length;document.querySelector('#stats').innerHTML=`<div class="stat"><strong>${d}</strong><span>내가 완료한 기록</span></div><div class="stat"><strong>${quests.length+gear.length-d}</strong><span>아직 남은 기록</span></div><div class="stat"><strong>${gear.length}</strong><span>장비 도감</span></div><div class="stat"><strong>${tips.length}</strong><span>꿀팁 카드</span></div>`}
function filters(data){let v=['전체',...new Set(data.map(x=>x.type))];document.querySelector('#filters').innerHTML=v.map(x=>`<button class="filter ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}
function card(x){let d=state.done.includes(x.id),g=x.id[0]==='g';return `<article class="card ${g?'gear':''}">${g?`<div class="visual">${x.icon}</div>`:''}<div><div class="top"><span class="tag">${x.type}</span>${x.id[0]==='t'?`<b style="color:var(--gold)">${x.id.slice(1).padStart(2,'0')}</b>`:''}</div><h3>${x.name}</h3><p>${x.guide||x.desc}</p>${x.start?`<div class="location">시작 · ${x.start}</div><div class="location">완료 · ${x.completion}</div><div class="location">보상 · ${x.reward}</div>`:`<div class="location">⌖ ${x.area}</div>`}${x.coord?`<div class="map"><span class="pin"></span><span class="coord">${x.coord}</span></div>`:''}</div><div class="card-bottom"><a class="source" href="${x.source}" target="_blank" rel="noreferrer">원문 보기 ↗</a>${x.id[0]!=='t'?`<button class="check ${d?'done':''}" data-id="${x.id}">${d?'✓ 완료됨':'완료 체크'}</button>`:''}</div></article>`}
function render(){stats();let data=state.view==='quests'?quests:state.view==='episodes'?episodes:state.view==='minis'?minis:state.view==='gear'?gear:state.view==='tips'?tips:all().filter(x=>state.done.includes(x.id));filters(data);let shown=data.filter(x=>(state.filter==='전체'||x.type===state.filter)&&`${x.name}${x.area}${x.start||''}${x.desc}${x.completion||''}${x.reward||''}`.toLowerCase().includes(state.search.toLowerCase()));document.querySelector('#content').innerHTML=shown.length?`<div class="grid">${shown.map(card).join('')}</div>`:'<div class="empty">아직 모아 둔 기록이 없어요.<br>완료 체크를 누르면 이곳에 담깁니다.</div>';document.querySelector('#quest-count').textContent=quests.filter(x=>!state.done.includes(x.id)).length;document.querySelector('#episode-count').textContent=episodes.filter(x=>!state.done.includes(x.id)).length;document.querySelector('#mini-count').textContent=minis.filter(x=>!state.done.includes(x.id)).length;document.querySelector('#gear-count').textContent=gear.filter(x=>!state.done.includes(x.id)).length;document.querySelectorAll('.check').forEach(b=>b.onclick=()=>toggle(b.dataset.id));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.view=b.dataset.view;state.filter='전체';render()});document.querySelector('#search').oninput=e=>{state.search=e.target.value;render()};render();
</script></body></html>
