let gearSeq=0;
function addGearRows(type,base,raw){
  const d=gearDefaults[type];
  raw.trim().split('\n').filter(Boolean).forEach(line=>{
    const [catalogId,name,rowArea,rowCoord,...details]=line.split('|');
    if(details[0]==='')details.shift();
    const [rowObtain,rowMaterials]=details;
    const special=gearSpecial[catalogId]||{};
    const obtain=special.obtain||rowObtain||d.obtain;
    const materials=special.materials!==undefined?special.materials:(rowMaterials?rowMaterials.split('·'):null);
    gear.push({id:`g${++gearSeq}`,catalogId,name,type,area:special.area||rowArea||d.area,icon:d.icon,desc:obtain,obtain,coord:rowCoord||null,materials,image_url:null,source:`${base}${catalogId}`});
  });
}

{id:'e18',name:'괴물에 탄 공주',type:'에피소드 챌린지',area:'신마리타 마구간',start:'펜 · 신마리타 마구간',guide:'① 신마리타 마구간에서 펜에게 젤다 공주가 거대한 괴물을 탔다는 소문을 듣습니다. ② 남쪽 열대우림에 단서가 있다는 말을 따라 레이크 사이드 마구간으로 이동합니다. ③ 마구간의 샤이에게 강 건너 동고 사육장 이야기를 듣습니다. ④ 포플러 고지 조망대에서 남동쪽으로 날거나 강을 건너 브로나스 숲의 동고 사육장으로 갑니다. ⑤ 사육사 시미너와 대화해 동고가 젤다 공주가 발견한 온순한 신종 생물임을 확인하면 펜이 나타나고 완료됩니다.',desc:'신마리타 마구간에서 시작해 브로나스 숲의 동고 사육장에서 소문의 진실을 확인합니다.',completion:'시미너·펜 · 브로나스 숲 동고 사육장',reward:'신문사 조사 완료 순번에 따른 보상',coord:null,source:'https://zelda.kiranico.com/ko/totk/data/quests/Tribune06'},
{id:'e19',name:'젤다가 사랑한 황금마',type:'에피소드 챌린지',area:'설원의 마구간',start:'펜 · 설원의 마구간',desc:'할로에게 사정을 듣고 북쪽 설원에서 황금마를 찾아 길들입니다. 빙설 그리오크를 피해 마구간까지 데려옵니다.',completion:'할로 · 설원의 마구간',reward:'황금마, 왕가의 고삐·안장, 신문사 순번 보상',coord:null,source:'https://zelda.kiranico.com/ko/totk/data/quests/Tribune09'},

{id:'e21',name:'마이 스위트 프린세스',type:'에피소드 챌린지',area:'산기슭의 마구간',start:'펜 · 산기슭의 마구간',guide:'① 산기슭의 마구간에서 펜과 대화해 맨몸으로 활동하는 조나우 조사대 이야기를 듣습니다. ② 마구간 북쪽 길을 따라 산기슭의 마물 동굴 입구로 가서 조사대와 대화합니다. ③ 방어구뿐 아니라 가지고 있던 무기, 활, 방패를 모두 맡기고 동굴에 들어갑니다. ④ 동굴 안에 놓인 나무 막대와 돌을 스크래빌드하고, 주변 소재와 적이 떨어뜨린 장비를 이용해 모든 몬스터를 처치합니다. ⑤ 입구 조사대에게 보고한 뒤 산기슭의 마구간으로 돌아가 펜과 대화하면 젤다의 지시가 잘못 전달됐다는 사실이 밝혀지며 완료됩니다.',desc:'장비 없이 마물 동굴을 돌파한 뒤 산기슭의 마구간에서 오해를 풉니다.',completion:'펜 · 산기슭의 마구간',reward:'신문사 조사 완료 순번에 따른 보상',coord:null,source:'https://zelda.kiranico.com/ko/totk/data/quests/Tribune11'},
{id:'e22',name:'꼬꼬님의 뜻대로',type:'에피소드 챌린지',area:'남추낙 마구간',start:'펜 · 남추낙 마구간',desc:'마구간 뒤 언덕의 꼬꼬와 대화하고 운반·시간제한 시련을 끝냅니다. 정체를 드러낸 이가단을 처치하고 펜에게 보고합니다.',completion:'펜 · 남추낙 마구간',reward:'신문사 조사 완료 순번에 따른 보상',coord:null,source:'https://zelda.kiranico.com/ko/totk/data/quests/Tribune10'},

{id:'e24',name:'젤다 공주 납치 사건?!',type:'에피소드 챌린지',area:'쌍둥이 마구간',start:'펜 · 쌍둥이 마구간 지붕의 말 조형물 위',guide:'① 쌍둥이 마구간 안이 아니라 지붕 위 말 조형물에 있는 펜에게 말을 겁니다. ② 성명문의 “쌍둥이산 깊은 골짜기”라는 말을 듣습니다. ③ 강바닥이 아니라 남쪽 쌍둥이산 정상 가까이로 갑니다. ④ 벽의 튀어나온 유적을 트레루프로 올라가 철창을 찾습니다. ⑤ 철창 안의 가짜 젤다에게 말을 걸고 울트라핸드로 철창을 들어 올립니다. ⑥ 나타난 이가단 3명을 처치하면 펜이 날아옵니다. 펜에게 보고하면 완료됩니다.',desc:'펜은 지붕 위에 있습니다. 남쪽 산 정상 가까이의 철창을 열면 이가단과 싸우게 됩니다.',completion:'펜 · 쌍둥이 마구간',reward:'신문사 조사 완료 순번에 따른 보상',coord:'1343, -1854, 0337',source:'https://zelda.kiranico.com/ko/totk/data/quests/Tribune02'},

  'All\'s Well':'우물 순례 기념품','Jewelry Shop':'보석상','Mother Goddess Statue':'어머니 여신상','Goddess Statue':'여신상','Mining Construct':'채굴 골렘','Mysterious Voice':'수수께끼의 목소리',
  'Spirit Temple':'영혼의 신전','Forgotten Temple':'잊혀진 신전','Temple of Time':'시간의 신전','Shrine of Light':'파마의 사당',
  'Spring of Wisdom':'지혜의 샘','Spring of Power':'힘의 샘','Spring of Courage':'용기의 샘','Hyrule Castle Sanctum':'하이랄 성 본관',
  'Rito Rope Bridge':'리토의 밧줄 다리','Selmie’s Spot':'셀미의 집','Selmie\'s Spot':'셀미의 집','Flight Range':'비행 훈련장',
  'Rito Village':'리토의 마을','Korok Forest':'코로그의 숲','Goron City':'고론 시티','Zora’s Domain':'조라의 마을','Zora\'s Domain':'조라의 마을',
  'Gerudo Shelter':'겔드의 지하 거리','Gerudo Town':'겔드의 마을','Kara Kara Bazaar':'카라카라 바자르','Gerudo Canyon Pass':'겔드 캐니언 통로','Gerudo Canyon':'겔드 캐니언',
  'Kakariko Village':'카카리코 마을','Hateno Village':'하테노 마을','Lurelin Village':'나크시 마을','Eventide Island':'사이하테노섬','Hateno Beach':'하테노 해변',
  'Hebra Mountains':'헤브라산맥','Tabantha Frontier':'타반타 변두리','Bedrock Bistro':'암반 레스토랑','Southern Mine':'남쪽 채굴장',
  'Eldin Great Skeleton':'올딘의 대화석','Hebra Great Skeleton':'헤브라의 대화석','Gerudo Great Skeleton':'겔드의 대화석','East Reservoir Lake':'동쪽 저수지',
  'Gerudo Canyon 기둥':'겔드 캐니언 기둥','Northern Icehouse':'북쪽 얼음 창고','Hateno School':'하테노 학교','Lurelin Water Rally':'나크시 수상 랠리',
  'Cephla Lake Cave':'세플라호의 동굴','Goronbi River Cave':'고론비강의 동굴','Ancient Columns Cave':'고대 돌기둥군의 동굴','Coliseum Ruins Cave':'투기장 옛터의 동굴',
  'Mapla Point Cave':'마푸라 곶 동굴','Tarm Point Cave':'타름 곶 동굴','Rebonae Bridge Well':'레보나 다리의 우물','Rikoka Hills Well':'리코나 반도의 우물',
  'Tabantha Village Ruins':'타반타 마을 옛터','Rauru Hillside':'라울 구릉','Hateno School':'하테노 학교','Death Mountain':'데스마운틴','N/A':'미확인'
};
const koreanEntries=Object.entries(koreanTerms).sort((a,b)=>b[0].length-a[0].length);
function translateKnown(value){
  if(value==null)return null;
  let text=String(value);
  koreanEntries.forEach(([from,to])=>{text=text.split(from).join(to)});
  return text;
}
function markUnverifiedNames(value){
  const text=translateKnown(value);
  return text==null?null:text.replace(/[A-Za-z][A-Za-z’']*(?: [A-Za-z][A-Za-z’']*)*/g,name=>`원문명(${name})`);
}
function translateReward(value){
  const text=translateKnown(value);
  if(!text||text==='미확인')return null;
  return /[A-Za-z]/.test(text)?null:text.replace(/\s*x\s*(\d+)/g,' $1개').replace(/×\s*(\d+)/g,' $1개').replace(/,\s*/g,' · ');
}
function makeGuide(item){
  const action=(item.guide?markUnverifiedNames(item.guide):item.desc)||'원문에 구체적인 행동 순서가 없습니다.';
  return `시작 위치: ${item.start||item.area||'원문 미제공'}<br>행동 순서: ${action}<br>완료 위치: ${item.completion||item.area||'원문 미제공'}<br>보상: ${item.reward||'확인된 보상 없음'}`;
}
[...quests,...episodes,...minis].forEach(item=>{
  item.area=markUnverifiedNames(item.area);
  item.start=markUnverifiedNames(item.start);
  item.completion=markUnverifiedNames(item.completion);
  item.reward=translateReward(item.reward);
  item.desc=markUnverifiedNames(item.desc);
  item.guide=makeGuide(item);
});
gear.forEach(item=>{
  item.area=markUnverifiedNames(item.area);
  item.obtain=markUnverifiedNames(item.obtain);
  item.materials=Array.isArray(item.materials)?item.materials.map(markUnverifiedNames):null;
  const materialText=item.materials?.length?item.materials.join(' · '):'원문에 별도 재료 없음';
  item.desc=`획득 방법: ${item.obtain}\n장소: ${item.area}\n좌표: ${item.coord||'원문 미제공'}\n필요 재료: ${materialText}`;
});
const stableCleared=['e16','e18','e19','e21','e22','e23','e25'];
const savedDone=JSON.parse(localStorage.getItem('totk-done')||'[]');
const state={view:'quests',filter:'전체',search:'',done:[...new Set([...savedDone,...stableCleared])]},all=()=>[...quests,...episodes,...minis,...gear,...tips];
const save=()=>localStorage.setItem('totk-done',JSON.stringify(state.done));function toggle(id){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render()}
function stats(){let d=state.done.length;document.querySelector('#stats').innerHTML=`<div class="stat"><strong>${d}</strong><span>내가 완료한 기록</span></div><div class="stat"><strong>${quests.length+episodes.length+minis.length+gear.length-d}</strong><span>아직 남은 기록</span></div><div class="stat"><strong>${gear.length}</strong><span>장비 도감</span></div><div class="stat"><strong>${tips.length}</strong><span>꿀팁 카드</span></div>`}
function filters(data){let v=['전체',...new Set(data.map(x=>x.type))];document.querySelector('#filters').innerHTML=v.map(x=>`<button class="filter ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}
function direction(c){const p=String(c).split(',').map(Number);if(p.length<2||p.some(Number.isNaN))return '';return `하이랄 전체 기준 ${p[0]>=0?'동쪽':'서쪽'} · ${p[1]>=0?'북쪽':'남쪽'}`}
function card(x){let d=state.done.includes(x.id),g=x.id[0]==='g';return `<article class="card ${g?'gear':''}" data-card-id="${x.id}" tabindex="0" role="button" aria-label="${x.name} 공략 열기">${g?`<div class="visual">${x.icon}</div>`:''}<div><div class="top"><span class="tag">${x.type}</span>${x.id[0]==='t'?`<b style="color:var(--gold)">${x.id.slice(1).padStart(2,'0')}</b>`:''}</div><h3>${x.name}</h3><p><strong>${g?'획득 방법':'공략'}</strong><br>${x.guide||x.desc}</p>${x.start?`<div class="location">시작 · ${x.start}</div><div class="location">완료 · ${x.completion}</div><div class="location">보상 · ${x.reward}</div>`:`<div class="location">⌖ ${x.area}</div>`}${x.coord?`<div class="location">방향 · ${direction(x.coord)}</div><div class="map"><span class="pin"></span><span class="coord">${x.coord}</span></div>`:''}</div><div class="card-bottom"><a class="source" href="${x.source}" target="_blank" rel="noreferrer">원문 보기 ↗</a>${x.id[0]!=='t'?`<button class="check ${d?'done':''}" data-id="${x.id}">${d?'✓ 완료됨':'완료 체크'}</button>`:''}</div></article>`}
const guideModal=document.createElement('div');guideModal.id='guide-modal';guideModal.hidden=true;document.body.appendChild(guideModal);
function openGuide(id){const x=all().find(item=>item.id===id);if(!x)return;const g=x.id[0]==='g';guideModal.innerHTML=`<div class="modal-backdrop" data-close="1"></div><section class="guide-dialog" role="dialog" aria-modal="true" aria-labelledby="guide-title"><button class="modal-close" aria-label="공략 닫기">×</button><div class="modal-kicker">${x.type} · ${x.area||'하이랄 전역'}</div><h2 id="guide-title">${x.name}</h2><div class="guide-layout"><div><h3>${g?'획득 방법':'공략 순서'}</h3><p class="guide-copy">${x.guide||x.desc||'확인된 한국어 공략이 없습니다.'}</p></div><div class="guide-facts">${x.start?`<div><small>시작</small><strong>${x.start}</strong></div>`:''}${x.completion?`<div><small>완료</small><strong>${x.completion}</strong></div>`:''}${x.reward?`<div><small>보상</small><strong>${x.reward}</strong></div>`:''}${x.materials?`<div><small>필요 재료</small><strong>${Array.isArray(x.materials)?x.materials.join(' · '):x.materials}</strong></div>`:''}${x.coord?`<div><small>좌표 · 방향</small><strong>${x.coord} · ${direction(x.coord)}</strong></div>`:''}</div></div><a class="modal-source" href="${x.source}" target="_blank" rel="noreferrer">원문도 확인하기 ↗</a></section>`;guideModal.hidden=false;document.body.classList.add('modal-open');guideModal.querySelector('.modal-close').focus();guideModal.querySelector('.modal-close').onclick=closeGuide;guideModal.querySelector('[data-close]').onclick=closeGuide}
function closeGuide(){guideModal.hidden=true;document.body.classList.remove('modal-open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!guideModal.hidden)closeGuide()});
function render(){stats();let data=state.view==='quests'?quests:state.view==='episodes'?episodes:state.view==='minis'?minis:state.view==='gear'?gear:state.view==='tips'?tips:all().filter(x=>state.done.includes(x.id));filters(data);let shown=data.filter(x=>state.view==='claimed'||!state.done.includes(x.id)).filter(x=>(state.filter==='전체'||x.type===state.filter)&&`${x.name}${x.area}${x.start||''}${x.desc}${x.completion||''}${x.reward||''}${x.coord||''}`.toLowerCase().includes(state.search.toLowerCase()));document.querySelector('#content').innerHTML=shown.length?`<div class="grid">${shown.map(card).join('')}</div>`:'<div class="empty">아직 모아 둔 기록이 없어요.<br>완료 체크를 누르면 이곳에 담깁니다.</div>';document.querySelector('#quest-count').textContent=quests.filter(x=>!state.done.includes(x.id)).length;document.querySelector('#episode-count').textContent=episodes.filter(x=>!state.done.includes(x.id)).length;document.querySelector('#mini-count').textContent=minis.filter(x=>!state.done.includes(x.id)).length;document.querySelector('#gear-count').textContent=gear.filter(x=>!state.done.includes(x.id)).length;document.querySelectorAll('.card').forEach(c=>{c.onclick=()=>openGuide(c.dataset.cardId);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGuide(c.dataset.cardId)}}});document.querySelectorAll('.check').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.id)});document.querySelectorAll('.source').forEach(a=>a.onclick=e=>e.stopPropagation());document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.view=b.dataset.view;state.filter='전체';render()});document.querySelector('#search').oninput=e=>{state.search=e.target.value;render()};render();
</script></body></html>
