:'▣',desc:'섬의 보물상자에서 얻습니다.',coord:'2374, -1774, 1490',source:'https://www.zeldadungeon.net/wiki/Zonaite_Set'},{id:'g18',name:'조나니움 무릎 보호대',type:'방어구',area:'스카이 광산',icon:'▣',desc:'섬의 보물상자에서 얻습니다.',coord:'4468, 2026, 1414',source:'https://www.zeldadungeon.net/wiki/Zonaite_Set'},{id:'g19',name:'조라의 투구',type:'방어구',area:'비늘섬',icon:'◇',desc:'보물상자에서 얻습니다.',coord:'4094, 0529, 0587',source:'https://www.zeldadungeon.net/wiki/Zora_Set'},{id:'g20',name:'조라의 갑옷',type:'방어구',area:'조라의 마을',icon:'◇',desc:'조라의 갑옷 복원 퀘스트 보상입니다.',coord:'3321, 0548, 0151',source:'https://www.zeldadungeon.net/wiki/Zora_Set'},{id:'g21',name:'조라의 경갑',type:'방어구',area:'고대 조라 수로',icon:'◇',desc:'우정의 증표 퀘스트 후 상자에서 얻습니다.',coord:'3585, 0247, -0103',source:'https://www.zeldadungeon.net/wiki/Zora_Set'},{id:'g22',name:'하일리아의 방패',type:'방패',area:'하이랄 성 부두',icon:'⬡',desc:'봉화에 불을 붙인 뒤 보물상자를 엽니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Hylian_Shield'},{id:'g23',name:'칠보의 시미터',type:'한손검',area:'겔드의 마을',icon:'⚔',desc:'겔드 시미터·방패와 다이아몬드 4개, 부싯돌 10개가 필요합니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Scimitar_of_the_Seven'},{id:'g24',name:'칠보의 방패',type:'방패',area:'겔드의 마을',icon:'⬡',desc:'칠보의 시미터와 함께 제작합니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Daybreaker'},{id:'g25',name:'광린의 창',type:'창',area:'조라의 마을',icon:'⚔',desc:'조라의 창·다이아몬드 3개·부싯돌 5개가 필요합니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Lightscale_Trident'},{id:'g26',name:'돌 크러셔',type:'양손무기',area:'고론 시티',icon:'⚔',desc:'돌 크러셔·다이아몬드 3개·부싯돌 5개가 필요합니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Boulder_Breaker'},{id:'g27',name:'패러세일',type:'이동 도구',area:'감시 요새',icon:'⌁',desc:'성 조사 후 프루아에게 받습니다.',coord:'-0299, 0143, 0019',source:'https://www.zeldadungeon.net/wiki/Lookout_Landing_Skyview_Tower'},{id:'g28',name:'현자의 맹약: 윤돌',type:'맹약',area:'화염의 신전',icon:'✦',desc:'마블드 고마를 쓰러뜨리면 얻습니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Vow_of_Yunobo,_Sage_of_Fire'});
gear.push({id:'g29',name:'마조라의 가면',type:'방어구',area:'부유 콜로세움',icon:'☻',desc:'어둠의 라이넬 5마리를 연속으로 쓰러뜨리면 얻습니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Majora%27s_Mask'},{id:'g30',name:'빅고론의 검',type:'양손검',area:'아칼라의 뼈무덤',icon:'⚔',desc:'해골 적과 스탈녹스를 쓰러뜨린 뒤 상자를 엽니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Biggoron%27s_Sword'},{id:'g31',name:'귀신의 검',type:'양손검',area:'세플라 호수 동굴',icon:'⚔',desc:'귀신의 방어구 세트를 모두 입고 동굴로 돌아가세요.',coord:null,source:'https://www.zeldadungeon.net/wiki/Fierce_Deity_Set'},{id:'g32',name:'카메라',type:'기능',area:'지저 이아유수스 근처',icon:'◎',desc:'지저에서 로비와 대화하면 프루아패드에 추가됩니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Camera_Work_in_the_Depths'},{id:'g33',name:'트래블 메달리온',type:'기능',area:'아칼라 고대 연구소',icon:'⌁',desc:'로비의 연구소 시제품을 회수해 전달하세요.',coord:null,source:'https://www.zeldadungeon.net/wiki/Presenting:_The_Travel_Medallion!'},{id:'g34',name:'지저 돌파 매뉴얼',type:'기능',area:'이가단 아지트',icon:'▤',desc:'이가 세트를 입고 훈련 2단계를 1분 안에 끝내세요.',coord:null,source:'https://www.zeldadungeon.net/wiki/Earthwake_Manual'},{id:'g35',name:'에너지 셀',type:'동력 장치',area:'대하늘섬',icon:'▣',desc:'이니사 사당 뒤 스튜어드 컨스트럭트에게 받습니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Energy_Cell'},{id:'g36',name:'현자의 의지',type:'수집품',area:'하늘섬 여러 곳',icon:'✦',desc:'하늘섬 보물상자에서 총 20개를 모읍니다.',coord:null,source:'https://www.zeldadungeon.net/wiki/Sage%27s_Will'});
const state={view:'quests',filter:'전체',search:'',done:JSON.parse(localStorage.getItem('totk-done')||'[]')},all=()=>[...quests,...gear,...tips];
const save=()=>localStorage.setItem('totk-done',JSON.stringify(state.done));function toggle(id){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render()}
function stats(){let d=state.done.filter(id=>id[0]==='q'||id[0]==='g').length;document.querySelector('#stats').innerHTML=`<div class="stat"><strong>${d}</strong><span>내가 완료한 기록</span></div><div class="stat"><strong>${quests.length+gear.length-d}</strong><span>아직 남은 기록</span></div><div class="stat"><strong>${gear.length}</strong><span>장비 도감</span></div><div class="stat"><strong>${tips.length}</strong><span>꿀팁 카드</span></div>`}
function filters(data){let v=['전체',...new Set(data.map(x=>x.type))];document.querySelector('#filters').innerHTML=v.map(x=>`<button class="filter ${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}
function card(x){let d=state.done.includes(x.id),g=x.id[0]==='g';return `<article class="card ${g?'gear':''}">${g?`<div class="visual">${x.icon}</div>`:''}<div><div class="top"><span class="tag">${x.type}</span>${x.id[0]==='t'?`<b style="color:var(--gold)">${x.id.slice(1).padStart(2,'0')}</b>`:''}</div><h3>${x.name}</h3><p>${x.desc}</p><div class="location">⌖ ${x.area}</div>${x.coord?`<div class="map"><span class="pin"></span><span class="coord">${x.coord}</span></div>`:''}</div><div class="card-bottom"><a class="source" href="${x.source}" target="_blank" rel="noreferrer">원문 보기 ↗</a>${x.id[0]!=='t'?`<button class="check ${d?'done':''}" data-id="${x.id}">${d?'✓ 완료됨':'완료 체크'}</button>`:''}</div></article>`}
function render(){stats();let data=state.view==='quests'?quests:state.view==='gear'?gear:state.view==='tips'?tips:all().filter(x=>state.done.includes(x.id));filters(data);let shown=data.filter(x=>(state.filter==='전체'||x.type===state.filter)&&`${x.name}${x.area}${x.desc}`.toLowerCase().includes(state.search.toLowerCase()));document.querySelector('#content').innerHTML=shown.length?`<div class="grid">${shown.map(card).join('')}</div>`:'<div class="empty">아직 모아 둔 기록이 없어요.<br>완료 체크를 누르면 이곳에 담깁니다.</div>';document.querySelector('#quest-count').textContent=quests.filter(x=>!state.done.includes(x.id)).length;document.querySelector('#gear-count').textContent=gear.filter(x=>!state.done.includes(x.id)).length;document.querySelectorAll('.check').forEach(b=>b.onclick=()=>toggle(b.dataset.id));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.view=b.dataset.view;state.filter='전체';render()});document.querySelector('#search').oninput=e=>{state.search=e.target.value;render()};render();
</script></body></html>
