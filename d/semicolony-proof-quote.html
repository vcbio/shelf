<style>
:root{--bg:#101720;--bg-deep:#0A0E14;--surface:#18222E;--line:#2A3849;--text:#EDF3FA;--text-dim:#8FA0B5;--accent:#227AFF;--accent2:#6AAEFF;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);}
body{font-family:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;
  background:radial-gradient(120% 80% at 80% -10%,rgba(34,122,255,.10),transparent 55%),linear-gradient(158deg,#14202D 0%,var(--bg) 44%,var(--bg-deep) 100%);
  background-attachment:fixed;min-height:100vh;padding-bottom:60px;}
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:rgba(16,23,32,.72);border-bottom:1px solid var(--line);}
.top .in{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;}
.back{color:var(--accent2);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:.01em;padding:6px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;transition:border-color .15s,color .15s;}
.back:hover{border-color:var(--accent);color:var(--accent);}
.top .wm{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:12px;font-weight:700;letter-spacing:.08em;}
.top .mark{width:15px;height:15px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent2));}
header.h{max-width:1440px;margin:0 auto;padding:40px 24px 26px;}
header.h h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.18;}

header.h .sub{margin-top:9px;font-size:15px;color:var(--text-dim);}
.gallery{max-width:1440px;margin:0 auto;padding:8px 24px 0;display:flex;flex-direction:column;gap:22px;}
.page{position:relative;width:100%;max-width:1400px;margin:0 auto;}
.page img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);box-shadow:0 20px 46px -24px rgba(0,0,0,.8);background:#fff;}
.page .pn{position:absolute;top:12px;left:12px;background:rgba(10,14,20,.78);color:var(--text);font-size:12px;font-weight:700;letter-spacing:.06em;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-variant-numeric:tabular-nums;}
footer.f{max-width:1440px;margin:34px auto 0;padding:20px 24px 0;border-top:1px solid var(--line);text-align:center;color:var(--text-dim);font-size:13.5px;letter-spacing:.01em;}
footer.f b{color:var(--text);font-weight:700;}
@media (max-width:640px){header.h h1{font-size:23px;}header.h{padding:28px 18px 20px;}.gallery{padding:6px 14px 0;}}
</style>
